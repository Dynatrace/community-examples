# special handling for "openshift" and "gke-autopilot" (deprecated)
platform: ""

#image qualifier; OBSOLETE -> use imageref instead!
# supply either image or imageref; if both supplied, imageref will be disregarded
image: ""
#image description using tags
#resulting image will be named <repository>:v<tag>
# imageRef.repository is intentionally empty so the chart's default image
# registry is used, which suits most distributions.
# GKE / GKE Autopilot only: the operator image must be pulled from the Dynatrace
# GKE Marketplace repository. For those clusters, and only those, set:
#   repository: "gcr.io/dynatrace-marketplace-prod/dynatrace-operator"
imageRef:
  repository: "" #path to repo
  tag: "" #defaults to chart version
  pullPolicy: ""

customPullSecret: ""
installCRD: true

# turns on the debug logs for all Operator components (operator/webhook/csi), does not include components that are deployed by the Operator
debugLogs: false
# creates a Job to migrate CRD storage during upgrade from old versions to the new one
crdStorageMigrationJob: true

operator:
  nodeSelector: {}
  tolerations: []
  labels: {}
  annotations: {}
  apparmor: false
  hostAvailabilityDetection: true
  crdStorageMigrationInitManager: true
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
  startupProbe: {} # configurable: periodSeconds, timeoutSeconds, failureThreshold

webhook:
  hostNetwork: false
  ports:
    server: 8443
    metrics: 8383
    healthProbe: 10080
  nodeSelector: {}
  tolerations: []
  labels: {}
  annotations: {}
  apparmor: false
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  requests:
    cpu: 300m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 128Mi
  highAvailability: true # DEPRECATED, will be removed in future release, only for migration purposes, we will ignore it when it is false, and consider the new values when it is true.
  replicas: 2 # Will be ignored when `highAvailability` is false, just for migration purposes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          internal.dynatrace.com/app: webhook
          internal.dynatrace.com/component: webhook
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          internal.dynatrace.com/app: webhook
          internal.dynatrace.com/component: webhook
  podDisruptionBudget:
    minAvailable: 1
    selector:
      matchLabels:
        internal.dynatrace.com/app: webhook
        internal.dynatrace.com/component: webhook
  validatingWebhook:
    timeoutSeconds: 10
  mutatingWebhook:
    failurePolicy: Ignore
    timeoutSeconds: 10
  volumes:
    certsDir:
      sizeLimit: 10Mi
  startupProbe: {} # configurable: periodSeconds, timeoutSeconds, failureThreshold

csidriver:
  enabled: false
  
rbac:
  activeGate:
    create: true
    annotations: {}
  kubernetesMonitoring:
    create: true
  edgeConnect:
    create: true
    annotations: {}
  extensions:
    create: true
    annotations: {}
    prometheus:
      create: true
    database:
      create: true
  telemetryIngest:
    create: true
    annotations: {}
  logMonitoring:
    create: true
    annotations: {}
  oneAgent:
    create: true
    annotations: {}
  kspm:
    create: true
    annotations: {}
  supportability: true
