<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Agent Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1a"/>
      <stop offset="45%" stop-color="#1a1230"/>
      <stop offset="100%" stop-color="#241238"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5b3aa8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#5b3aa8" stop-opacity="0"/>
    </radialGradient>
    <g id="spoke">
      <rect x="-9" y="-150" width="18" height="104" rx="9"/>
    </g>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g stroke="#3b7bd4" stroke-opacity=".28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M0 70h60v40h48"/><path d="M0 150h34v56h52"/><path d="M0 250h70v-38h44"/>
    <path d="M0 330h52v34h60"/><path d="M96 20v44h44"/><path d="M150 400v-46h50"/>
    <path d="M660 0v40h-42v38"/><path d="M800 96h-56v44"/>
  </g>
  <g fill="#3b7bd4" fill-opacity=".45">
    <circle cx="108" cy="110" r="3.5"/><circle cx="86" cy="206" r="3.5"/><circle cx="114" cy="212" r="3.5"/>
    <circle cx="112" cy="364" r="3.5"/><circle cx="140" cy="64" r="3.5"/><circle cx="200" cy="354" r="3.5"/>
    <circle cx="618" cy="78" r="3.5"/><circle cx="744" cy="140" r="3.5"/>
  </g>

  <!-- code snippets -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="452" y="48"  fill="#7fb2e8">class <tspan fill="#cfd6ea">Agent(ABC):</tspan></text>
    <text x="482" y="78"  fill="#9a86d8">def <tspan fill="#cfd6ea">learn_skills(self, skill_data):</tspan></text>
    <text x="512" y="100" fill="#8792b5">self.skills = load(skill_data)</text>
    <text x="482" y="130" fill="#9a86d8">def <tspan fill="#cfd6ea">apply(self, context):</tspan></text>
    <text x="512" y="152" fill="#8792b5">return self.invoke(context)</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" opacity=".75">
    <text x="28" y="356" fill="#7fb2e8">class <tspan fill="#aab3cc">Agent(ABC):</tspan></text>
    <text x="56" y="378" fill="#9a86d8">def <tspan fill="#aab3cc">learn_skills(self, skill_data):</tspan></text>
    <text x="84" y="400" fill="#7c86a5">return True</text>
  </g>

  <!-- burst mark -->
  <g transform="translate(250 214)" fill="#E2725B">
    <circle r="30"/>
    <g>
      <use href="#spoke"/>
      <use href="#spoke" transform="rotate(30)"/>
      <use href="#spoke" transform="rotate(60)"/>
      <use href="#spoke" transform="rotate(90)"/>
      <use href="#spoke" transform="rotate(120)"/>
      <use href="#spoke" transform="rotate(150)"/>
      <use href="#spoke" transform="rotate(180)"/>
      <use href="#spoke" transform="rotate(210)"/>
      <use href="#spoke" transform="rotate(240)"/>
      <use href="#spoke" transform="rotate(270)"/>
      <use href="#spoke" transform="rotate(300)"/>
      <use href="#spoke" transform="rotate(330)"/>
    </g>
  </g>

  <!-- title -->
  <g fill="#ffffff" font-family="DynatraceFlow,Roboto,Helvetica Neue,Helvetica,Arial,sans-serif"
     font-size="86" font-weight="700" letter-spacing="-1.5">
    <text x="440" y="252">Agent</text>
    <text x="440" y="342">Skills</text>
  </g>
</svg>
