metadata:
  version: '1'
  dependencies:
    apps:
    - id: dynatrace.automations
      version: ^1.3208.0
    - id: dynatrace.email
      version: ^1.10.8
  inputs: []
workflow:
  title: AI Units Quota Check
  description: ''
  schemaVersion: 4
  trigger:
    schedule:
      isActive: true
      trigger:
        type: interval
        intervalMinutes: 1
      filterParameters:
        earliestStart: '2025-03-26'
        earliestStartTime: '13:53'
      timezone: UTC
      inputs: {}
  result: null
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  guide: null
  tasks:

    check_for_ai_quota:
      name: check_for_ai_quota
      input:
        query: |
          fetch dt.system.events, from: -0d@d
          | filter event.kind == "BILLING_USAGE_EVENT"
          | filter event.type == "AI Units"
          | dedup event.id
          | summarize {
              ai_units = sum(usage.quantity.billable)
            }, by:{user.email}
          | filter ai_units > 1000
          | filterOut user.email in [
            fetch bizevents, from: -0d@d
            | filter event.type=="ai.units.quota.exceeded"
            | fields user.email
          ]
          | fields email = user.email, ai_units
      action: dynatrace.automations:execute-dql-query
      position:
        x: 0
        y: 1
      description: Query billing events to find users who exceeded their daily AI Units
        quota.
      predecessors: []
      customSampleResult:
        types:
        - mappings:
            email:
              type: string
            ai_units:
              type: double
          indexRange:
          - 0
          - 1
        records:
        - email: test@test.com
          ai_units: 1250
        metadata:
          grail:
            query: 'fetch dt.system.events | filter event.kind == "BILLING_USAGE_EVENT"
              | limit 2'
            locale: ''
            queryId: ea55b08a-f502-444a-9ad4-7fd1d7061ecd
            sampled: false
            timezone: Z
            dqlVersion: V1_0
            scannedBytes: 123
            notifications: []
            canonicalQuery: 'fetch dt.system.events | filter event.kind == "BILLING_USAGE_EVENT"
              | limit 2'
            scannedRecords: 123
            analysisTimeframe:
              end: '2023-01-01T01:01:01.002Z'
              start: '2023-01-01T01:01:01.001Z'
            executionTimeMilliseconds: 1

    check_for_quota_warning:
      name: check_for_quota_warning
      input:
        query: |
          fetch dt.system.events, from: -0d@d
          | filter event.kind == "BILLING_USAGE_EVENT"
          | filter event.type == "AI Units"
          | dedup event.id
          | summarize {
              ai_units = sum(usage.quantity.billable)
            }, by:{user.email}
          | filter ai_units > 800
          | filter ai_units <= 1000
          | filterOut user.email in [
            fetch bizevents, from: -0d@d
            | filter event.type=="ai.units.quota.warning"
            | fields user.email
          ]
          | filterOut user.email in [
            fetch bizevents, from: -0d@d
            | filter event.type=="ai.units.quota.exceeded"
            | fields user.email
          ]
          | fields email = user.email, ai_units
      action: dynatrace.automations:execute-dql-query
      position:
        x: 2
        y: 1
      description: Query billing events to find users approaching their daily AI Units
        quota (80–99%). Excludes users already warned or locked out today.
      predecessors: []
      customSampleResult:
        types:
        - mappings:
            email:
              type: string
            ai_units:
              type: double
          indexRange:
          - 0
          - 1
        records:
        - email: test@test.com
          ai_units: 900
        metadata:
          grail:
            query: 'fetch dt.system.events | filter event.kind == "BILLING_USAGE_EVENT"
              | limit 2'
            locale: ''
            queryId: ea55b08a-f502-444a-9ad4-7fd1d7061ecd
            sampled: false
            timezone: Z
            dqlVersion: V1_0
            scannedBytes: 123
            notifications: []
            canonicalQuery: 'fetch dt.system.events | filter event.kind == "BILLING_USAGE_EVENT"
              | limit 2'
            scannedRecords: 123
            analysisTimeframe:
              end: '2023-01-01T01:01:01.002Z'
              start: '2023-01-01T01:01:01.001Z'
            executionTimeMilliseconds: 1

    lock_out_users:
      name: lock_out_users
      input:
        script: |
          import { credentialVaultClient, businessEventsClient } from "@dynatrace-sdk/client-classic-environment-v2";
          import { execution } from '@dynatrace-sdk/automation-utils';

          const tokenUrl = 'https://sso.dynatrace.com/sso/oauth2/token';
          const baseUrl = 'https://api.dynatrace.com/';

          async function getOAuthToken(clientSecret) {
            const lastDotIndex = clientSecret.lastIndexOf('.');
            const clientId = clientSecret.substring(0, lastDotIndex);
            const data = new URLSearchParams({
              grant_type: 'client_credentials',
              client_id: clientId,
              client_secret: clientSecret
            });
            const response = await fetch(tokenUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: data
            });
            if (!response.ok) throw new Error(await response.text());
            const result = await response.json();
            return result.access_token;
          }

          async function callApi(api, token, method, data) {
            const response = await fetch(api, {
              method: method,
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: data
            });
            if (!response.ok) {
              const result = await response.text();
              console.log("Error: " + result);
              throw new Error(result);
            }
            if (method == "GET") {
              const result = await response.json();
              return result;
            }
          }

          export default async function({ executionId }) {
            const ex = await execution(executionId);
            const checkResult = await ex.result('check_for_ai_quota');
            const records = checkResult.records;
            const emails = records.map((item) => item.email);
            const unitsMap = Object.fromEntries(records.map((item) => [item.email, item.ai_units]));

            const credentialsList = await credentialVaultClient.listCredentials({ name: 'Quota check OAuth' });
            if (!credentialsList || credentialsList.totalCount == 0) {
              throw new Error('The credential "Quota check OAuth" was not found. Make sure it is available in the credential vault.');
            }
            const credentialId = (credentialsList.credentials.find(item => item.name === "Quota check OAuth")).id;
            const credentials = await credentialVaultClient.getCredentialsDetails({ id: credentialId });
            const accountId = credentials.username;
            const token = await getOAuthToken(credentials.password);

            const groups = await callApi(baseUrl + "iam/v1/accounts/" + accountId + "/groups", token, "GET");
            const group = groups.items.find(item => item.name == "AI Quota Exceeded");
            if (!group) {
              throw new Error('No user group with the name "AI Quota Exceeded" was found - please create this first in the account management portal.');
            }

            const lockResults = await Promise.allSettled(
              emails.map(email => callApi(baseUrl + "iam/v1/accounts/" + accountId + "/users/" + email, token, "POST", '["' + group.uuid + '"]'))
            );

            const lockedUsers = emails.filter((_, i) => lockResults[i].status === 'fulfilled');
            const lockFailures = emails.filter((_, i) => lockResults[i].status === 'rejected');
            if (lockFailures.length > 0) {
              console.log("Failed to lock out user(s): " + lockFailures.join(', '));
            }

            const bizResults = await Promise.allSettled(
              lockedUsers.map(email => businessEventsClient.ingest({
                body: { "event.type": "ai.units.quota.exceeded", "user.email": email, "ai_units": unitsMap[email] },
                type: 'application/json; charset=utf-8',
              }))
            );

            const bizFailures = bizResults.filter(r => r.status === 'rejected');
            if (bizFailures.length > 0) {
              console.log("Failed to ingest " + bizFailures.length + " business event(s). Check storage:events:write permission.");
            }

            const lockedUsersWithUnits = lockedUsers.map(email => ({ email, ai_units: unitsMap[email] }));
            return { lockedUsers, lockedUsersWithUnits };
          }
      action: dynatrace.automations:run-javascript
      position:
        x: 0
        y: 2
      conditions:
        custom: '{{ result("check_for_ai_quota").records|length > 0 }}'
        states:
          check_for_ai_quota: OK
      description: Add over-quota users to the AI Quota Exceeded group. Uses Promise.allSettled
        to isolate per-user failures and returns the list of successfully locked users.
      predecessors:
      - check_for_ai_quota

    send_email_about_ai_quota:
      name: send_email_about_ai_quota
      input:
        cc: []
        to:
        - '{{ _.item.email }}'
        bcc: []
        taskId: '{{ task().id }}'
        content: "Dear {{ _.item.email }},\n\nYou have exceeded your daily AI Units\
          \ quota in Dynatrace. Your usage today reached {{ _.item.ai_units | int\
          \ }} units (daily limit: 1,000 units).\n\nAccess to AI-powered features\
          \ has been temporarily restricted. If you need immediate access, please\
          \ contact your Dynatrace administrator to be removed from the \"AI Quota\
          \ Exceeded\" group.\n\nYour quota will be automatically reset at midnight\
          \ UTC."
        subject: Dynatrace AI Units Quota Exceeded
        executionId: '{{ execution().id }}'
        environmentUrl: '{{ environment().url }}'
      action: dynatrace.email:send-email
      active: true
      position:
        x: -1
        y: 2
      conditions:
        custom: '{{ result("check_for_ai_quota").records|length > 0 }}'
        states:
          check_for_ai_quota: OK
      withItems: item in {{result("check_for_ai_quota").records}}
      concurrency: 1
      description: Notify users that they have exceeded their daily AI Units quota.
      predecessors:
      - check_for_ai_quota

    send_admin_lockout_summary:
      name: send_admin_lockout_summary
      input:
        cc: []
        to:
        - 'admin@example.com'
        bcc: []
        taskId: '{{ task().id }}'
        subject: 'Dynatrace AI Units: {{ result("lock_out_users").lockedUsers | length
          }} user(s) locked out'
        content: "The following users have exceeded their daily AI Units quota and\
          \ have been restricted from AI-powered features:\n\n{% for item in result(\"\
          lock_out_users\").lockedUsersWithUnits %}- {{ item.email }} ({{ item.ai_units\
          \ | int }} units)\n{% endfor %}\nAccess will be automatically restored at\
          \ midnight UTC."
        executionId: '{{ execution().id }}'
        environmentUrl: '{{ environment().url }}'
      action: dynatrace.email:send-email
      active: true
      position:
        x: 0
        y: 3
      conditions:
        custom: '{{ result("lock_out_users").lockedUsers | length > 0 }}'
        states:
          lock_out_users: OK
      description: 'Send an admin summary listing all users locked out in this execution.
        CONFIGURE: replace admin@example.com with your admin or team email address.'
      predecessors:
      - lock_out_users

    send_quota_warning_email:
      name: send_quota_warning_email
      input:
        cc: []
        to:
        - '{{ _.item.email }}'
        bcc: []
        taskId: '{{ task().id }}'
        content: "Dear {{ _.item.email }},\n\nYou are approaching your daily AI\
          \ Units quota in Dynatrace. Your current usage is {{ _.item.ai_units | int\
          \ }} units out of 1,000 ({{ (_.item.ai_units / 1000 * 100) | round(1) }}%\
          \ of your daily limit).\n\nTo avoid being locked out of AI-powered features,\
          \ please reduce your usage for the remainder of the day.\n\nYour quota will\
          \ reset automatically at midnight UTC."
        subject: Dynatrace AI Units - Approaching Daily Quota
        executionId: '{{ execution().id }}'
        environmentUrl: '{{ environment().url }}'
      action: dynatrace.email:send-email
      active: true
      position:
        x: 2
        y: 2
      conditions:
        custom: '{{ result("check_for_quota_warning").records|length > 0 }}'
        states:
          check_for_quota_warning: OK
      withItems: item in {{result("check_for_quota_warning").records}}
      concurrency: 1
      description: Warn users that they are approaching their daily AI Units quota.
      predecessors:
      - check_for_quota_warning

    log_quota_warning_events:
      name: log_quota_warning_events
      input:
        script: |
          import { businessEventsClient } from "@dynatrace-sdk/client-classic-environment-v2";
          import { execution } from '@dynatrace-sdk/automation-utils';

          export default async function({ executionId }) {
            const ex = await execution(executionId);
            const checkResult = await ex.result('check_for_quota_warning');
            const emails = checkResult.records.map((item) => item.email);

            const results = await Promise.allSettled(
              emails.map(email => businessEventsClient.ingest({
                body: { "event.type": "ai.units.quota.warning", "user.email": email },
                type: 'application/json; charset=utf-8',
              }))
            );

            const failures = results.filter(r => r.status === 'rejected');
            if (failures.length > 0) {
              console.log("Failed to log " + failures.length + " warning event(s). Check storage:events:write permission.");
            }
          }
      action: dynatrace.automations:run-javascript
      position:
        x: 3
        y: 2
      conditions:
        custom: '{{ result("check_for_quota_warning").records|length > 0 }}'
        states:
          check_for_quota_warning: OK
      description: Ingest business events to prevent duplicate warning emails for
        the same user on the same day.
      predecessors:
      - check_for_quota_warning

    quota_reset_at_midnight:
      name: quota_reset_at_midnight
      input:
        script: |
          import { credentialVaultClient } from "@dynatrace-sdk/client-classic-environment-v2";

          const tokenUrl = 'https://sso.dynatrace.com/sso/oauth2/token';
          const baseUrl = 'https://api.dynatrace.com/';

          async function getOAuthToken(clientSecret) {
            const lastDotIndex = clientSecret.lastIndexOf('.');
            const clientId = clientSecret.substring(0, lastDotIndex);
            const data = new URLSearchParams({
              grant_type: 'client_credentials',
              client_id: clientId,
              client_secret: clientSecret
            });
            const response = await fetch(tokenUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: data
            });
            if (!response.ok) throw new Error(await response.text());
            const result = await response.json();
            return result.access_token;
          }

          async function callApi(api, token, method, data) {
            const response = await fetch(api, {
              method: method,
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: data
            });
            if (!response.ok) {
              const result = await response.text();
              console.log("Error: " + result);
              throw new Error(result);
            }
            if (method == "GET") {
              const result = await response.json();
              return result;
            }
          }

          export default async function() {
            const credentialsList = await credentialVaultClient.listCredentials({ name: 'Quota check OAuth' });
            if (!credentialsList || credentialsList.totalCount == 0) {
              throw new Error('The credential "Quota check OAuth" was not found. Make sure it is available in the credential vault.');
            }
            const credentialId = (credentialsList.credentials.find(item => item.name === "Quota check OAuth")).id;
            const credentials = await credentialVaultClient.getCredentialsDetails({ id: credentialId });
            const accountId = credentials.username;
            const token = await getOAuthToken(credentials.password);

            const groups = await callApi(baseUrl + "iam/v1/accounts/" + accountId + "/groups", token, "GET");
            const group = groups.items.find(item => item.name == "AI Quota Exceeded");
            if (!group) {
              throw new Error('No user group with the name "AI Quota Exceeded" was found - please create this first in the account management portal.');
            }

            const users = await callApi(baseUrl + "iam/v1/accounts/" + accountId + "/groups/" + group.uuid + "/users", token, "GET");
            const userIds = users.items.map(item => item.email);

            await Promise.allSettled(
              userIds.map(email => callApi(baseUrl + "iam/v1/accounts/" + accountId + "/users/" + email + "/groups?group-uuid=" + group.uuid, token, "DELETE"))
            );

            return userIds;
          }
      action: dynatrace.automations:run-javascript
      position:
        x: -1
        y: 1
      conditions:
        else: STOP
        custom: '{{now("UTC").strftime("%H:%M") == "00:00"}}'
        states: {}
      description: Remove all users from the AI Quota Exceeded group at midnight UTC
        to reset access for the new day.
      predecessors: []
