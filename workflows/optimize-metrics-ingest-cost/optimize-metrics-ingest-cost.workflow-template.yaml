          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
