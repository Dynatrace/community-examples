          console.log(`read_extensions: ${label} starts`);
          // the metrics that are analysed (the largest by data points), chosen once by the step select_metrics: an app can only feature a metric that is analysed
          const selected = await result("select_metrics");
          const keys = new Set((Array.isArray(selected && selected.keys) ? selected.keys : []).map((k) => String(k ?? "")).filter(Boolean));
          if (!keys.size) throw new Error("lookup returned nothing (no billable metric keys)");

          const all = await listInstalled();
          const mine = all.filter((name) => sliceOf(name, N) === slice);
          console.log(`read_extensions: ${label} reads ${mine.length} of ${all.length} installed extensions`);
          const queue = [...mine];
          const done = [];
          const failed = [];
          let notActive = 0;
          let finished = 0;
          const worker = async () => {
            for (;;) {
              const name = queue.shift();
              if (!name) return;
              if (Date.now() - t0 > STOP_MS) {
                failed.push(`${name}: not read, the slice ran out of time (${Math.round(STOP_MS / 1000)} s)`);
                continue;
              }
              try {
                const r = await readOne(name, keys);
                if (r) done.push(r);
                else notActive++;
              } catch (e) {
                failed.push(message(e));
              }
              finished++;
              if (finished % 25 === 0) console.log(`read_extensions: ${label}: ${finished} of ${mine.length} read (${secondsSince(t0)} s)`);
            }
          };
          await Promise.all(Array.from({ length: Math.min(CONCURRENCY, mine.length) }, worker));
          const slowest = [...done].sort((a, b) => b.size - a.size)[0];
          console.log(`read_extensions: ${label} done: ${done.length} read, ${notActive} not active, ${failed.length} failed, ${secondsSince(t0)} s${slowest ? `, largest package ${slowest.name} ${fmtBytes(slowest.size)}` : ""}`);
          if (failed.length) {
            throw new Error(
              [
                `Reading the installed extensions failed in ${label}: ${failed.length} of ${mine.length} extensions could not be read.`,
                failed.slice(0, 5).map((f) => `- ${f}`).join("\n") + (failed.length > 5 ? `\n- and ${failed.length - 5} more (see the log of the step)` : ""),
                `This tenant has ${all.length} installed extensions (one run reads up to ${plan.extensionLimit ?? 300}). In this slice ${done.length} were read in ${secondsSince(t0)} s.`,
                "Nothing was analysed, because a metric that an app shows could be reported as unused.\nWhat to do: Run the workflow again. If it fails again, send this message to the workflow owner.",
              ].join("\n\n"),
            );
          }

          const appsOf = new Map();
          for (const r of done) {
            for (const k of r.featured) {
              if (!appsOf.has(k)) appsOf.set(k, new Set());
              for (const a of r.apps) appsOf.get(k).add(a);
            }
          }
          // classic cloud metrics that the repo recommends (no da-* extension declares them): the Clouds app shows them. Slice 0 adds them; the merge in classify is a union per metric.
          if (slice === 0) {
            let classic = 0;
            for (const k of keys) {
              if (!CLASSIC_CLOUD_KEYS.has(k)) continue;
              if (!appsOf.has(k)) appsOf.set(k, new Set());
              appsOf.get(k).add(CLOUD_APP);
              classic++;
            }
            console.log(`read_extensions: ${label}: ${classic} analysed metrics are classic cloud metrics that the Clouds app shows`);
          }
          const apps = {};
          for (const [k, set] of [...appsOf].sort((x, y) => (x[0] < y[0] ? -1 : 1))) apps[k] = [...set].sort();
          return {
            slice,
            complete: true,
            listed: all.length,
            mine: mine.length,
            read: done.length,
            notActive,
            billableKeys: keys.size,
            apps,
            perExtension: done.sort((a, b) => (a.name < b.name ? -1 : 1)).map((r) => ({ name: r.name, version: r.version, kind: r.kind, apps: r.apps, featured: r.featured.size, kb: Math.round(r.size / 1024) })),
            seconds: secondsSince(t0),
          };
        }

  classify:
    name: classify
    position:
      x: 0
      y: 4
    description: Add the slices up, classify the metrics (with the 30-day query history and the apps that show them) and ingest the usage metrics
    action: dynatrace.automations:run-javascript
    conditions:
      states:
        read_artifacts: ANY
        rescue_one: ANY
    predecessors:
      - read_artifacts
      - plan_rescue
      - rescue_one
      - query_history
      - read_extensions
      - select_metrics
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 50000; // a metric with more series in the last hour is skipped: its sample would not give a valid ratio
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- hand-over between tasks
        // The result of a task is limited to about 5 MB, and the results of all slices reach one task. A slice therefore packs its counts (gzip, then
        // base64 text). Gzip is lossless (and checks its own contents with a CRC32 when it is unpacked); the length of the unpacked text and a checksum of the packed
        // bytes are checked on arrival, so damaged data stops the run. The checksum is over the PACKED bytes (final52): over the unpacked text it took 10 to 11 s for a
        // slice of 16 million characters in the task runtime (the largest customer tenant), more than the whole unpacking (2 s), and the merge of 21 such slices ran
        // out of its 120 seconds.
        const fnvBytes = (b) => {
          let h = 0x811c9dc5;
          for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 16777619) >>> 0;
          return h.toString(16);
        };
        async function gzipText(text) {
          const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        }
        async function gunzipBytes(bytes) {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }
        function toBase64(bytes) {
          let s = "";
          for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          return btoa(s);
        }
        function fromBase64(b64) {
          const s = atob(b64);
          const out = new Uint8Array(s.length);
          for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
          return out;
        }
        async function pack(value) {
          const text = JSON.stringify(value);
          const bytes = await gzipText(text);
          return { format: "gzip+base64", length: text.length, checksum: fnvBytes(bytes), data: toBase64(bytes) };
        }
        async function unpack(p) {
          if (!p || p.format !== "gzip+base64") throw new Error("a slice handed over its counts in an unknown format");
          let text;
          try {
            const bytes = fromBase64(p.data);
            if (fnvBytes(bytes) !== p.checksum) throw new Error("the checksum of the packed bytes differs");
            text = await gunzipBytes(bytes);
          } catch (e) {
            throw new Error(`the counts handed over by a slice are damaged (they cannot be unpacked${e && e.message ? `: ${e.message}` : ""}); nothing was analysed`);
          }
          if (text.length !== p.length) throw new Error("the counts handed over by a slice are damaged (length or checksum differ); nothing was analysed");
          return JSON.parse(text);
        }

        const DRY_RUN = false; // true: measure only, nothing is ingested

        const q = (s) => `"${s.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
        // every line of a run gets the time the run started (set from the plan), so a run is one snapshot of the dashboard, however long it takes
        let RUN_TS = 0;
        const stamp = (l) => (RUN_TS > 0 ? `${l} ${RUN_TS}` : l);
        async function ingest(ls) {
          let o = 0;
          let bad = 0;
          for (let i = 0; i < ls.length; i += 1000) {
            const res = await retry(() => metricsClient.ingest({ body: ls.slice(i, i + 1000).map(stamp).join("\n") }));
            o += res.linesOk ?? 0;
            bad += res.linesInvalid ?? 0;
          }
          if (bad > 0 || o !== ls.length) throw new Error(`ingest problem: ${o} ok, ${bad} invalid, ${ls.length} sent`);
          return o;
        }

        const ANALYSIS_METRIC = "custom.metrics_usage.analysis"; // the numbers of the analysis: total and analysed metrics and data points (kind)
        const ANALYZED_METRIC = "custom.metrics_usage.analyzed"; // one line per analysed metric, written only when the tenant has more metrics than the limit
        /** Ingest in chunks of 1,000 lines, eight at a time (the usage of 10,000 metrics is about 60,000 lines). */
        async function ingestParallel(ls) {
          const chunks = [];
          for (let i = 0; i < ls.length; i += 1000) chunks.push(ls.slice(i, i + 1000));
          let ok = 0;
          let bad = 0;
          await pmap(chunks, 8, async (chunk) => {
            const res = await retry(() => metricsClient.ingest({ body: chunk.map(stamp).join("\n") }));
            ok += res.linesOk ?? 0;
            bad += res.linesInvalid ?? 0;
          });
          if (bad > 0 || ok !== ls.length) throw new Error(`ingest problem: ${ok} ok, ${bad} invalid, ${ls.length} sent`);
          return ok;
        }

        /**
         * The number of apps that show each metric, from the slices of the extension reading. Every slice has to be there and complete, and the extensions the slices
         * accounted for have to match the number the plan counted (a few may have been installed or removed meanwhile): otherwise a metric that an app shows could
         * pass as unused.
         */
        function mergeExtensionSlices(plan, results) {
          const bySlice = new Map();
          for (const r of Array.isArray(results) ? results : []) if (r && typeof r.slice === "number" && r.complete === true) bySlice.set(r.slice, r);
          const missing = plan.extensionSlices.filter((x) => !bySlice.has(x));
          if (missing.length) throw new Error(`The extension reading has no complete result for slice(s) ${missing.map((x) => x + 1).join(", ")} of ${plan.extensionSlices.length}: the apps that show a metric are unknown, so nothing was analysed.`);
          const accounted = plan.extensionSlices.reduce((n, x) => n + bySlice.get(x).mine, 0);
          if (Math.abs(accounted - plan.extensions) > Math.max(2, Math.floor(plan.extensions / 100))) throw new Error(`The extension reading accounted for ${accounted} installed extensions, the plan counted ${plan.extensions}: some were not read, so nothing was analysed. Run the workflow again.`);
          const apps = new Map();
          for (const x of plan.extensionSlices) {
            for (const [key, list] of Object.entries(bySlice.get(x).apps)) {
              if (!apps.has(key)) apps.set(key, new Set());
              for (const a of list) apps.get(key).add(a);
            }
          }
          return new Map([...apps].map(([key, set]) => [key, set.size]));
        }

        export default async function () {
          const t0 = Date.now();
          const timings = {};
          const lap = (name, t) => {
            timings[name] = Math.round((Date.now() - t) / 100) / 10;
          };
          const plan = await result("plan");
          RUN_TS = Number(plan.startedAtMs) || 0;
          const allReads = await result("read_artifacts");
          // a slice that was retried leaves an empty entry for its failed attempt: take the one result of every slice, and every slice has to be there
          const bySlice = new Map();
          for (const r of Array.isArray(allReads) ? allReads : []) if (r && typeof r.slice === "number") bySlice.set(r.slice, r);
          // a slice that failed in read_artifacts was read again by plan_rescue and rescue_one: all of it but the notebooks in one piece, and every notebook alone. A notebook
          // that cannot be read, even alone, is skipped: it is listed here and in the report. Nothing is skipped because of its size, only what really fails.
          const rescue = await result("plan_rescue");
          const failedSlices = arr(rescue && rescue.failed);
          let rescued = [];
          try {
            rescued = arr(await result("rescue_one")).filter((r) => r && typeof r.slice === "number");
          } catch {
            /* nothing was read again */
          }
          const restBySlice = new Map(rescued.filter((r) => r.mode === "rest").map((r) => [r.slice, r]));
          const noteParts = rescued.filter((r) => r.mode === "notebook");
          const missing = plan.slices.filter((s) => !bySlice.has(s) && !(failedSlices.includes(s) && restBySlice.has(s)));
          if (missing.length) throw new Error(`no result for slice(s) ${missing.join(", ")} of ${plan.sliceCount}: some artifacts were not read`);
          const gotNotebooks = new Set(noteParts.map((r) => String(r.docId)));
          const skippedNotebooks = arr(rescue && rescue.notebooks).filter((nb) => !gotNotebooks.has(String(nb.id)));
          for (const nb of skippedNotebooks) {
            console.log(`SKIPPED notebook ${nb.id}${nb.name ? ` ("${nb.name}")` : ""} (slice ${nb.slice}): it could not be read, also when read alone (the task failed or ran out of memory). The metrics that only this notebook uses are not counted as used: check it before you drop a metric.`);
          }
          if (failedSlices.length) console.log(`${failedSlices.length} slice(s) of read_artifacts failed (${failedSlices.join(", ")}) and were read again in pieces: ${noteParts.length} notebooks read alone, ${skippedNotebooks.length} skipped.`);
          const reads = [
            ...plan.slices.filter((s) => bySlice.has(s)).map((s) => bySlice.get(s)),
            ...failedSlices.filter((s) => !bySlice.has(s)).map((s) => restBySlice.get(s)),
            ...noteParts,
          ];
          // the apps that show a metric (Unified analysis): the slices of the extension reading collected them; every slice must be there and complete
          const uaCount = mergeExtensionSlices(plan, await result("read_extensions"));

          let t = Date.now();
          // the executed-query history of the last 30 days comes from the query_history task, which runs in parallel with the slices
          const hist = await result("query_history");
          if (!hist || !Array.isArray(hist.runs30) || !Array.isArray(hist.spec30)) throw new Error("the query_history task returned no history");
          // the metrics that are analysed: the largest by data points, chosen once by the step select_metrics (a tenant can have far more than one run analyses)
          const selected = await result("select_metrics");
          if (!selected || !Array.isArray(selected.keys) || !selected.keys.length || selected.keys.length !== arr(selected.dps).length) throw new Error("the step select_metrics returned no list of metrics");
          lap("lookups", t);
          const dpByKey = new Map(selected.keys.map((k, i) => [str(k), Number(selected.dps[i]) || 0]));
          const billableKeys = new Set(selected.keys.map(str).filter(Boolean));
          if (!billableKeys.size) throw new Error("lookup returned nothing (no billable metric keys)");

          // add the slices up: every artifact was in one slice, so counts add
          const addN = (m, k, n) => m.set(k, (m.get(k) ?? 0) + n);
          const used = new Map();
          const scope = new Map();
          const dimUse = new Map();
          const artifacts = { dashboards: 0, notebooks: 0, workflows: 0, slos: 0, classicSlos: 0, anomalyDetectors: 0 };
          let queryStrings = 0;
          let skipped = 0;
          const unparsed = [];
          let unparsedCount = 0;
          for (const r of reads) {
            const c = await unpack(r.packed);
            if (c.used.length !== r.entries.used || c.scope.length !== r.entries.scope || c.dims.length !== r.entries.dims) throw new Error(`slice ${r.slice}: the number of entries handed over differs from the number sent`);
            // only the analysed metrics are written (the slices filter by the same list: this is the second check, so that nothing outside it is ever written)
            for (const [token, kind, n] of c.used) if (billableKeys.has(token)) addN(used, `${token}\u0000${kind}`, n);
            for (const [key, kind, sc, n] of c.scope) if (billableKeys.has(key)) addN(scope, `${key}\u0000${kind}\u0000${sc}`, n);
            for (const [key, d, n] of c.dims) if (billableKeys.has(key)) addN(dimUse, `${key}\u0000${d}`, n);
            for (const k of Object.keys(artifacts)) artifacts[k] += r.read[k] ?? 0;
            queryStrings += r.queryStrings;
            skipped += r.skipped;
            unparsedCount += r.unparsedCount ?? 0;
            for (const u of arr(r.unparsed)) if (unparsed.length < 50) unparsed.push(u);
          }
          // every artifact the plan counted has to be accounted for by the slices. Documents are listed by every slice (a few can have been created or
          // deleted during the run); workflows, SLOs and anomaly detectors are fixed by the plan, so their numbers have to match exactly.
          for (const [k, planned] of [["dashboards", plan.dashboards], ["notebooks", plan.notebooks]]) {
            if (Math.abs(artifacts[k] + (k === "notebooks" ? skippedNotebooks.length : 0) - planned) > Math.max(5, Math.floor(planned / 100))) throw new Error(`the slices read ${artifacts[k]} ${k}, the plan counted ${planned}: some artifacts were not read`);
          }
          for (const [k, planned] of [["workflows", plan.workflows], ["slos", plan.slos], ["classicSlos", plan.classicSlos], ["anomalyDetectors", plan.detectors]]) {
            if (artifacts[k] !== planned) throw new Error(`the slices read ${artifacts[k]} ${k}, the plan counted ${planned}: ${k} changed while the workflow ran, or some were not read. Run the workflow again; nothing was analysed.`);
          }

          t = Date.now();
          const lines = [];
          for (const [k, n] of used) {
            const [token, kind] = k.split("\u0000");
            lines.push(`${METRIC},metric_key=${q(token)},artifact_type=${q(kind)} ${n}`);
          }
          for (const [k, n] of scope) {
            const [key, kind, sc] = k.split("\u0000");
            lines.push(`${SCOPE_METRIC},metric_key=${q(key)},artifact_type=${q(kind)},scope=${q(sc)} ${n}`);
          }
          for (const [k, n] of dimUse) {
            const [key, d] = k.split("\u0000");
            lines.push(`${DIM_METRIC},metric_key=${q(key)},dimension=${q(d)} ${n}`);
          }
          // Unified analysis: one more artifact kind, the number of apps that show the metric (no scope line: what the apps do with the dimensions is not known)
          let uaMetrics = 0;
          for (const [key, n] of uaCount) {
            if (n >= 1 && billableKeys.has(key)) {
              lines.push(`${METRIC},metric_key=${q(key)},artifact_type=${q("unified-analysis")} ${n}`);
              uaMetrics++;
            }
          }
          // the analysis: its numbers (always), and the analysed metrics themselves (only when the tenant has more metrics than the limit: the dashboard and the report
          // then list these and no other)
          for (const [kind, n] of [["total_metrics", selected.totalMetrics], ["analyzed_metrics", selected.analyzedMetrics], ["total_data_points", selected.totalDp], ["analyzed_data_points", selected.analyzedDp]]) lines.push(`${ANALYSIS_METRIC},kind=${q(kind)} ${Math.round(Number(n) || 0)}`);
          if (selected.cut) for (const k of billableKeys) lines.push(`${ANALYZED_METRIC},metric_key=${q(k)} 1`);
          if (lines.length > MAX_LINES) throw new Error(`snapshot too large: ${lines.length} series (limit ${MAX_LINES}), nothing ingested`);
          const ok = DRY_RUN ? 0 : await ingestParallel(lines);
          lap("ingest", t);

          // the dashboard's "Unused dimensions" result: used, and only ever with specific dimensions (never for a metric that an app shows: the dashboard calls it Used)
          const qRuns = new Map(hist.runs30);
          const qSpec = new Map(hist.spec30.map(([k, specific, dims]) => [k, { specific, dims }]));
          const artScope = new Map();
          for (const [k, n] of scope) {
            const [key, , sc] = k.split("\u0000");
            const e = artScope.get(key) ?? { all: 0, specific: 0 };
            if (sc === "all-series") e.all += n;
            else e.specific += n;
            artScope.set(key, e);
          }
          const artifactUsed = new Set([...used.keys()].map((k) => k.split("\u0000")[0]));
          const artDims = new Map();
          for (const k of dimUse.keys()) {
            const [key, d] = k.split("\u0000");
            if (!artDims.has(key)) artDims.set(key, new Set());
            artDims.get(key).add(d);
          }
          const targets = [];
          for (const key of billableKeys) {
            const runs = qRuns.get(key) ?? 0;
            const qs = qSpec.get(key);
            const runsSpecific = qs?.specific ?? 0;
            const runsAll = Math.max(runs - runsSpecific, 0);
            const a = artScope.get(key) ?? { all: 0, specific: 0 };
            const isUsed = runs >= 1 || artifactUsed.has(key);
            if (isUsed && runsSpecific + a.specific > 0 && runsAll + a.all === 0 && (uaCount.get(key) ?? 0) < 1) {
              targets.push({ key, dims: [...new Set([...(qs?.dims ?? []), ...(artDims.get(key) ?? [])])], dp: dpByKey.get(key) ?? 0 });
            }
          }
          targets.sort((a, b) => b.dp - a.dp || (a.key < b.key ? -1 : 1)); // largest first: if time runs out later, the small ones are skipped
          // how near the run came to its limits, for whoever reads the log of a customer run (the numbers come from the step query_history)
          const hr = hist.headroom;
          if (hr) {
            const p = (n, limit) => (limit ? `${Math.round((100 * (Number(n) || 0)) / limit)}%` : "n/a");
            console.log(`headroom (share of each limit): different metric and dimension pairs ${p(hr.pairs, hr.pairsLimit)}, history hand-over ${p(hr.handoverBytes, hr.handoverLimit)}, largest history read ${p(hr.peakReadBytes, hr.peakReadLimit)}, adding up the history ${p(hr.mergeSeconds, hr.mergeSecondsLimit)} of the time of a task, lines to ingest ${p(hr.lines, hr.linesLimit)}; ${plan.sliceCount} artifact slices, ${skippedNotebooks.length} notebook(s) skipped`);
          }
          return {
            metric: METRIC,
            dryRun: DRY_RUN,
            artifacts: { ...artifacts, slos: artifacts.slos + artifacts.classicSlos }, // the SLO total holds the classic ones too
            classicSlos: artifacts.classicSlos,
            slices: plan.sliceCount,
            queryStrings,
            analysisQueriesSkipped: skipped,
            unparsedDocuments: { count: unparsedCount, items: unparsed }, // documents whose text could not be parsed: read as plain text, their keys count as used
            skippedDocuments: { count: skippedNotebooks.length, items: skippedNotebooks.slice(0, 50).map((nb) => ({ kind: "notebook", id: str(nb.id), name: str(nb.name) })) }, // notebooks that could not be read, also alone: skipped, the report says so
            series: lines.length,
            linesIngested: ok,
            unusedDimensionMetrics: targets.length,
            unifiedAnalysisMetrics: uaMetrics,
            targets,
            seconds: Math.round((Date.now() - t0) / 100) / 10,
            timings,
          };
        }

  series_plan:
    name: series_plan
    position:
      x: 0
      y: 5
    description: Plan the estimate of the saving of dropping unused dimensions by size (series times fields) before anything is read, and skip the metrics that are too large; it never fails the run
    action: dynatrace.automations:run-javascript
    predecessors:
      - classify
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 40000; // a metric with this many series or more in the last hour is skipped (not estimated): its sample would not give a valid ratio, and one read of it must fit into the 256 MB of the script (a metric of 49,500 series of about 1 KB each ran it out of memory when read alone, 40,000 did not)
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- the sizes of the estimate (shared by series_plan and read_series)
        // The size of a read is "cells": series times fields (a record with 39 fields costs about twice as much as one with 20). Measured limits: 40,000 series of about
        // 20 fields (800,000 cells) of one metric were read alone without trouble, 49,500 series of the same width (990,000 cells) ran a script out of memory, and
        // 24,004 series of 39 fields (936,000 cells, together with other reads) did too.
        const SERIES_CELLS_MAX = 600000; // series x fields of one metric above which it is not read (the largest read that is known to be safe is 800,000)
        const SERIES_CELLS_BATCH = 150000; // one query reads about this many cells (6,000 series of 25 fields)
        const SERIES_CELLS_GROUP = 600000; // cells that one slice reads in all: all its batches are read in the same task, some at the same time
        const SERIES_MEASURE_FROM = 200; // metrics with at least this many series are measured by a sample; a smaller one is at most 20,000 cells
        const SERIES_ASSUMED_FIELDS = 100; // fields assumed for a metric that is not measured
        const SERIES_SAMPLE = 50; // series read to measure the width of a metric
        const SERIES_WIDTH_MARGIN = 1.25; // a sample may miss a wider series
        const MAX_SERIES_GROUPS = 40; // slices of the loop; metrics beyond them (the smallest, as the metrics are in the order of their data points) are not estimated
        const SERIES_COUNT_KEYS = 20;


        // ---------------------------------------------------------------- series_plan
        // The estimate of the saving from unused dimensions reads the series of a metric (one record per series, with all its dimensions) and works out how many series
        // remain without the unused dimensions. A script gets 256 MB, so what is read has to be planned by SIZE before anything is read. The size of a read is
        // "cells": series times fields (a record with 39 fields costs about twice as much as one with 20). Measured limits: 40,000 series of about 20 fields (800,000
        // cells) of one metric were read alone without trouble, 49,500 series of the same width (990,000 cells) ran a script out of memory, and 24,004 series of 39
        // fields (936,000 cells, together with other reads) did too.
        // This task only counts and measures (small results), then decides for every metric that has series:
        //   - no series in the last hour, or too large (see below): not read; the workflow writes a marker line, and the metric is reported as not estimated;
        //   - otherwise it goes into a batch (one query, a few metrics) and a batch into a group; each group is one slice of the loop read_series.
        // "Too large" is SERIES_CAP series or more, or more than SERIES_CELLS_MAX cells. Nothing here can fail the run: if the planning fails, the estimate is left out.
        // The time of the planning (final55): the step stops starting waves after this many ms (a task is stopped at 120 s; the largest customer tenant needed 117 s for 3,000
        // analysed metrics, the step failed at 10,000), and does not measure after the grace period; queries of a wave run SERIES_PLAN_PARALLEL at a time.
        const SERIES_PLAN_BUDGET_MS = 90000;
        const SERIES_PLAN_GRACE_MS = 10000;
        const SERIES_PLAN_PARALLEL = 8;
        const cellsOf = (series, fields) => Math.ceil(series * fields);

        /**
         * The plan from the numbers: which metrics are not read, and how the others are put into batches and groups. Pure (no queries), so that it can be tested.
         * `metrics` are in the order they should be read (largest first): [{ key, series, fields }] where `fields` is the measured or assumed width.
         */
        function planSeries(metrics) {
          const direct = [];
          const batches = [];
          let cur = null;
          for (const m of metrics) {
            const cells = cellsOf(m.series, m.fields);
            if (m.series === 0) {
              direct.push({ key: m.key, kind: "none", series: 0, fields: m.fields, cells: 0 });
            } else if (m.series >= SERIES_CAP) {
              direct.push({ key: m.key, kind: "capped", series: m.series, fields: m.fields, cells, why: `${m.series} series (the limit is ${SERIES_CAP})` });
            } else if (cells > SERIES_CELLS_MAX) {
              direct.push({ key: m.key, kind: "capped", series: m.series, fields: m.fields, cells, why: `${m.series} series of ${m.fields} fields, ${cells} cells (the limit is ${SERIES_CELLS_MAX})` });
            } else if (cur && cur.keys.length < SERIES_BATCH && cur.cells + cells <= SERIES_CELLS_BATCH) {
              cur.keys.push(m.key);
              cur.series.push(m.series);
              cur.cells += cells;
            } else {
              cur = { keys: [m.key], series: [m.series], cells };
              batches.push(cur);
            }
          }
          const groups = [];
          let g = null;
          for (const b of batches) {
            if (g && g.cells + b.cells <= SERIES_CELLS_GROUP) {
              g.batches.push(b);
              g.cells += b.cells;
            } else {
              g = { batches: [b], cells: b.cells };
              groups.push(g);
            }
          }
          // more groups than the loop has: the rest is not read (it is the smallest part, in the order of data points)
          const notReached = groups.slice(MAX_SERIES_GROUPS).flatMap((x) => x.batches.flatMap((b) => b.keys));
          return { direct, groups: groups.slice(0, MAX_SERIES_GROUPS), notReached };
        }

        export default async function () {
          const t0 = Date.now();
          const cls = await result("classify");
          const targets = arr(cls.targets).map((x) => ({ key: str(x.key), dp: Number(x.dp) || 0 })).filter((x) => x.key);
          const out = { groupIds: [0], groups: [{ batches: [], cells: 0 }], direct: [], notReached: [], measured: 0, error: "", seconds: 0 }; // a loop always has one slice, even with nothing to read
          try {
            const counts = new Map();
            const widths = new Map();
            // a metrics query stops after about 100,000 series records and then returns the counts of an arbitrary part of them: a count is only trusted
            // while the whole chunk is below SERIES_CAP, otherwise every key of the chunk is counted on its own
            const countKeys = async (keys) => {
              const rows = await dql(`metrics from: now()-1h\n| filter in(metric.key, ${keys.map((k) => JSON.stringify(k)).join(", ")})\n| summarize n = count(), by:{metric.key}`, keys.length * 2 + 10);
              const res = new Map(keys.map((k) => [k, 0]));
              for (const r of rows) if (res.has(str(r["metric.key"]))) res.set(str(r["metric.key"]), Number(r.n) || 0);
              return res;
            };
            // The metrics are planned largest first, in waves, within a time budget (final55): counting and measuring every candidate took 117 s for 3,000 analysed metrics
            // on the largest customer tenant (a task is stopped at 120 s, and the step failed at 10,000). The estimate reads at most MAX_SERIES_GROUPS slices anyway, and what
            // is not planned is named "not estimated in this run", as what does not fit into the slices always was.
            const ordered = targets.map((t, i) => ({ ...t, i })).sort((x, y) => y.dp - x.dp || x.i - y.i);
            const deadline = t0 + SERIES_PLAN_BUDGET_MS;
            const hardStop = t0 + SERIES_PLAN_BUDGET_MS + SERIES_PLAN_GRACE_MS; // the measuring of a wave does not go on after this
            const metrics = [];
            let at = 0;
            let waveMs = 0;
            let recounted = 0;
            let countingMs = 0;
            let measuringMs = 0;
            let waves = 0;
            let stoppedBy = "";
            while (at < ordered.length) {
              if (waves > 0 && Date.now() + waveMs * 1.3 > deadline) {
                stoppedBy = "time";
                break;
              }
              const w0 = Date.now();
              const wave = ordered.slice(at, at + SERIES_COUNT_KEYS * SERIES_PLAN_PARALLEL);
              const chunks = [];
              for (let i = 0; i < wave.length; i += SERIES_COUNT_KEYS) chunks.push(wave.slice(i, i + SERIES_COUNT_KEYS));
              await pmap(chunks, SERIES_PLAN_PARALLEL, async (chunk) => {
                const keys = chunk.map((x) => x.key);
                try {
                  let c = await countKeys(keys);
                  if (keys.length > 1 && [...c.values()].reduce((a, n) => a + n, 0) >= SERIES_CAP) {
                    recounted++;
                    c = new Map();
                    for (const k of keys) c.set(k, (await countKeys([k])).get(k));
                  }
                  for (const [k, n] of c) counts.set(k, n);
                } catch (e) {
                  // not counted: the metric is planned as a full batch of series of the assumed width, which puts it into a slice of its own
                  for (const k of keys) counts.set(k, Math.floor(SERIES_CELLS_BATCH / SERIES_ASSUMED_FIELDS) * 4);
                }
              });
              const w1 = Date.now();
              countingMs += w1 - w0;
              // the width of the metrics with many series: a sample of their series, the widest one counts (with a margin)
              const toMeasure = wave.filter((t) => (counts.get(t.key) ?? 0) >= SERIES_MEASURE_FROM);
              await pmap(toMeasure, SERIES_PLAN_PARALLEL, async (t) => {
                if (Date.now() > hardStop) return; // not measured: the assumed width counts
                try {
                  const recs = await dql(`metrics from: now()-1h\n| filter metric.key == ${JSON.stringify(t.key)}\n| limit ${SERIES_SAMPLE}`, SERIES_SAMPLE);
                  const fields = recs.reduce((m, r) => Math.max(m, Object.values(r).filter((v) => v !== null && v !== undefined).length), 0);
                  if (fields > 0) widths.set(t.key, Math.max(10, Math.ceil(fields * SERIES_WIDTH_MARGIN)));
                } catch (e) {
                  /* not measured: the assumed width counts */
                }
              });
              measuringMs += Date.now() - w1;
              for (const t of wave) metrics.push({ key: t.key, series: counts.get(t.key) ?? 0, fields: widths.get(t.key) ?? SERIES_ASSUMED_FIELDS });
              at += wave.length;
              waves++;
              waveMs = Math.max(waveMs, Date.now() - w0);
              if (planSeries(metrics).notReached.length > 0) {
                stoppedBy = "full"; // the slices of the loop are full: the metrics that follow could not be read
                break;
              }
            }
            const unplanned = ordered.slice(at).map((t) => t.key);
            out.measured = widths.size;
            const plan = planSeries(metrics);
            out.direct = plan.direct;
            out.notReached = plan.notReached.concat(unplanned);
            out.planned = metrics.length;
            out.stoppedBy = stoppedBy;
            out.waves = waves;
            out.countingSeconds = Math.round(countingMs / 100) / 10;
            out.measuringSeconds = Math.round(measuringMs / 100) / 10;
            if (plan.groups.length) {
              out.groups = plan.groups;
              out.groupIds = plan.groups.map((_, i) => i);
            }
            const capped = plan.direct.filter((d) => d.kind === "capped");
            console.log(`series_plan: ${targets.length} metrics: ${plan.direct.filter((d) => d.kind === "none").length} without series, ${capped.length} too large, ${plan.groups.reduce((a, g) => a + g.batches.reduce((b, x) => b + x.keys.length, 0), 0)} to read in ${plan.groups.length} slice(s); ${out.measured} measured; recounted chunks ${recounted}`);
            for (const c of capped) console.log(`series_plan: too large to estimate, not read: ${c.key}: ${c.why}`);
            if (plan.notReached.length) console.log(`series_plan: ${plan.notReached.length} metrics beyond the ${MAX_SERIES_GROUPS} slices are not estimated`);
            console.log(`series_plan: planned ${metrics.length} of ${targets.length} candidates (largest first) in ${waves} wave(s): counting ${out.countingSeconds} s, measuring ${out.measuringSeconds} s${stoppedBy === "time" ? `; stopped at the time budget of ${Math.round(SERIES_PLAN_BUDGET_MS / 1000)} s: the ${unplanned.length} smallest are not planned (not estimated in this run)` : stoppedBy === "full" ? `; the slices are full: the ${unplanned.length} smaller candidates are not planned` : ""}`);
          } catch (e) {
            // a failed plan leaves the estimate out; the usage classification is already ingested, so the run goes on
            out.error = `the plan of the estimate failed: ${String(e && e.message ? e.message : e)}`;
            console.log(`series_plan: ${out.error}`);
          }
          out.seconds = Math.round((Date.now() - t0) / 100) / 10;
          return out;
        }

  read_series:
    name: read_series
    position:
      x: 0
      y: 6
    description: Each slice reads the series of its metrics (largest first) and works out how many series remain without their unused dimensions; a slice that is stopped leaves only its own metrics without an estimate
    action: dynatrace.automations:run-javascript
    withItems: slice in {{ result("series_plan")["groupIds"] }}
    concurrency: 4
    predecessors:
      - series_plan
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 40000; // a metric with this many series or more in the last hour is skipped (not estimated): its sample would not give a valid ratio, and one read of it must fit into the 256 MB of the script (a metric of 49,500 series of about 1 KB each ran it out of memory when read alone, 40,000 did not)
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- the sizes of the estimate (shared by series_plan and read_series)
        // The size of a read is "cells": series times fields (a record with 39 fields costs about twice as much as one with 20). Measured limits: 40,000 series of about
        // 20 fields (800,000 cells) of one metric were read alone without trouble, 49,500 series of the same width (990,000 cells) ran a script out of memory, and
        // 24,004 series of 39 fields (936,000 cells, together with other reads) did too.
        const SERIES_CELLS_MAX = 600000; // series x fields of one metric above which it is not read (the largest read that is known to be safe is 800,000)
        const SERIES_CELLS_BATCH = 150000; // one query reads about this many cells (6,000 series of 25 fields)
        const SERIES_CELLS_GROUP = 600000; // cells that one slice reads in all: all its batches are read in the same task, some at the same time
        const SERIES_MEASURE_FROM = 200; // metrics with at least this many series are measured by a sample; a smaller one is at most 20,000 cells
        const SERIES_ASSUMED_FIELDS = 100; // fields assumed for a metric that is not measured
        const SERIES_SAMPLE = 50; // series read to measure the width of a metric
        const SERIES_WIDTH_MARGIN = 1.25; // a sample may miss a wider series
        const MAX_SERIES_GROUPS = 40; // slices of the loop; metrics beyond them (the smallest, as the metrics are in the order of their data points) are not estimated
        const SERIES_COUNT_KEYS = 20;


        // ---------------------------------------------------------------- hand-over between tasks
        // The result of a task is limited to about 5 MB, and the results of all slices reach one task. A slice therefore packs its counts (gzip, then
        // base64 text). Gzip is lossless (and checks its own contents with a CRC32 when it is unpacked); the length of the unpacked text and a checksum of the packed
        // bytes are checked on arrival, so damaged data stops the run. The checksum is over the PACKED bytes (final52): over the unpacked text it took 10 to 11 s for a
        // slice of 16 million characters in the task runtime (the largest customer tenant), more than the whole unpacking (2 s), and the merge of 21 such slices ran
        // out of its 120 seconds.
        const fnvBytes = (b) => {
          let h = 0x811c9dc5;
          for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 16777619) >>> 0;
          return h.toString(16);
        };
        async function gzipText(text) {
          const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        }
        async function gunzipBytes(bytes) {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }
        function toBase64(bytes) {
          let s = "";
          for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          return btoa(s);
        }
        function fromBase64(b64) {
          const s = atob(b64);
          const out = new Uint8Array(s.length);
          for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
          return out;
        }
        async function pack(value) {
          const text = JSON.stringify(value);
          const bytes = await gzipText(text);
          return { format: "gzip+base64", length: text.length, checksum: fnvBytes(bytes), data: toBase64(bytes) };
        }
        async function unpack(p) {
          if (!p || p.format !== "gzip+base64") throw new Error("a slice handed over its counts in an unknown format");
          let text;
          try {
            const bytes = fromBase64(p.data);
            if (fnvBytes(bytes) !== p.checksum) throw new Error("the checksum of the packed bytes differs");
            text = await gunzipBytes(bytes);
          } catch (e) {
            throw new Error(`the counts handed over by a slice are damaged (they cannot be unpacked${e && e.message ? `: ${e.message}` : ""}); nothing was analysed`);
          }
          if (text.length !== p.length) throw new Error("the counts handed over by a slice are damaged (length or checksum differ); nothing was analysed");
          return JSON.parse(text);
        }

        const DRY_RUN = false; // true: measure only, nothing is ingested

        const q = (s) => `"${s.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
        // every line of a run gets the time the run started (set from the plan), so a run is one snapshot of the dashboard, however long it takes
        let RUN_TS = 0;
        const stamp = (l) => (RUN_TS > 0 ? `${l} ${RUN_TS}` : l);
        async function ingest(ls) {
          let o = 0;
          let bad = 0;
          for (let i = 0; i < ls.length; i += 1000) {
            const res = await retry(() => metricsClient.ingest({ body: ls.slice(i, i + 1000).map(stamp).join("\n") }));
            o += res.linesOk ?? 0;
            bad += res.linesInvalid ?? 0;
          }
          if (bad > 0 || o !== ls.length) throw new Error(`ingest problem: ${o} ok, ${bad} invalid, ${ls.length} sent`);
          return o;
        }
        // ---------------------------------------------------------------- enrichment inputs (deterministic)
        // Which dimensions does Dynatrace need to create its own dt.* dimensions? Read from the tenant's OpenPipeline metric settings:
        //  - ingest sources / routing decide which pipeline handles a series (an extension source routes to its pipeline; otherwise the
        //    first enabled routing entry whose matcher fits the series),
        //  - in that pipeline, every Smartscape node processor whose matcher fits the series needs its id components, the fields its
        //    matcher reads and its node-name field, plus the fields that Processing steps use to build any of those fields,
        //  - cost and product allocation processors need the fields their matcher reads.
        // Node types that no tenant rule produces take their id inputs from the semantic dictionary (dt.semantic_dictionary.models, column
        // smartscape_id_inputs), read at run time into ctx.dictionary (dimension name -> inputs).
        // Where the dictionary has nothing, three stated fallbacks apply:
        //  - CONTAINER: not documented. Assumed cluster.uid + pod.uid + container.name (consistent with the data: one-to-one with the id).
        //  - AWS types: aws.arn, the documented rule for every AWS entity.
        //  - the synthetic location and network availability monitor: their ids are carried by dt.* dimensions, which are always used.
        // Anything else is reported as unverified.

        const FALLBACK_INPUTS = {
          "dt.smartscape.container": ["k8s.cluster.uid", "k8s.pod.uid", "k8s.container.name"], // assumed (docs gap)
        };
        // dt.smartscape_source.id / .type copy one of the node ids and have no inputs of their own.
        const NO_INPUT_DIMS = new Set([
          "dt.smartscape_source.id",
          "dt.smartscape_source.type",
          "dt.smartscape.synthetic_location",
          "dt.smartscape.network_availability_monitor",
        ]);

        function tokenizeMatcher(s) {
          const t = [];
          let i = 0;
          while (i < s.length) {
            const c = s[i];
            if (/\s/.test(c)) { i++; continue; }
            if (c === '"') {
              let j = i + 1;
              let str = "";
              while (j < s.length && s[j] !== '"') {
                if (s[j] === "\\" && j + 1 < s.length) { str += s[j + 1]; j += 2; } else { str += s[j]; j++; }
              }
              t.push({ t: "str", v: str });
              i = j + 1;
              continue;
            }
            if (c === "`") {
              const j = s.indexOf("`", i + 1);
              const end = j < 0 ? s.length : j;
              t.push({ t: "id", v: s.slice(i + 1, end) });
              i = end + 1;
              continue;
            }
            if ("(){},".includes(c)) { t.push({ t: c }); i++; continue; }
            if (s.startsWith("==", i) || s.startsWith("!=", i)) { t.push({ t: "op", v: s.slice(i, i + 2) }); i += 2; continue; }
            const m = /^[A-Za-z_][A-Za-z0-9_.\-]*/.exec(s.slice(i));
            if (m) { t.push({ t: "id", v: m[0] }); i += m[0].length; continue; }
            i++;
          }
          return t;
        }

        const matcherCache = new Map();
        const MATCHER_CACHE = new Map();
        /** Parsing is pure, and the same few matchers are evaluated for every series, so each is parsed once. */
        function parseMatcher(src) {
          if (!MATCHER_CACHE.has(src)) MATCHER_CACHE.set(src, parseMatcherUncached(src));
          return MATCHER_CACHE.get(src);
        }
        function parseMatcherUncached(src) {
          if (matcherCache.has(src)) return matcherCache.get(src);
          const toks = tokenizeMatcher(src || "");
          let p = 0;
          const peek = () => toks[p];
          const next = () => toks[p++];
          const kw = (tok, w) => tok && tok.t === "id" && tok.v.toLowerCase() === w;
          function arg() {
            const tk = next();
            if (!tk) return null;
            if (tk.t === "str") return { s: tk.v };
            if (tk.t === "{") {
              const set = [];
              while (peek() && peek().t !== "}") { const a = next(); if (a.t === "str") set.push(a.v); }
              if (peek()) next();
              return { set };
            }
            if (tk.t === "id") return { id: tk.v };
            return null;
          }
          function primary() {
            const tk = peek();
            if (!tk) return { k: "true" };
            if (tk.t === "(") { next(); const e = or(); if (peek() && peek().t === ")") next(); return e; }
            if (tk.t === "id") {
              next();
              if (peek() && peek().t === "(") {
                next();
                const args = [];
                while (peek() && peek().t !== ")") { args.push(arg()); if (peek() && peek().t === ",") next(); }
                if (peek()) next();
                return { k: "call", f: tk.v, args };
              }
              if (peek() && peek().t === "op") { const op = next().v; return { k: "cmp", field: tk.v, op, rhs: arg() }; }
              return { k: "true" };
            }
            next();
            return { k: "true" };
          }
          function not() { if (kw(peek(), "not")) { next(); return { k: "not", a: not() }; } return primary(); }
          function and() { let l = not(); while (kw(peek(), "and")) { next(); l = { k: "and", a: l, b: not() }; } return l; }
          function or() { let l = and(); while (kw(peek(), "or")) { next(); l = { k: "or", a: l, b: and() }; } return l; }
          const ast = or();
          matcherCache.set(src, ast);
          return ast;
        }

        const wildcard = (pat) => new RegExp("^" + pat.split("*").map((x) => x.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*") + "$", "i");
        const fieldValue = (rec, f) => (rec[f] === undefined ? null : rec[f]);

        function evalMatcher(n, rec) {
          switch (n.k) {
            case "true": return true;
            case "and": return evalMatcher(n.a, rec) && evalMatcher(n.b, rec);
            case "or": return evalMatcher(n.a, rec) || evalMatcher(n.b, rec);
            case "not": return !evalMatcher(n.a, rec);
            case "cmp": {
              const v = fieldValue(rec, n.field);
              const eq = v !== null && n.rhs && String(v) === n.rhs.s;
              return n.op === "==" ? eq : !eq;
            }
            case "call": {
              const f = n.f;
              const a0 = n.args[0] && n.args[0].id;
              if (f === "isNotNull") return fieldValue(rec, a0) !== null;
              if (f === "isNull") return fieldValue(rec, a0) === null;
              if (f === "matchesValue" || f === "matchesPhrase") {
                const v = fieldValue(rec, a0);
                if (v === null) return false;
                const a1 = n.args[1] || {};
                const pats = a1.set ?? (a1.s !== undefined ? [a1.s] : []);
                const vs = Array.isArray(v) ? v : [v];
                if (f === "matchesPhrase") return vs.some((x) => pats.some((p) => String(x).toLowerCase().includes(p.toLowerCase())));
                return vs.some((x) => pats.some((p) => wildcard(p).test(String(x))));
              }
              return true; // unknown function: assume it matches, which keeps more dimensions
            }
            default: return true;
          }
        }

        function matcherFields(n, out = new Set()) {
          if (!n) return out;
          if (n.k === "and" || n.k === "or") { matcherFields(n.a, out); matcherFields(n.b, out); }
          else if (n.k === "not") matcherFields(n.a, out);
          else if (n.k === "cmp") out.add(n.field);
          else if (n.k === "call" && n.args[0] && n.args[0].id) out.add(n.args[0].id);
          return out;
        }

        const DQL_WORDS = new Set(["if", "else", "null", "true", "false", "and", "or", "not"]);
        /** Fields read by the expression assigned to `field` in a DQL script (fieldsAdd field = expr, ...). */
        function dqlInputsOf(script, field) {
          const re = new RegExp("(^|[\\s,|])" + field.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*=(?!=)");
          const m = re.exec(script);
          if (!m) return null;
          let i = m.index + m[0].length;
          let depth = 0;
          let inStr = false;
          let rhs = "";
          for (; i < script.length; i++) {
            const c = script[i];
            if (inStr) { if (c === "\\") { i++; continue; } if (c === '"') inStr = false; continue; }
            if (c === '"') { inStr = true; continue; }
            if (c === "(" || c === "[" || c === "{") depth++;
            else if (c === ")" || c === "]" || c === "}") depth--;
            else if ((c === "," && depth === 0) || c === "\n" || (c === "|" && depth === 0)) break;
            rhs += c;
          }
          const out = [];
          const idRe = /[A-Za-z_][A-Za-z0-9_.]*/g;
          let mm;
          while ((mm = idRe.exec(rhs))) {
            const after = rhs.slice(mm.index + mm[0].length).trimStart();
            if (after.startsWith("(") || DQL_WORDS.has(mm[0].toLowerCase())) continue;
            out.push(mm[0]);
          }
          return out;
        }

        /** ctx = { pipelines: Map(objectId -> value), sources: [value], routing: [{enabled, matcher, pipelineId}] } */
        function pipelineFor(rec, ctx) {
          const src = typeof rec["dt.openpipeline.source"] === "string" ? rec["dt.openpipeline.source"] : "";
          if (src.startsWith("extension:")) {
            const name = src.slice("extension:".length);
            const is = ctx.sources.find((s) => s.enabled !== false && s.sourceType === "extension" && s.source === name);
            if (is && is.staticRouting && is.staticRouting.pipelineId) return ctx.pipelines.get(is.staticRouting.pipelineId) ?? null;
          }
          for (const e of ctx.routing) {
            if (e.enabled !== false && evalMatcher(parseMatcher(e.matcher), rec)) return ctx.pipelines.get(e.pipelineId) ?? null;
          }
          return null;
        }

        /** Fields needed by the pipeline's rules for this series, and the dt.* dimensions those rules produce. */
        function neededByPipeline(rec, pipe) {
          const need = new Set();
          const produced = new Set();
          if (!pipe) return { need, produced };
          const dqls = ((pipe.processing && pipe.processing.processors) || []).filter((p) => p.type === "dql" && p.enabled !== false && p.dql && evalMatcher(parseMatcher(p.matcher), rec));
          const add = (f, depth = 0) => {
            if (!f || need.has(f)) return;
            need.add(f);
            if (depth >= 3) return;
            for (const d of dqls) {
              const inputs = dqlInputsOf(d.dql.script || "", f);
              if (inputs) for (const x of inputs) add(x, depth + 1);
            }
          };
          for (const p of (pipe.smartscapeNodeExtraction && pipe.smartscapeNodeExtraction.processors) || []) {
            if (p.type !== "smartscapeNode" || p.enabled === false || !evalMatcher(parseMatcher(p.matcher), rec)) continue;
            const sn = p.smartscapeNode || {};
            for (const f of matcherFields(parseMatcher(p.matcher))) add(f);
            for (const c of sn.idComponents || []) add(c.referencedFieldName);
            if (sn.nodeName && sn.nodeName.type === "field" && sn.nodeName.field) add(sn.nodeName.field.sourceFieldName);
            if (sn.nodeIdFieldName) produced.add(sn.nodeIdFieldName);
          }
          for (const stage of ["costAllocation", "productAllocation"]) {
            for (const p of (pipe[stage] && pipe[stage].processors) || []) {
              if (p.enabled === false || !evalMatcher(parseMatcher(p.matcher), rec)) continue;
              for (const f of matcherFields(parseMatcher(p.matcher))) add(f);
              const v = (p[stage] && p[stage].value) || {};
              if (v.type === "field" && v.field && v.field.sourceFieldName) add(v.field.sourceFieldName);
            }
          }
          return { need, produced };
        }

        /**
         * Dimensions Dynatrace needs for the enrichment of one metric's series.
         * Returns { inputs: Set (non-dt.* dimensions present on the series), unverified: [dt.* dimensions with no known inputs],
         *           sources: Set (where the inputs came from) }.
         */
        function enrichmentInputs(recs, ctx) {
          const present = new Set();
          for (const r of recs) for (const k of Object.keys(r)) if (k !== "metric.key" && r[k] !== null && r[k] !== undefined) present.add(k);
          const need = new Set();
          const producedByTenant = new Set();
          for (const r of recs) {
            const { need: n, produced } = neededByPipeline(r, pipelineFor(r, ctx));
            for (const f of n) need.add(f);
            for (const f of produced) producedByTenant.add(f);
          }
          const unverified = [];
          const sources = new Set();
          if (producedByTenant.size) sources.add("tenant rule");
          for (const d of present) {
            if (!d.startsWith("dt.smartscape") || producedByTenant.has(d)) continue;
            if (NO_INPUT_DIMS.has(d)) { sources.add("dt.* rule"); continue; }
            const fromDictionary = ctx.dictionary && ctx.dictionary.get(d);
            if (fromDictionary && fromDictionary.length) {
              for (const f of fromDictionary) need.add(f);
              sources.add("dictionary");
            } else if (FALLBACK_INPUTS[d]) {
              for (const f of FALLBACK_INPUTS[d]) need.add(f);
              sources.add("assumption");
            } else if (d.startsWith("dt.smartscape.aws_")) {
              need.add("aws.arn");
              sources.add("aws rule");
            } else {
              unverified.push(d);
            }
          }
          const inputs = new Set([...need].filter((f) => present.has(f) && !f.startsWith("dt.")));
          return { inputs, unverified, sources };
        }

        async function loadSettings(schemaId) {
          const items = [];
          let nextPageKey;
          do {
            const page = await retry(() =>
              settingsObjectsClient.getSettingsObjects(nextPageKey ? { nextPageKey } : { schemaIds: schemaId, fields: "objectId,value", pageSize: 500 }),
            );
            items.push(...arr(page.items));
            nextPageKey = page.nextPageKey;
          } while (nextPageKey);
          return items;
        }


        // ---------------------------------------------------------------- read_series
        // One slice of the estimate of the saving from unused dimensions: it reads the series of the metrics of its group (planned by series_plan so that they fit
        // into the memory of this task), works out for each how many series remain without its unused dimensions, and hands over the usage lines, packed.
        // The dimensions Dynatrace needs to build its own dt.* dimensions are kept: they come from the tenant's OpenPipeline settings, the semantic dictionary and
        // three stated fallbacks (see the enrichment inputs above).
        // If this task is stopped by the platform (out of memory), only the metrics of this slice are left without an estimate: the step series_estimate runs
        // whatever happened to the slices, and reports them as not estimated.
        const SERIES_READ_MARGIN = 1.5; // a metric may have grown since the plan: a read is bounded by this share of the planned series, and a read that reaches the bound is not used

        export default async function () {
          const t0 = Date.now();
          const ex = await actionExecution();
          const slice = Number(ex.loopItem.slice);
          const plan = await result("series_plan");
          const group = plan.groups && plan.groups[slice];
          const batches = group ? arr(group.batches) : [];
          const lines = [];
          const processed = [];
          const capped = [];
          const late = [];
          const failedBatches = [];
          const enrichmentSources = {};
          const unverifiedEnrichment = {};
          let noSeries = 0;
          if (batches.length) {
            const cls = await result("classify");
            const byKey = new Map(arr(cls.targets).map((x) => [str(x.key), { key: str(x.key), usedDims: new Set(arr(x.dims)) }]));
            const [[pipeObjs, sourceObjs, routeObjs], dictRows] = await Promise.all([
              Promise.all([
                loadSettings("builtin:openpipeline.metrics.pipelines"),
                loadSettings("builtin:openpipeline.metrics.ingest-sources"),
                loadSettings("builtin:openpipeline.metrics.routing"),
              ]),
              dql(`fetch dt.semantic_dictionary.models\n| filter isNotNull(smartscape_node_type) and arraySize(smartscape_id_inputs) > 0\n| fields smartscape_node_type, smartscape_id_inputs\n| limit 20000`, 20000),
            ]);
            const enrichCtx = {
              pipelines: new Map(pipeObjs.map((o) => [o.objectId, o.value])),
              sources: sourceObjs.map((o) => o.value),
              routing: routeObjs.flatMap((o) => arr(obj(o.value).routingEntries)),
            };
            enrichCtx.dictionary = new Map(dictRows.map((r) => ["dt.smartscape." + str(r.smartscape_node_type).toLowerCase(), arr(r.smartscape_id_inputs).map(String)]));
            if (!enrichCtx.dictionary.size) throw new Error("the semantic dictionary returned no Smartscape id inputs");

            const limitFor = (n) => Math.min(SERIES_CAP, Math.ceil(n * SERIES_READ_MARGIN) + 100);
            /** the series of one metric; `full` is false if the read reached its bound (the metric has grown since the plan) */
            const readOne = async (key, n) => {
              const lim = limitFor(n);
              const recs = await dql(`metrics from: now()-1h\n| filter metric.key == ${JSON.stringify(key)}\n| limit ${lim}`, lim);
              return { recs, full: recs.length < lim };
            };
            /** key -> { recs, full } for a batch: one query for the batch while it is complete, otherwise one query per key */
            const readSeries = async (keys, ns) => {
              const out = new Map(keys.map((k) => [k, { recs: [], full: true }]));
              if (keys.length > 1) {
                const lim = limitFor(ns.reduce((a, n) => a + n, 0));
                const recs = await dql(`metrics from: now()-1h\n| filter in(metric.key, ${keys.map((k) => JSON.stringify(k)).join(", ")})\n| limit ${lim}`, lim);
                if (recs.length < lim && recs.every((r) => out.has(str(r["metric.key"])))) {
                  for (const r of recs) out.get(str(r["metric.key"])).recs.push(r);
                  return out;
                }
              }
              for (let i = 0; i < keys.length; i++) out.set(keys[i], await readOne(keys[i], ns[i]));
              return out;
            };
            const estimate = ({ key, usedDims }, { recs, full }) => {
              processed.push(key);
              if (!recs.length) {
                noSeries++;
                lines.push(`${SERIES_METRIC},metric_key=${q(key)},kind="none" 1`);
                return;
              }
              if (!full || recs.length >= SERIES_CAP) {
                capped.push(key);
                lines.push(`${SERIES_METRIC},metric_key=${q(key)},kind="capped" 1`);
                return;
              }
              const values = new Map();
              for (const r of recs) {
                for (const [d, v] of Object.entries(r)) {
                  if (d === "metric.key" || v === null || v === undefined) continue;
                  if (!values.has(d)) values.set(d, new Set());
                  values.get(d).add(String(v));
                }
              }
              const { inputs, unverified, sources } = enrichmentInputs(recs, enrichCtx);
              for (const x of sources) enrichmentSources[x] = (enrichmentSources[x] ?? 0) + 1;
              if (unverified.length) unverifiedEnrichment[key] = unverified;
              const used = new Set([...usedDims, ...inputs, ...[...values.keys()].filter((d) => d.startsWith("dt."))]);
              const keep = [...values.keys()].filter((d) => used.has(d)).sort();
              const remaining = new Set(recs.map((r) => JSON.stringify(keep.map((d) => r[d] ?? null)))).size;
              lines.push(`${SERIES_METRIC},metric_key=${q(key)},kind="now" ${recs.length}`);
              lines.push(`${SERIES_METRIC},metric_key=${q(key)},kind="after" ${remaining}`);
              for (const [d, set] of values) if (set.size >= 2 && !used.has(d)) lines.push(`${UNUSED_METRIC},metric_key=${q(key)},dimension=${q(d)} ${set.size}`);
            };
            // a batch waits until its cells fit into the budget of the cells in flight (a batch bigger than the budget runs alone); the batches of a group add up
            // to the budget of one slice, so the wait only orders them
            let inflight = 0;
            const waiters = [];
            const acquire = async (n) => {
              while (inflight > 0 && inflight + n > SERIES_CELLS_GROUP) await new Promise((r) => waiters.push(r));
              inflight += n;
            };
            const release = (n) => {
              inflight -= n;
              for (const w of waiters.splice(0)) w();
            };
            let done = 0;
            await pmap(batches, SERIES_CONCURRENCY, async (batch) => {
              const members = batch.keys.map((k) => byKey.get(k)).filter(Boolean);
              if (Date.now() - STARTED > SERIES_STOP_MS) {
                late.push(...batch.keys);
                return;
              }
              await acquire(batch.cells);
              try {
                if (Date.now() - STARTED > SERIES_STOP_MS) {
                  late.push(...batch.keys);
                  return;
                }
                const bySeries = await readSeries(batch.keys, batch.series);
                for (const target of members) estimate(target, bySeries.get(target.key));
                bySeries.clear();
              } catch (e) {
                // a failure of one batch (not a memory stop, which cannot be caught) leaves its metrics without an estimate; the other batches go on
                failedBatches.push({ keys: batch.keys, error: String(e && e.message ? e.message : e).slice(0, 300) });
                console.log(`read_series: slice ${slice + 1}: batch of ${batch.keys.length} metrics (${batch.keys[0]}, ...) failed: ${String(e && e.message ? e.message : e).slice(0, 300)}`);
              } finally {
                release(batch.cells);
              }
              done++;
              console.log(`read_series: slice ${slice + 1}: batch ${done} of ${batches.length} done: ${batch.keys.length} metrics, about ${batch.cells} cells`);
            });
          }
          return {
            slice,
            complete: true,
            processed,
            capped,
            late,
            failedBatches,
            noSeries,
            enrichmentSources,
            metricsWithUnverifiedEnrichment: Object.keys(unverifiedEnrichment).length,
            packed: await pack({ lines }),
            lineCount: lines.length,
            seconds: Math.round((Date.now() - t0) / 100) / 10,
          };
        }

  series_estimate:
    name: series_estimate
    position:
      x: 0
      y: 7
    description: Put the estimate together and write it, whatever happened to the slices (a stopped slice only leaves its metrics not estimated), then write the marker of a finished run
    action: dynatrace.automations:run-javascript
    conditions:
      states:
        series_plan: ANY
        read_series: ANY
    predecessors:
      - series_plan
      - read_series
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient, executionsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, execution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 40000; // a metric with this many series or more in the last hour is skipped (not estimated): its sample would not give a valid ratio, and one read of it must fit into the 256 MB of the script (a metric of 49,500 series of about 1 KB each ran it out of memory when read alone, 40,000 did not)
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- hand-over between tasks
        // The result of a task is limited to about 5 MB, and the results of all slices reach one task. A slice therefore packs its counts (gzip, then
        // base64 text). Gzip is lossless (and checks its own contents with a CRC32 when it is unpacked); the length of the unpacked text and a checksum of the packed
        // bytes are checked on arrival, so damaged data stops the run. The checksum is over the PACKED bytes (final52): over the unpacked text it took 10 to 11 s for a
        // slice of 16 million characters in the task runtime (the largest customer tenant), more than the whole unpacking (2 s), and the merge of 21 such slices ran
        // out of its 120 seconds.
        const fnvBytes = (b) => {
          let h = 0x811c9dc5;
          for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 16777619) >>> 0;
          return h.toString(16);
        };
        async function gzipText(text) {
          const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        }
        async function gunzipBytes(bytes) {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }
        function toBase64(bytes) {
          let s = "";
          for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          return btoa(s);
        }
        function fromBase64(b64) {
          const s = atob(b64);
          const out = new Uint8Array(s.length);
          for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
          return out;
        }
        async function pack(value) {
          const text = JSON.stringify(value);
          const bytes = await gzipText(text);
          return { format: "gzip+base64", length: text.length, checksum: fnvBytes(bytes), data: toBase64(bytes) };
        }
        async function unpack(p) {
          if (!p || p.format !== "gzip+base64") throw new Error("a slice handed over its counts in an unknown format");
          let text;
          try {
            const bytes = fromBase64(p.data);
            if (fnvBytes(bytes) !== p.checksum) throw new Error("the checksum of the packed bytes differs");
            text = await gunzipBytes(bytes);
          } catch (e) {
            throw new Error(`the counts handed over by a slice are damaged (they cannot be unpacked${e && e.message ? `: ${e.message}` : ""}); nothing was analysed`);
          }
          if (text.length !== p.length) throw new Error("the counts handed over by a slice are damaged (length or checksum differ); nothing was analysed");
          return JSON.parse(text);
        }

        const DRY_RUN = false; // true: measure only, nothing is ingested

        const q = (s) => `"${s.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
        // every line of a run gets the time the run started (set from the plan), so a run is one snapshot of the dashboard, however long it takes
        let RUN_TS = 0;
        const stamp = (l) => (RUN_TS > 0 ? `${l} ${RUN_TS}` : l);
        async function ingest(ls) {
          let o = 0;
          let bad = 0;
          for (let i = 0; i < ls.length; i += 1000) {
            const res = await retry(() => metricsClient.ingest({ body: ls.slice(i, i + 1000).map(stamp).join("\n") }));
            o += res.linesOk ?? 0;
            bad += res.linesInvalid ?? 0;
          }
          if (bad > 0 || o !== ls.length) throw new Error(`ingest problem: ${o} ok, ${bad} invalid, ${ls.length} sent`);
          return o;
        }

        // ---------------------------------------------------------------- series_estimate
        // Puts the estimate together and writes it: the plan (series_plan) says which metrics were not read (no series, or too large), the slices (read_series) hand over
        // the usage lines of the metrics they read, and this step ingests all lines and, last, the marker of a finished run.
        // It runs whatever happened to the plan and the slices (the condition ANY): a slice that was stopped by the platform (out of memory) leaves {} in the results,
        // and only its metrics are reported as not estimated. The usage classification is already ingested, so a failed estimate must not stop the report.
        const SERIES_ERROR_TEXT = 300;

        /** What the platform says about the failed iterations of the loop (the text is in the state of the task, not in its result). */
        async function loopFailureText(task) {
          try {
            const run = await execution();
            const tasks = await executionsClient.getTaskExecutions({ executionId: run.id });
            return String((tasks && tasks[task] && tasks[task].stateInfo) || "").replace(/^Uncaught( \(in promise\))? Error: /, "").replace(/\s+/g, " ").trim().slice(0, SERIES_ERROR_TEXT);
          } catch {
            return "";
          }
        }

        export default async function () {
          const t0 = Date.now();
          const cls = await result("classify");
          RUN_TS = Number((await result("plan")).startedAtMs) || 0;
          const targets = arr(cls.targets).map((x) => ({ key: str(x.key), dp: Number(x.dp) || 0 }));
          const lines = [];
          const processed = new Set();
          const problems = [];
          const tooLarge = []; // {key, why}: not read, because the read would not fit into the memory of a task
          const enrichmentSources = {};
          let noSeries = 0;
          let metricsWithUnverifiedEnrichment = 0;
          let late = 0;

          // the plan: the metrics that are not read
          let plan = null;
          try {
            plan = await result("series_plan");
          } catch (e) {
            problems.push(`the plan of the estimate has no result: ${String(e && e.message ? e.message : e)}`);
          }
          if (plan && plan.error) problems.push(plan.error);
          if (plan) {
            for (const d of arr(plan.direct)) {
              processed.add(d.key);
              if (d.kind === "none") {
                noSeries++;
                lines.push(`${SERIES_METRIC},metric_key=${q(d.key)},kind="none" 1`);
              } else {
                tooLarge.push({ key: d.key, why: d.why });
                lines.push(`${SERIES_METRIC},metric_key=${q(d.key)},kind="capped" 1`);
              }
            }
          }

          // the slices: every group of the plan has a result, or its metrics are not estimated
          let results = [];
          try {
            results = arr(await result("read_series"));
          } catch (e) {
            problems.push(`the slices of the estimate have no result: ${String(e && e.message ? e.message : e)}`);
          }
          const bySlice = new Map();
          for (const r of results) if (r && typeof r.slice === "number" && r.complete === true) bySlice.set(r.slice, r);
          const groups = plan ? arr(plan.groups) : [];
          const failedSlices = [];
          let failedMetrics = 0;
          const failedBatches = [];
          for (let g = 0; g < groups.length; g++) {
            const keys = arr(groups[g].batches).flatMap((b) => arr(b.keys));
            const r = bySlice.get(g);
            if (!r) {
              if (keys.length) {
                failedSlices.push(g + 1);
                failedMetrics += keys.length;
              }
              continue;
            }
            const c = await unpack(r.packed);
            if (c.lines.length !== r.lineCount) throw new Error(`slice ${g + 1} of the estimate: the number of lines handed over differs from the number sent`);
            lines.push(...c.lines);
            for (const k of arr(r.processed)) processed.add(k);
            for (const k of arr(r.capped)) tooLarge.push({ key: k, why: "the metric has grown since the plan: the read reached its bound" });
            noSeries += Number(r.noSeries) || 0;
            late += arr(r.late).length;
            metricsWithUnverifiedEnrichment += Number(r.metricsWithUnverifiedEnrichment) || 0;
            for (const [k, n] of Object.entries(obj(r.enrichmentSources))) enrichmentSources[k] = (enrichmentSources[k] ?? 0) + n;
            for (const b of arr(r.failedBatches)) failedBatches.push(b);
          }
          if (failedSlices.length) {
            const text = await loopFailureText("read_series");
            problems.push(`${failedSlices.length} of ${groups.length} slices of the estimate did not finish (slice ${failedSlices.join(", ")}${text ? `: ${text}` : ""}); their ${failedMetrics} metrics are not estimated`);
          }
          if (failedBatches.length) problems.push(`${failedBatches.reduce((a, b) => a + arr(b.keys).length, 0)} metrics could not be estimated (${failedBatches[0].error})`);
          if (plan && arr(plan.notReached).length) problems.push(`${plan.notReached.length} metrics are beyond the slices of one run and are not estimated`);
          if (late) problems.push(`${late} metrics were not reached in the time of their slices and are not estimated`);
          for (const p of problems) console.log(`series_estimate: ${p}`);

          const targetsDp = targets.reduce((a, x) => a + x.dp, 0);
          const doneDp = targets.filter((x) => processed.has(x.key)).reduce((a, x) => a + x.dp, 0);
          const seriesCoverage = { analysed: processed.size, total: targets.length, pct: targetsDp ? Math.round((doneDp / targetsDp) * 1000) / 10 : 100 };
          const seriesIngested = DRY_RUN ? 0 : await ingest(lines);
          // the marker of a finished run, written last: the dashboard reads the snapshot that the newest marker points to, so a run that failed halfway
          // never replaces the previous snapshot
          if (!DRY_RUN && RUN_TS > 0) await ingest([`custom.metrics_usage.snapshot ${Math.round(RUN_TS / 1000)}`]);
          return {
            dryRun: DRY_RUN,
            unusedDimensionMetrics: targets.length,
            seriesEstimateLines: seriesIngested,
            seriesNotEstimated: targets.length - processed.size,
            seriesCoverage,
            seriesError: problems.join("; "),
            metricsWithoutSeriesLastHour: noSeries,
            skippedTooManySeries: tooLarge.map((x) => x.key),
            skippedTooLarge: tooLarge.slice(0, 50),
            skippedTooLargeCount: tooLarge.length,
            failedSlices,
            slices: groups.length,
            enrichmentSources,
            metricsWithUnverifiedEnrichment,
            seriesLinesForDigest: DRY_RUN ? lines : undefined,
            seconds: Math.round((Date.now() - t0) / 100) / 10,
            timings: { plan: plan ? plan.seconds : null, measuredMetrics: plan ? plan.measured : null },
          };
        }

  create_dashboard:
    name: create_dashboard
    position:
      x: -2
      y: 8
    description: Create the dashboard if it does not exist yet
    action: dynatrace.automations:run-javascript
    predecessors:
      - series_estimate
    input:
      script: |
        // Creates the "Metrics optimization candidates" dashboard the first time this workflow runs, and brings it up to date when a newer version of the
        // workflow brings a newer dashboard.
        // The dashboard of this workflow is recognised by its description ("Metrics optimization workflow dashboard v<N>"). Dashboards with the same
        // name but without that description (a user's own, or shared ones) are never changed, whatever their number or order.
        import { documentsClient } from "@dynatrace-sdk/client-document";

        const NAME = "Metrics optimization candidates";
        const DASHBOARD_VERSION = 18;
        const DASHBOARD = {"annotations": [], "baseQueries": [], "importedWithCode": false, "layouts": {"2": {"h": 4, "w": 8, "x": 0, "y": 2}, "3": {"h": 2, "w": 24, "x": 0, "y": 0}, "4": {"h": 18, "w": 24, "x": 0, "y": 6}, "5": {"h": 4, "w": 8, "x": 8, "y": 2}, "6": {"h": 4, "w": 8, "x": 16, "y": 2}}, "rows": [], "settings": {"defaultTimeframe": {"enabled": true, "value": {"from": "now()-30d", "to": "now()"}}, "indicators": {"customSegments": false, "customTimeframe": false, "description": true, "filters": true, "warnings": false}}, "tiles": {"2": {"davis": {"davisVisualization": {"isAvailable": true}, "enabled": false}, "description": "Counts and total potential reduction. Ignores the Result and Source filters.", "query": "timeseries from:now()-30d, interval:1d\n, data_points = sum(dt.sfm.metrics.ingest.datapoints, rate:24h)\n, by:{grail.metric.key, grail.metric.type, grail.metric.source}\n, filter:(startswith(grail.metric.key, \"dt.service.\")\n  or startswith(grail.metric.key, \"dt.cloud.aws\")\n  or startswith(grail.metric.key, \"dt.cloud.azure\")\n  or startswith(grail.metric.key, \"dt.osservice.\")\n  or NOT startswith(grail.metric.key, \"dt.\"))\nand not in(grail.metric.key,\n  \"dt.cloud.aws.az.running\",\n  \"dt.cloud.azure.region.vms.initializing\",\n  \"dt.cloud.azure.region.vms.running\",\n  \"dt.cloud.azure.region.vms.stopped\",\n  \"dt.cloud.azure.vm_scale_set.vms.initializing\",\n  \"dt.cloud.azure.vm_scale_set.vms.running\",\n  \"dt.cloud.azure.vm_scale_set.vms.stopped\")\nand isnull(grail.monitoring_source)\nand grail.bucket.name!=\"dt_system_metrics\"\nand grail.metric.key!=\"...\"\nand ($CostCenter==\"*\" or dt.cost.costcenter==$CostCenter)\nand ($CostProduct==\"*\" or dt.cost.product==$CostProduct)\n| fieldsAdd dp = arraySum(data_points) * if(grail.metric.type == \"histogram\" and not startswith(grail.metric.key, \"dt.service.\"), 10, else:1)\n| fieldsAdd metric_key = grail.metric.key, source = coalesce(grail.metric.source, \"Unattributed\")\n| sort dp desc\n| summarize data_points = sum(dp), source = takeFirst(source), by:{metric_key}\n| fieldsAdd parts = splitString(metric_key, \".\")\n| fieldsAdd prefix = if(arraySize(parts) > 1, concat(parts[0], \".\", parts[1]), else:metric_key)\n| fieldsRemove parts\n| fieldsAdd k = 1\n| join [\n    timeseries an = max(`custom.metrics_usage.analysis`), by:{kind}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array($LatestRun))), 0) > 600, coalesce(toLong(arrayFirst(array($LatestRun))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array($LatestRun))), 0) > 600, coalesce(toLong(arrayFirst(array($LatestRun))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd last = arrayLast(arrayRemoveNulls(an))\n    | summarize total_metrics = sum(if(kind == \"total_metrics\", last, else:0)), analyzed_metrics = sum(if(kind == \"analyzed_metrics\", last, else:0))\n    | fieldsAdd k = 1\n  ], kind:leftOuter, on:{k}, fields:{total_metrics, analyzed_metrics}\n| join [\n    timeseries am = max(`custom.metrics_usage.analyzed`), by:{metric_key}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array($LatestRun))), 0) > 600, coalesce(toLong(arrayFirst(array($LatestRun))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array($LatestRun))), 0) > 600, coalesce(toLong(arrayFirst(array($LatestRun))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd analyzed = 1\n    | fields metric_key, analyzed\n  ], kind:leftOuter, on:{metric_key}, fields:{analyzed}\n| filter coalesce(analyzed_metrics, 0) >= coalesce(total_metrics, 0) or coalesce(analyzed, 0) == 1\n| fieldsRemove analyzed, total_metrics, analyzed_metrics\n| fieldsAdd k = 1\n| join [\n    timeseries from:now()-30d, interval:1d\n    , data_points = sum(dt.sfm.metrics.ingest.datapoints, rate:24h)\n    , by:{grail.metric.key, grail.metric.type, grail.metric.source}\n    , filter:(startswith(grail.metric.key, \"dt.service.\")\n      or startswith(grail.metric