        const marker = (v) => `Metrics optimization workflow dashboard v${v}`;
        const versionOf = (d) => {
          const m = /^Metrics optimization workflow dashboard v(\d+)$/.exec(String(d.description ?? ""));
          return m ? Number(m[1]) : null;
        };
        const pathOf = (id) => `/ui/apps/dynatrace.dashboards/dashboard/${id}`;
        const content = () => new Blob([JSON.stringify(DASHBOARD)], { type: "application/json" });

        export default async function () {
          const existing = await documentsClient.listDocuments({ filter: `type == 'dashboard' and name == '${NAME}'`, pageSize: 1000, addFields: "description" });
          const mine = existing.documents.filter((d) => versionOf(d) !== null);
          if (mine.length > 0) {
            const d = mine[0];
            const have = versionOf(d);
            if (have >= DASHBOARD_VERSION) {
              return { created: false, updated: false, id: d.id, version: have, note: "The dashboard of this workflow is up to date; left untouched.", path: pathOf(d.id) };
            }
            // an older version of the dashboard of this workflow: replace its content, keep its name, owner and sharing
            await documentsClient.updateDocument({ id: d.id, optimisticLockingVersion: d.version, body: { description: marker(DASHBOARD_VERSION), content: content() } });
            return { created: false, updated: true, id: d.id, version: DASHBOARD_VERSION, previousVersion: have, note: `The dashboard of this workflow was updated from version ${have} to ${DASHBOARD_VERSION}.`, path: pathOf(d.id) };
          }
          const res = await documentsClient.createDocument({ body: { name: NAME, type: "dashboard", description: marker(DASHBOARD_VERSION), content: content() } });
          return { created: true, updated: false, id: res.id, version: DASHBOARD_VERSION, otherDashboardsWithThisName: existing.documents.length, path: pathOf(res.id) };
        }

