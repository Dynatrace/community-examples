          if (attempt > 0) {
            // the log of a failed attempt is lost with it, so the retry says why it is running
            console.log(`RETRY: slice ${slice}, attempt ${attempt + 1}. The previous attempt of this slice failed and its log is lost with it. Running out of memory (the limit is 256 MB) is the usual reason, when very large documents were held in memory together; this attempt reads notebooks one at a time and fewer dashboards at a time.`);
          }
          const plan = await result("plan");
          const N = plan.sliceCount;
          // the slices 0 to N-1 share the documents, the SLO pages and the detectors; the classic SLOs are read by a slice of their own (index N), so that the slice
          // with the most to read does not also carry them
          const isClassicSlice = plan.classicSlice === slice;
          const mine = (ids) => (slice < N ? ids.filter((id) => sliceOf(id, N) === slice) : []);
          const mineDocs = (ids) => (mode === "notebook" ? [] : mine(ids)); // dashboards and workflows: not in the one-notebook mode
          const mineNotebooks = (ids) => (mode === "notebook" ? [onlyId] : mode === "rest" ? [] : mine(ids));

          const [fieldRecs, dashIds, noteIds, selected] = await Promise.all([
            dqlAll("fieldsSnapshot metrics\n| fields field", 200000, "The list of the dimension names (fieldsSnapshot metrics)"),
            mode === "notebook" ? [] : listDocuments("dashboard"),
            mode ? [] : listDocuments("notebook"),
            result("select_metrics"), // the metrics that are analysed: the largest by data points (the same list for every step)
          ]);
          const wfIds = plan.workflowIds;
          // the SLO pages: page p belongs to slice (p - 1) mod N; the detectors: one range of creation time per slice (a small number: slice 0 reads all)
          const sloPages = [];
          if (slice < N && mode !== "notebook") for (let p = slice + 1; p <= plan.sloPages; p += N) sloPages.push(p);
          const detectorRange = slice >= N || mode === "notebook" ? null : plan.detectorRanges.length ? plan.detectorRanges[slice] ?? null : slice === 0 ? { from: null, to: null } : null;
          const billableKeys = new Set(arr(selected && selected.keys).map(str).filter(Boolean));
          const dimFields = new Set(fieldRecs.map((r) => str(r.field)).filter(Boolean));
          if (!billableKeys.size || !dimFields.size) throw new Error(`lookup returned nothing (${billableKeys.size} keys, ${dimFields.size} field names)`);
          RAW_KEYS = billableKeys;

          const read = { dashboards: 0, notebooks: 0, workflows: 0, slos: 0, classicSlos: 0, anomalyDetectors: 0 };
          const jobs = [
            ["dashboards", () => readDocuments("dashboard", mineDocs(dashIds), attempt > 0 ? 1 : CONCURRENCY)],
            ["notebooks", () => readDocuments("notebook", mineNotebooks(noteIds), attempt > 0 ? 1 : 2)], // two at a time: a notebook with cached results can be tens of MB, and the task has 256 MB
            ["workflows", () => readWorkflows(mineDocs(wfIds))],
            ["slos", () => readSloPages(sloPages)],
            ["classicSlos", () => (isClassicSlice && plan.classicSlos > 0 && mode !== "notebook" ? readClassicSlos() : 0)],
            ["anomalyDetectors", () => (detectorRange ? readDetectors(detectorRange) : 0)],
          ];
          // every reader is awaited and every failure is reported: the first failure no longer hides the others
          // a retry (the first attempt ran out of memory or time) is the careful one: one document at a time, and the notebooks only after the dashboards are read, so that
          // no two large documents are in memory together; the slices are small enough for that to fit into the time of a slice
          const started = [];
          const settled = await Promise.allSettled(
            jobs.map(([, run], i) => {
              const p = Promise.resolve(attempt > 0 && i === 1 ? started[0].then(run, run) : run());
              started.push(p.catch(() => {}));
              return p;
            }),
          );
          const failures = [];
          settled.forEach((r, i) => {
            if (r.status === "fulfilled") read[jobs[i][0]] = r.value;
            else failures.push(`- ${jobs[i][0]}: ${String(r.reason && r.reason.message ? r.reason.message : r.reason)}`);
          });
          if (failures.length) throw new Error(`Slice ${slice} of ${plan.slices.length} could not read everything (attempt ${attempt + 1}):\n${failures.join("\n")}`);

          // distinct artifacts per (metric key, artifact type); a token is a maximal run of key characters. Only metric keys that are billable
          // are kept: the dashboard only looks at those. Each artifact is in one slice only, so the slices' counts add up.
          const TOKEN = /[A-Za-z0-9_.\-]+/g;
          const used = new Map();
          const scope = new Map();
          const dimUse = new Map();
          const addTo = (map, k, id) => {
            if (!map.has(k)) map.set(k, new Set());
            map.get(k).add(id);
          };
          let skipped = 0;
          const analysed = new Map();
          for (const r of rows) {
            if (isAnalysisQuery(r.query)) {
              skipped++;
              continue;
            }
            let an = analysed.get(r.query);
            if (!an) {
              const discoveryKey = r.query.match(DISCOVERY)?.[1]; // dimension discovery of one key does not count as use of it
              const tokens = new Set(r.query.match(TOKEN) ?? []);
              const dims = [...tokens].filter((x) => dimFields.has(x) && !billableKeys.has(x));
              an = {
                dims,
                keys: [...tokens].filter((token) => !(token === discoveryKey || token.length > MAX_TOKEN_LENGTH || !/[A-Za-z_]/.test(token)) && billableKeys.has(token)),
              };
              analysed.set(r.query, an);
            }
            for (const token of an.keys) {
              addTo(used, `${token}\u0000${r.kind}`, r.id);
              addTo(scope, `${token}\u0000${r.kind}\u0000${an.dims.length ? "specific-dimensions" : "all-series"}`, r.id);
              for (const d of an.dims) addTo(dimUse, `${token}\u0000${d}`, r.id);
            }
          }
          // the keys that unparsable documents name (read as plain text): used, in the scope all series
          for (const r of rawRows) {
            for (const token of r.keys) {
              addTo(used, `${token}\u0000${r.kind}`, r.id);
              addTo(scope, `${token}\u0000${r.kind}\u0000all-series`, r.id);
            }
          }
          console.log(`slice ${slice} of ${N}${mode ? ` (read again, ${mode === "notebook" ? "notebook " + onlyId : "all but the notebooks"})` : ""}, attempt ${attempt + 1}: ${read.dashboards} dashboards, ${read.notebooks} notebooks, ${read.workflows} workflows, ${read.slos} SLOs, ${read.classicSlos} classic SLOs and ${read.anomalyDetectors} anomaly detectors read in ${Math.round((Date.now() - t0) / 100) / 10} s` + (largeDocuments.length ? `. Large documents (read as text): ${largeDocuments.join("; ")}` : "") + `. Memory held by documents at most: ${Math.round(held.peak / 1e5) / 10} MB` + (unparsed.length ? `. ${unparsed.length} document(s) could not be parsed and were read as plain text (see the UNPARSED lines)` : ""));
          return {
            slice,
            mode: mode || undefined,
            docId: onlyId || undefined, // the notebook of a one-notebook read: the step classify tells a notebook that did not come back from the ones that did
            sliceCount: N,
            read,
            queryStrings: rows.length,
            skipped,
            unparsed: unparsed.slice(0, 50),
            unparsedCount: unparsed.length,
            memoryPeakChars: held.peak,
            entries: { used: used.size, scope: scope.size, dims: dimUse.size },
            packed: await pack({
              used: [...used].map(([k, ids]) => [...k.split("\u0000"), ids.size]),
              scope: [...scope].map(([k, ids]) => [...k.split("\u0000"), ids.size]),
              dims: [...dimUse].map(([k, ids]) => [...k.split("\u0000"), ids.size]),
            }),
            seconds: Math.round((Date.now() - t0) / 100) / 10,
          };
        }

  read_history:
    name: read_history
    position:
      x: 3
      y: 3
    description: Each slice counts the executed queries of its range of time (the history of the last 30, 60 or 90 days, the input historyDays, is cut into slices) that use each analysed metric, for the windows that are counted (30, 60 and 90 days at most). The database hands over the words of the distinct queries and the task matches them with the metrics and dimension names
    action: dynatrace.automations:run-javascript
    withItems: slice in {{ result("plan")["historySliceIds"] }}
    concurrency: 6
    predecessors:
      - plan
      - select_metrics
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 50000; // a metric with more series in the last hour is skipped: its sample would not give a valid ratio
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- hand-over between tasks
        // The result of a task is limited to about 5 MB, and the results of all slices reach one task. A slice therefore packs its counts (gzip, then
        // base64 text). Gzip is lossless (and checks its own contents with a CRC32 when it is unpacked); the length of the unpacked text and a checksum of the packed
        // bytes are checked on arrival, so damaged data stops the run. The checksum is over the PACKED bytes (final52): over the unpacked text it took 10 to 11 s for a
        // slice of 16 million characters in the task runtime (the largest customer tenant), more than the whole unpacking (2 s), and the merge of 21 such slices ran
        // out of its 120 seconds.
        const fnvBytes = (b) => {
          let h = 0x811c9dc5;
          for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 16777619) >>> 0;
          return h.toString(16);
        };
        async function gzipText(text) {
          const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        }
        async function gunzipBytes(bytes) {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }
        function toBase64(bytes) {
          let s = "";
          for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          return btoa(s);
        }
        function fromBase64(b64) {
          const s = atob(b64);
          const out = new Uint8Array(s.length);
          for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
          return out;
        }
        async function pack(value) {
          const text = JSON.stringify(value);
          const bytes = await gzipText(text);
          return { format: "gzip+base64", length: text.length, checksum: fnvBytes(bytes), data: toBase64(bytes) };
        }
        async function unpack(p) {
          if (!p || p.format !== "gzip+base64") throw new Error("a slice handed over its counts in an unknown format");
          let text;
          try {
            const bytes = fromBase64(p.data);
            if (fnvBytes(bytes) !== p.checksum) throw new Error("the checksum of the packed bytes differs");
            text = await gunzipBytes(bytes);
          } catch (e) {
            throw new Error(`the counts handed over by a slice are damaged (they cannot be unpacked${e && e.message ? `: ${e.message}` : ""}); nothing was analysed`);
          }
          if (text.length !== p.length) throw new Error("the counts handed over by a slice are damaged (length or checksum differ); nothing was analysed");
          return JSON.parse(text);
        }

        // ---------------------------------------------------------------- read_history
        // How much each billable metric is used by executed queries, for the windows the dashboard offers (30, 60 and 90 days; the input historyDays chooses how many days are read, 30 by default). The history of the last days is
        // counted in slices of time, one task each (see planHistory in the plan): a single scan of a large history does not finish in the 2 minutes a task gets.
        // A slice counts the runs of the queries that were executed in its range of time [from, to); for the three windows at once, because the limits of the
        // windows are absolute times: a run is counted in a window if it is newer than the limit of the window. The counts of the slices add up (every run is in one
        // slice), and the next step (query_history) adds them up and writes the usage metrics.
        // A slice returns, packed, for every analysed metric the runs of queries that name it (r30, r60, r90), and for every pair of a metric and a dimension that
        // a query names together the share of the runs (s30, s60, s90: a run that names several dimensions is shared between them, as the dashboard always did).
        // The database only groups the executed queries by their text and hands over the words of each distinct query with its three run counts (a slice of the history
        // of a large tenant is tens of thousands of distinct queries): matching the words against the analysed metrics (the list of select_metrics) and the names of
        // the dimensions (fieldsSnapshot) is done here. The two joins of the earlier version did the same in the database and took 100 s and more for a slice of old
        // days, which is more than a task may run.

        // executed queries that analyse ingest cost or shape count as no use of a metric
        const HISTORY_EXCLUDES = String.raw`| filter not contains(query_string, "dt.sfm.metrics.ingest.datapoints")
        | filter not contains(query_string, "QUERY_EXECUTION_EVENT")
        | filter not contains(query_string, "moprs_series")
        | filter not contains(query_string, "timeseries val=count(")
        | filter not contains(query_string, "| limit 1000")
        | filter not startsWith(trim(query_string), "metrics")
        | filter not contains(query_string, "countDistinct(array(")
        | filter not endsWith(trim(query_string), "limit 0")`;
        const at = (ms) => `toTimestamp(${ms}000000)`; // nanoseconds, written without a number that is too large for a double
        const TOKENS_MAX = 150000; // distinct queries a slice may return: a result that reaches it may be cut off, which stops the run
        const FIELDS_MAX = 2000000; // names of dimensions
        const TOKENS_MAX_BYTES = 14000000; // what one read may hand over (compact JSON). Measured in the task (256 MB) on dev, 2026-11-24: results of 13.7 MB ran, 20 MB ran out of memory (with the counts of a slice per pair); parsing takes about 2 times the size and the text is held as well
        const MAX_SPLITS = 4; // a range whose distinct queries do not fit is cut in two, again and again, up to this many times (16 parts)
        const SLICE_DEADLINE_MS = 105000; // a query that has not finished by then is cancelled: the platform ends a task at 120 s without saying why

        // The words of every distinct executed query, with the runs of it in the three windows. A word is written with a "~" where the text before it marks a command
        // ("| fetch"), a function ("sum(") or a parameter ("from:"): those words are no dimensions, and without the marks the same words are the candidates for metrics
        // (a word is split at every "~"). One array is handed over for both uses.
        const tokensQuery = (s, cuts) => String.raw`fetch dt.system.events, from: ${at(s.from)}, to: ${at(s.to)}
        | filter event.kind == "QUERY_EXECUTION_EVENT" and isNotNull(query_string)
        ${HISTORY_EXCLUDES}
        | summarize r30 = countDistinct(if(timestamp >= ${at(cuts.t30)}, query_id)), r60 = countDistinct(if(timestamp >= ${at(cuts.t60)}, query_id)), r90 = countDistinct(query_id), by:{query_string}
        | fieldsAdd tokens = arrayDistinct(splitString(replacePattern(replaceString(replaceString(replaceString(replaceString(concat("~", query_string), "| ", "~"), "|\n", "~"), "(", "~ "), ":", "~ "), "[^A-Za-z0-9_.~-]+", " "), " "))
        | fields tokens, r30, r60, r90`;
        // the names of all dimensions the platform knows: a word of a query is a dimension if it is one of them
        const FIELDS_QUERY = `fieldsSnapshot metrics | fields dim = field`;

        /**
         * Counts, from the words of the distinct queries, as the two queries of the database did before:
         *  - runs: per analysed metric the runs of the queries that name it (three windows),
         *  - spec: per metric the runs of the queries that name it together with a dimension (a dimension that is the metric itself is none),
         *  - pairs: per pair of a metric and a dimension that a query names together, in which windows (bit 1: 30 days, 2: 60 days, 4: 90 days).
         * The share of a run between the dimensions of a query (r / n for each) was added up per pair and then per metric; the sum per metric is the run itself, and of a
         * pair only the windows in which it occurs are used, so the numbers per pair are not kept (that was most of the memory and of the bytes of a slice).
         * keys: the analysed metrics, dimNames: the names of the dimensions. The counts are added to acc: halves of a range of time share one.
         */
        // The names are handed over once per slice (a dictionary) and the pairs as numbers: a pair as text (two long names) was about 95 bytes, a busy slice of the
        // largest customer tenant has 170,000 of them, and unpacking 21 such slices took more than the 120 seconds of the next step (final52).
        const DIM_CAP = 4194304; // a pair of ids is mi * DIM_CAP + di
        const newCounts = () => ({ mIds: new Map(), mNames: [], dIds: new Map(), dNames: [], runs: new Map(), spec: new Map(), pairs: new Map() });
        const idOf = (ids, names, name) => {
          let i = ids.get(name);
          if (i === undefined) {
            i = names.length;
            names.push(name);
            ids.set(name, i);
          }
          return i;
        };
        function matchTokens(records, keys, dimNames, acc) {
          for (const rec of records) {
            const words = arr(rec.tokens);
            const r0 = Number(rec.r30) || 0;
            const r1 = Number(rec.r60) || 0;
            const r2 = Number(rec.r90) || 0;
            const metrics = new Set();
            const dimWords = new Set();
            for (const w of words) {
              if (typeof w !== "string" || w === "") continue;
              if (w.includes("~")) {
                for (const piece of w.split("~")) if (piece !== "" && keys.has(piece)) metrics.add(piece);
              } else {
                if (keys.has(w)) metrics.add(w);
                if (dimNames.has(w)) dimWords.add(w);
              }
            }
            if (!metrics.size) continue;
            const mask = (r0 > 0 ? 1 : 0) | (r1 > 0 ? 2 : 0) | (r2 > 0 ? 4 : 0);
            let dimIds = null; // the dimensions of the query, as ids (made once per query)
            for (const m of metrics) {
              const mi = idOf(acc.mIds, acc.mNames, m);
              let e = acc.runs.get(mi);
              if (!e) acc.runs.set(mi, (e = [0, 0, 0]));
              e[0] += r0;
              e[1] += r1;
              e[2] += r2;
              const own = dimWords.has(m) ? dimWords.size - 1 : dimWords.size;
              if (own === 0) continue;
              let sp = acc.spec.get(mi);
              if (!sp) acc.spec.set(mi, (sp = [0, 0, 0]));
              sp[0] += r0;
              sp[1] += r1;
              sp[2] += r2;
              if (!mask) continue;
              if (!dimIds) {
                dimIds = [];
                for (const d of dimWords) dimIds.push([d, idOf(acc.dIds, acc.dNames, d)]);
              }
              for (const [d, di] of dimIds) {
                if (d === m) continue;
                const k = mi * DIM_CAP + di;
                acc.pairs.set(k, (acc.pairs.get(k) | 0) | mask);
              }
            }
          }
        }

        const fmtTime = (ms) => `${new Date(ms).toISOString().slice(0, 16).replace("T", " ")} UTC`;
        const fmtCount = (n) => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        /** One query of the slice that is given up at the deadline of the task, with the platform's words: a query still running is cancelled (and the message says so). */
        async function queryUntil(query, max, maxBytes) {
          const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: maxBytes, fetchTimeoutSeconds: 60, enablePreview: false } });
          let state = start.state;
          let res = start.result;
          const token = start.requestToken;
          while (state !== "SUCCEEDED") {
            if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`the query ${state}`);
            if (!token) throw new Error("the query returned no request token");
            const left = SLICE_DEADLINE_MS - (Date.now() - STARTED);
            if (left <= 1000) {
              try {
                await queryExecutionClient.queryCancel({ requestToken: token });
              } catch {
                /* the task ends soon anyway */
              }
              throw Object.assign(new Error(`the query had not finished after ${Math.round((Date.now() - STARTED) / 1000)} s and was cancelled`), { timedOut: true });
            }
            const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: Math.min(30000, left) });
            state = poll.state;
            res = poll.result;
          }
          return arr(res?.records).filter((r) => r !== null);
        }

        /** A query of the slice. A failure is repeated once if it came early enough for another try to fit in the time of the task; a timeout and a result that may be cut off are not repeated. */
        async function sliceQuery(query, max, what, maxBytes = 200000000) {
          let last;
          for (let n = 0; n < 2; n++) {
            const t = Date.now();
            try {
              const recs = await retry(() => queryUntil(query, max, maxBytes), 1);
              if (recs.length >= max) throw Object.assign(new Error(`the result reached its limit of ${fmtCount(max)} rows and may be cut off`), { final: true, overflow: true });
              return recs;
            } catch (e) {
              last = e;
              if (e.timedOut || e.final || permanent(e) || Date.now() - STARTED > 50000) break;
              await new Promise((r) => setTimeout(r, 1000 * (n + 1)));
            }
          }
          throw Object.assign(new Error(`the ${what} query failed: ${String(last && last.message ? last.message : last)}`), { timedOut: last && last.timedOut, overflow: last && last.overflow });
        }


        /**
         * The counts of a range of time. The distinct queries of a range are what is handed over: when a range has more of them than one task may read (a burst of
         * generated queries on one day is enough; the plan only samples the last two days), it is cut in two halves that are counted one after the other, again
         * and again, into the same counts. The counts of two ranges add up exactly: a run is in the range of its time only.
         */
        async function countRange(from, to, depth, ctx) {
          let recs;
          try {
            recs = await sliceQuery(tokensQuery({ from, to }, ctx.cuts), TOKENS_MAX, "executed queries", TOKENS_MAX_BYTES);
            // a result that reaches the byte limit is cut off by the platform without an error: the words are measured, and a result near the limit counts as too large
            let wordBytes = 0;
            for (const rec of recs) for (const w of arr(rec.tokens)) wordBytes += String(w).length + 4;
            ctx.peakBytes = Math.max(ctx.peakBytes, wordBytes); // the largest read of the slice, for the log: how near it came to the limit
            if (wordBytes >= TOKENS_MAX_BYTES * 0.85) {
              throw Object.assign(new Error(`the executed queries of this slice are about ${fmtCount(wordBytes)} bytes of words, near the limit of ${fmtCount(TOKENS_MAX_BYTES)} that one slice may read, so the result may have been cut off`), { overflow: true });
            }
          } catch (e) {
            if (!e.overflow) throw e;
            recs = null;
            if (depth >= MAX_SPLITS || to - from < 2) {
              throw new Error(`${e.message}, also after cutting the range in halves ${depth} times (${fmtTime(from)} to ${fmtTime(to)}). This slice is too large for one task: the history of this tenant is larger than the plan estimated`);
            }
            const mid = Math.floor((from + to) / 2);
            ctx.splits++;
            console.log(`read_history: ${fmtTime(from)} to ${fmtTime(to)} has too many different queries (${String(e.message).slice(0, 80)}): counting the two halves one after the other`);
            await countRange(from, mid, depth + 1, ctx);
            await countRange(mid, to, depth + 1, ctx);
            return;
          }
          const dimNames = await ctx.dimNames;
          matchTokens(recs, ctx.keys, dimNames, ctx.acc);
          ctx.queries += recs.length;
        }

        /**
         * A look at the range before the long read, only for the log: how many executed queries it has and how long the longest text is. If the read fails (the platform
         * often says only "N retry attempts failed"), this line, written before the read, is what tells whether very long texts were in the range. It never fails the
         * slice and waits at most 15 s: a range that cannot be looked at is logged as such.
         */
        async function logRangeCheck(slice, total, spec) {
          const query = `fetch dt.system.events, from: ${at(spec.from)}, to: ${at(spec.to)}
        | filter event.kind == "QUERY_EXECUTION_EVENT" and isNotNull(query_string)
        | summarize events = count(), longest = max(stringLength(query_string)), over100k = countIf(stringLength(query_string) > 100000), over30k = countIf(stringLength(query_string) > 30000)`;
          let timer;
          try {
            const rows = await Promise.race([
              queryUntil(query, 5, 1000000),
              new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error("no answer within 15 s")), 15000);
              }),
            ]);
            const r = rows[0] || {};
            console.log(`read_history: slice ${slice + 1} of ${total} range check: ${fmtCount(r.events)} executed queries, longest text ${fmtCount(r.longest)} characters, ${fmtCount(r.over30k)} over 30,000 and ${fmtCount(r.over100k)} over 100,000 characters`);
          } catch (e) {
            console.log(`read_history: slice ${slice + 1} of ${total} range check not available (${String(e && e.message ? e.message : e).slice(0, 120)})`);
          } finally {
            clearTimeout(timer);
          }
        }

        export default async function () {
          const t0 = Date.now();
          const ex = await actionExecution();
          const slice = Number(ex.loopItem.slice ?? ex.loopItem);
          const plan = await result("plan");
          const spec = plan.historySlices[slice];
          if (!spec) throw new Error(`the plan has no history slice ${slice}`);
          const total = plan.historySlices.length;
          const label = `History slice ${slice + 1} of ${total} (${fmtTime(spec.from)} to ${fmtTime(spec.to)})`;
          console.log(`read_history: slice ${slice + 1} of ${total}, ${fmtTime(spec.from)} to ${fmtTime(spec.to)}`);
          await logRangeCheck(slice, total, spec);
          // the metrics that are analysed: the largest by data points, chosen once by the step select_metrics (the same list for every step)
          const selected = await result("select_metrics");
          if (!selected || !Array.isArray(selected.keys) || !selected.keys.length) throw new Error(`${label}: the step select_metrics returned no list of metrics`);
          const times = {};
          const timed = (name, p) => p.then((v) => ((times[name] = Math.round((Date.now() - t0) / 100) / 10), v));
          // the names of the dimensions are read next to the first query of the words (a failure of them is raised where they are needed, and by the check below)
          const dimNamesP = timed("fields", sliceQuery(FIELDS_QUERY, FIELDS_MAX, "dimension names")).then((rows) => new Set(rows.map((r) => str(r.dim)).filter(Boolean)));
          dimNamesP.catch(() => {});
          const ctx = { cuts: plan.historyCuts, keys: new Set(selected.keys), dimNames: dimNamesP, splits: 0, queries: 0, peakBytes: 0, acc: newCounts() };
          try {
            await timed("tokens", countRange(spec.from, spec.to, 0, ctx));
            await dimNamesP;
          } catch (e) {
            const timedOut = e && e.timedOut;
            const messages = [String(e && e.message ? e.message : e)];
            try {
              await dimNamesP;
            } catch (e2) {
              if (e2 !== e) messages.push(String(e2 && e2.message ? e2.message : e2));
            }
            throw new Error(`${label} failed after ${Math.round((Date.now() - t0) / 100) / 10} s: ${messages.join("; ")}.${timedOut ? ` This slice is too large for one task: the history of this tenant is larger than the plan estimated. Send this message to the workflow owner.` : /too large for one task/.test(messages[0]) ? " Send this message to the workflow owner." : " Run the workflow again; if it fails again, send this message to the workflow owner."}`);
          }
          times.match = Math.round((Date.now() - t0) / 100) / 10;
          // the windows that are not counted are written as 0: with 30 days of history the 60 and 90 day numbers would repeat the 30 day ones
          const wins = arr(plan.historyWindows).length ? arr(plan.historyWindows).map(Number) : [30, 60, 90];
          const keep = [wins.includes(30), wins.includes(60), wins.includes(90)];
          const keepMask = (keep[0] ? 1 : 0) | (keep[1] ? 2 : 0) | (keep[2] ? 4 : 0);
          const sums = (m) => [...m].map(([mi, v]) => [mi, ...[0, 1, 2].map((i) => (keep[i] ? Math.round(v[i]) : 0))]);
          const runs = sums(ctx.acc.runs);
          const specific = sums(ctx.acc.spec);
          const pairs = []; // flat: metric id, dimension id, windows (three numbers a pair)
          for (const [k, mask] of ctx.acc.pairs) {
            const m = mask & keepMask;
            if (!m) continue;
            pairs.push(Math.floor(k / DIM_CAP), k % DIM_CAP, m);
          }
          const names = { m: ctx.acc.mNames, d: ctx.acc.dNames };
          ctx.acc = null; // the counts are in the rows now
          const packed = await pack({ m: names.m, d: names.d, runs, spec: specific, pairs });
          if (packed.data.length > plan.historyBytesPerSlice) {
            throw new Error(`${label}: the counts of this slice are ${fmtCount(packed.data.length)} bytes packed, more than the ${fmtCount(plan.historyBytesPerSlice)} that one slice may hand over (one slice result is refused above about 6.5 MB). This part of the history has very many metrics and dimensions named together by its queries. Try the input historyDays with a shorter time, or send this message to the workflow owner.`);
          }
          const seconds = Math.round((Date.now() - t0) / 100) / 10;
          console.log(`read_history: slice ${slice + 1} of ${total} done in ${seconds} s: ${fmtCount(ctx.queries)} distinct queries${ctx.splits ? ` (range cut in halves ${ctx.splits} time${ctx.splits === 1 ? "" : "s"})` : ""}, ${fmtCount(runs.length)} metrics with runs, ${fmtCount(pairs.length / 3)} metric and dimension pairs, ${fmtCount(packed.data.length)} bytes packed, largest read ${(ctx.peakBytes / 1e6).toFixed(1)} MB of words (${Math.round((100 * ctx.peakBytes) / TOKENS_MAX_BYTES)}% of the ${TOKENS_MAX_BYTES / 1e6} MB limit)`);
          return { slice, sliceCount: total, from: spec.from, to: spec.to, queries: ctx.queries, peakWordBytes: ctx.peakBytes, splits: ctx.splits, runs: runs.length, spec: specific.length, dims: pairs.length / 3, bytes: packed.data.length, times, seconds, packed };
        }

  query_history:
    name: query_history
    position:
      x: 1
      y: 3
    description: Add up the counts of the history slices and ingest the usage of each metric by executed queries of the counted windows (30 days by default; the input historyDays allows 60 and 90), so the dashboard does not scan the query history when it loads
    action: dynatrace.automations:run-javascript
    predecessors:
      - read_history
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 50000; // a metric with more series in the last hour is skipped: its sample would not give a valid ratio
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- hand-over between tasks
        // The result of a task is limited to about 5 MB, and the results of all slices reach one task. A slice therefore packs its counts (gzip, then
        // base64 text). Gzip is lossless (and checks its own contents with a CRC32 when it is unpacked); the length of the unpacked text and a checksum of the packed
        // bytes are checked on arrival, so damaged data stops the run. The checksum is over the PACKED bytes (final52): over the unpacked text it took 10 to 11 s for a
        // slice of 16 million characters in the task runtime (the largest customer tenant), more than the whole unpacking (2 s), and the merge of 21 such slices ran
        // out of its 120 seconds.
        const fnvBytes = (b) => {
          let h = 0x811c9dc5;
          for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 16777619) >>> 0;
          return h.toString(16);
        };
        async function gzipText(text) {
          const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        }
        async function gunzipBytes(bytes) {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }
        function toBase64(bytes) {
          let s = "";
          for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          return btoa(s);
        }
        function fromBase64(b64) {
          const s = atob(b64);
          const out = new Uint8Array(s.length);
          for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
          return out;
        }
        async function pack(value) {
          const text = JSON.stringify(value);
          const bytes = await gzipText(text);
          return { format: "gzip+base64", length: text.length, checksum: fnvBytes(bytes), data: toBase64(bytes) };
        }
        async function unpack(p) {
          if (!p || p.format !== "gzip+base64") throw new Error("a slice handed over its counts in an unknown format");
          let text;
          try {
            const bytes = fromBase64(p.data);
            if (fnvBytes(bytes) !== p.checksum) throw new Error("the checksum of the packed bytes differs");
            text = await gunzipBytes(bytes);
          } catch (e) {
            throw new Error(`the counts handed over by a slice are damaged (they cannot be unpacked${e && e.message ? `: ${e.message}` : ""}); nothing was analysed`);
          }
          if (text.length !== p.length) throw new Error("the counts handed over by a slice are damaged (length or checksum differ); nothing was analysed");
          return JSON.parse(text);
        }

        const DRY_RUN = false; // true: measure only, nothing is ingested

        const q = (s) => `"${s.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
        // every line of a run gets the time the run started (set from the plan), so a run is one snapshot of the dashboard, however long it takes
        let RUN_TS = 0;
        const stamp = (l) => (RUN_TS > 0 ? `${l} ${RUN_TS}` : l);
        async function ingest(ls) {
          let o = 0;
          let bad = 0;
          for (let i = 0; i < ls.length; i += 1000) {
            const res = await retry(() => metricsClient.ingest({ body: ls.slice(i, i + 1000).map(stamp).join("\n") }));
            o += res.linesOk ?? 0;
            bad += res.linesInvalid ?? 0;
          }
          if (bad > 0 || o !== ls.length) throw new Error(`ingest problem: ${o} ok, ${bad} invalid, ${ls.length} sent`);
          return o;
        }

        // ---------------------------------------------------------------- query_history
        // How much each billable metric is used by executed queries, for the windows the dashboard offers (30, 60 and 90 days). The slices of the step read_history
        // counted the history of the last 90 days in slices of time; this step adds them up and writes the results into small custom metrics, so the dashboard does
        // not scan the history every time it loads (that was 6 scans of 90 days per load, 20 to 37 seconds):
        //   custom.metrics_usage.query_runs           (metric_key, window_days)  runs of queries that name the metric
        //   custom.metrics_usage.query_runs_specific  (metric_key, window_days)  runs of queries that also name one of its dimensions
        //   custom.metrics_usage.query_dimensions     (metric_key, dimension)    the smallest window (30, 60 or 90) in which a query names the dimension with the metric
        // The 30-day numbers are also returned: the classification of the workflow (classify) uses them.
        const QUERY_RUNS_METRIC = "custom.metrics_usage.query_runs";
        const QUERY_SPECIFIC_METRIC = "custom.metrics_usage.query_runs_specific";
        const QUERY_DIMENSIONS_METRIC = "custom.metrics_usage.query_dimensions";
        const DIM_CAP = 4194304; // a pair of a metric and a dimension is the number metric * DIM_CAP + dimension (the numbering of the merge, see the slices)
        const MAX_HISTORY_PAIRS = 250000; // different pairs of a metric and a dimension that queries name together: the sums of all slices are held in memory (256 MB for the task): 230,000 pairs ran with a 200 MB heap, 600,000 did not (synthetic test, 2026-11-24)
        const MAX_HISTORY_LINES = 300000; // about 11 lines per billable metric: this is a tenant with about 27,000 of them (and about $0.45 of ingest)

        /** Ingest in chunks of 1,000 lines, eight at a time. */
        async function ingestParallel(ls) {
          const chunks = [];
          for (let i = 0; i < ls.length; i += 1000) chunks.push(ls.slice(i, i + 1000));
          let ok = 0;
          let bad = 0;
          await pmap(chunks, 8, async (chunk) => {
            const res = await retry(() => metricsClient.ingest({ body: chunk.map(stamp).join("\n") }));
            ok += res.linesOk ?? 0;
            bad += res.linesInvalid ?? 0;
          });
          if (bad > 0 || ok !== ls.length) throw new Error(`ingest problem: ${ok} ok, ${bad} invalid, ${ls.length} sent`);
          return ok;
        }

        export default async function () {
          const t0 = Date.now();
          const plan = await result("plan");
          RUN_TS = Number(plan.startedAtMs) || 0;
          const ids = arr(plan.historySliceIds);
          if (!ids.length) throw new Error("the plan has no history slices");
          // every slice has to be there once: a missing one would leave a part of the history uncounted, and metrics used only there would look unused
          const bySlice = new Map();
          for (const r of arr(await result("read_history"))) if (r && typeof r.slice === "number" && r.packed) bySlice.set(r.slice, r);
          const missing = ids.filter((i) => !bySlice.has(i));
          if (missing.length) throw new Error(`no result for history slice(s) ${missing.map((i) => i + 1).join(", ")} of ${ids.length}: a part of the query history was not counted, so nothing was analysed`);
          // what the slices hand over together has to stay within what a loop result is known to carry
          const totalBytes = [...bySlice.values()].reduce((a, r) => a + (Number(r.bytes) || 0), 0);
          const maxTotal = Number(plan.historyTotalBytes) || 0;
          const peakRead = [...bySlice.values()].reduce((a, r) => Math.max(a, Number(r.peakWordBytes) || 0), 0); // the largest read of any slice (the read limit is 14 MB, see read_history)
          if (maxTotal && totalBytes > maxTotal) {
            const big = [...bySlice.values()].filter((r) => (Number(r.bytes) || 0) > 500000).length;
            throw new Error(`the counts of all ${ids.length} history slices are ${totalBytes.toLocaleString("en-US")} bytes together, more than the ${maxTotal.toLocaleString("en-US")} that the slices may hand over together (${big} of them are larger than 500,000 bytes: parts of the history in which queries name very many metrics and dimensions). Nothing was analysed. Try the input historyDays with fewer days, or send this message to the workflow owner.`);
          }
          // the counts of the slices add up: every run was executed in exactly one slice. A slice hands over its names once (m: metrics, d: dimensions) and numbers
          // for the rest: the names of all slices are put into one numbering here, and a pair is the number metric * DIM_CAP + dimension (final52: as text, the pairs of 21
          // busy slices of the largest customer tenant took more than the 120 seconds of this step to unpack).
          const gm = { ids: new Map(), names: [] };
          const gd = { ids: new Map(), names: [] };
          const idOf = (g, name) => {
            let i = g.ids.get(name);
            if (i === undefined) {
              i = g.names.length;
              g.names.push(name);
              g.ids.set(name, i);
            }
            return i;
          };
          const runsById = new Map();
          const specById = new Map(); // per metric: the runs of the queries that also name one of its dimensions
          const pairMask = new Map(); // per pair of a metric and a dimension: the windows in which a query names them together (bit 1: 30 days, 2: 60 days, 4: 90 days)
          let slowest = 0;
          const addTo = (map, id, a, b, c) => {
            const e = map.get(id);
            if (e) {
              e[0] += a;
              e[1] += b;
              e[2] += c;
            } else map.set(id, [a, b, c]);
          };
          for (const i of ids) {
            const r = bySlice.get(i);
            const c = await unpack(r.packed);
            const pairs = arr(c.pairs);
            if (c.runs.length !== r.runs || pairs.length !== 3 * (r.dims ?? 0) || arr(c.spec).length !== (r.spec ?? 0)) throw new Error(`history slice ${i + 1} of ${ids.length}: the number of rows handed over differs from the number sent`);
            slowest = Math.max(slowest, Number(r.seconds) || 0);
            const mMap = arr(c.m).map((n) => idOf(gm, str(n)));
            const dMap = arr(c.d).map((n) => idOf(gd, str(n)));
            for (const [mi, r30, r60, r90] of c.runs) addTo(runsById, mMap[mi], r30, r60, r90);
            for (const [mi, s30, s60, s90] of arr(c.spec)) addTo(specById, mMap[mi], s30, s60, s90);
            for (let j = 0; j < pairs.length; j += 3) {
              const k = mMap[pairs[j]] * DIM_CAP + dMap[pairs[j + 1]];
              pairMask.set(k, (pairMask.get(k) | 0) | pairs[j + 2]);
            }
            if (pairMask.size > MAX_HISTORY_PAIRS) {
              throw new Error(`the queries of the history name ${pairMask.size.toLocaleString("en-US")} different pairs of a metric and a dimension after ${ids.indexOf(i) + 1} of ${ids.length} slices, more than the ${MAX_HISTORY_PAIRS.toLocaleString("en-US")} that one run can add up (queries that name very many metrics and dimensions together). Nothing was analysed. Lower the input maxMetrics (the pairs are counted for the analysed metrics only) or the input historyDays, or send this message to the workflow owner.`);
            }
          }
          const scanSeconds = Math.round((Date.now() - t0) / 100) / 10;
          const WINDOWS = ["30", "60", "90"];
          // only the windows that were counted get lines: with 30 days of history the 60 and 90 day numbers would repeat the 30 day ones (a window longer than the history read)
          const counted = arr(plan.historyWindows).length ? arr(plan.historyWindows).map(Number) : [30, 60, 90];
          const has = (i) => counted.includes(Number(WINDOWS[i]));
          const lines = [];
          const runs30 = [];
          for (const [id, e] of runsById) {
            const key = gm.names[id];
            if (!key) continue;
            e.forEach((v, i) => {
              const n = Number(v) || 0;
              if (n > 0 && has(i)) lines.push(`${QUERY_RUNS_METRIC},metric_key=${q(key)},window_days="${WINDOWS[i]}" ${n}`);
            });
            if ((Number(e[0]) || 0) > 0) runs30.push([key, Number(e[0])]);
          }
          // per (metric, dimension): the smallest window of use; per metric: the runs of queries that also name one of its dimensions, per window
          const dims30 = new Map();
          let dimensionPairs = 0;
          for (const [k, mask] of pairMask) {
            const key = gm.names[Math.floor(k / DIM_CAP)];
            const dim = gd.names[k % DIM_CAP];
            if (!key || !dim) continue;
            const first = mask & 1 ? 30 : mask & 2 && has(1) ? 60 : mask & 4 && has(2) ? 90 : 0;
            if (first) {
              dimensionPairs++;
              lines.push(`${QUERY_DIMENSIONS_METRIC},metric_key=${q(key)},dimension=${q(dim)} ${first}`);
            }
            if (mask & 1) {
              if (!dims30.has(key)) dims30.set(key, []);
              dims30.get(key).push(dim);
            }
          }
          const spec30 = [];
          for (const [id, e] of specById) {
            const key = gm.names[id];
            if (!key) continue;
            for (let i = 0; i < 3; i++) {
              const n = Math.round(e[i]);
              if (n > 0 && has(i)) lines.push(`${QUERY_SPECIFIC_METRIC},metric_key=${q(key)},window_days="${WINDOWS[i]}" ${n}`);
            }
            const n30 = Math.round(e[0]);
            if (n30 > 0 || dims30.has(key)) spec30.push([key, n30, dims30.get(key) ?? []]);
          }
          if (lines.length > MAX_HISTORY_LINES) throw new Error(`the query history is too large to ingest: ${lines.length} lines (limit ${MAX_HISTORY_LINES})`);
          const ingested = DRY_RUN ? 0 : await ingestParallel(lines);
          // how near the run came to its limits, for the log and for the headroom line of classify
          const pct = (n, limit) => (limit ? Math.round((100 * n) / limit) : 0);
          const fmt = (n) => Math.round(Number(n) || 0).toLocaleString("en-US");
          const headroom = {
            pairs: pairMask.size,
            pairsLimit: MAX_HISTORY_PAIRS,
            handoverBytes: totalBytes,
            handoverLimit: maxTotal,
            lines: lines.length,
            linesLimit: MAX_HISTORY_LINES,
            mergeSeconds: scanSeconds,
            mergeSecondsLimit: 120,
            peakReadBytes: peakRead,
            peakReadLimit: 14000000,
          };
          console.log(`query_history: ${ids.length} history slices handed over ${fmt(totalBytes)} bytes (${pct(totalBytes, maxTotal)}% of ${fmt(maxTotal)}); ${fmt(pairMask.size)} different metric and dimension pairs (${pct(pairMask.size, MAX_HISTORY_PAIRS)}% of ${fmt(MAX_HISTORY_PAIRS)}); ${fmt(lines.length)} lines to ingest (${pct(lines.length, MAX_HISTORY_LINES)}% of ${fmt(MAX_HISTORY_LINES)}); adding up the slices took ${scanSeconds} s (${pct(scanSeconds, 120)}% of the 120 s of a task), the slowest slice ${slowest} s; the largest read of a slice ${(peakRead / 1e6).toFixed(1)} MB of words (${pct(peakRead, 14000000)}% of the 14 MB limit); ${fmt(runs30.length)} metrics with runs in 30 days`);
          return {
            dryRun: DRY_RUN,
            headroom,
            metricsWithRuns: runs30.length,
            dimensionPairs,
            lines: lines.length,
            linesIngested: ingested,
            scanSeconds,
            historySlices: ids.length,
            historyWindows: counted,
            slowestSliceSeconds: slowest,
            seconds: Math.round((Date.now() - t0) / 100) / 10,
            // the 30-day numbers, in the shape classify needs: [key, runs] and [key, runs of queries that name a dimension, the dimensions named]
            runs30,
            spec30,
          };
        }

  read_extensions:
    name: read_extensions
    position:
      x: 2
      y: 3
    description: Each slice reads its share of the installed extensions (screens, topology, essential cloud metrics) and collects, for every billable metric, the apps that show it (Unified analysis)
    action: dynatrace.automations:run-javascript
    withItems: slice in {{ result("plan")["extensionSlices"] }}
    concurrency: 8
    predecessors:
      - plan
      - select_metrics
    input:
      script: |
        // read_extensions: which billable metrics does a Dynatrace app feature? Reads the installed extensions (active version) and collects, for every billable
        // metric key, the apps that show it; the classify task counts them: the "Unified analysis" number of the dashboard (0 = no app, 1 = one app, 2 = two apps, ...).
        // The task is a loop: every slice reads its share of the installed extensions (a name belongs to exactly one slice), about 100 each, three at a time. The plan
        // counted the extensions and refused a tenant with more than 300; 300 extensions in one task took 79 s, in three slices 20 to 40 s each.
        //
        //  - Cloud integrations (an extension with an `aws`, `azure` or `googleCloud` section: da-aws, da-azure, da-gcp): a metric listed in a feature set whose id
        //    ends in `_essential` is shown by the Clouds app ("Recommended ... metrics"), which counts as 1.
        //  - Every other extension: a metric named in the extension's screens, or in its topology (the exact key, or a `$prefix(...)` / `$eq(...)` source condition,
        //    which is expanded to the billable keys) is shown by the app the screens declare (`target.app`). Screens that declare no app (the older format) are shown
        //    by Infrastructure & Operations. An extension whose screens use database entity types (`DB_*`) is also shown by the Databases app.
        //  - One metric counts once per app, however many extensions feature it.
        //  - Not read: dashboards and alert templates shipped in a package (dashboards and anomaly detectors are read by the other tasks), declared metric lists.
        //  - A package that cannot be read stops the slice, and with it the run, and the message says which extension, which part failed (the active version, the download, the unpacking), how many tries, how long, and the platform's own words: a metric that an app shows must never be reported as unused because a read failed.
        import { extensions_2_0Client as extensionsClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, result } from "@dynatrace-sdk/automation-utils";

        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CLOUD_APP = "dynatrace.clouds";
        const DEFAULT_APP = "dynatrace.infraops"; // screens that name no app
        const DATABASE_APP = "dynatrace.database.overview";
        const CLOUD_SECTIONS = ["aws", "azure", "googleCloud"];
        const CONCURRENCY = 3; // packages are read three at a time: the largest one is 22 MB, which is held in memory with its unpacked parts
        const STOP_MS = 100000; // the task may run 120 s; no package is started after this
        const ATTEMPTS = 3;
        // BEGIN classic cloud keys (generated by reference/embed_classic_keys.py from reference/classic_cloud_metrics.json; do not edit by hand)
        // Classic cloud metrics that the cloudservices repo (commit d680577, 2026-11-24) recommends and that no da-* extension declares: the dt.cloud.* keys of recommended
        // built-in services (275) and the Grail keys of recommended ext:cloud.* metrics whose mapping is verified (30). The Clouds app shows them: Unified analysis counts 1.
