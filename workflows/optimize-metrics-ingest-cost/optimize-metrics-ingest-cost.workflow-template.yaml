      script: |
        // Collects the facts and the exact tables for the report email: totals, the three groups, the top metrics to drop and the top
        // dimension candidates. Same classification as the dashboard (it runs the dashboard's table query with all results and sources
        // selected). The two wait tasks before it give the metrics the snapshot task just ingested time to become queryable.
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { execution, result } from "@dynatrace-sdk/automation-utils";

        const TOP_DROP = 10;
        const TOP_DIMS = 3;
        const WINDOW_DAYS = 30;
        const RAW_QUERY = "timeseries from:now()-30d, interval:1d\n, data_points = sum(dt.sfm.metrics.ingest.datapoints, rate:24h)\n, by:{grail.metric.key, grail.metric.type, grail.metric.source}\n, filter:(startswith(grail.metric.key, \"dt.service.\")\n  or startswith(grail.metric.key, \"dt.cloud.aws\")\n  or startswith(grail.metric.key, \"dt.cloud.azure\")\n  or startswith(grail.metric.key, \"dt.osservice.\")\n  or NOT startswith(grail.metric.key, \"dt.\"))\nand not in(grail.metric.key,\n  \"dt.cloud.aws.az.running\",\n  \"dt.cloud.azure.region.vms.initializing\",\n  \"dt.cloud.azure.region.vms.running\",\n  \"dt.cloud.azure.region.vms.stopped\",\n  \"dt.cloud.azure.vm_scale_set.vms.initializing\",\n  \"dt.cloud.azure.vm_scale_set.vms.running\",\n  \"dt.cloud.azure.vm_scale_set.vms.stopped\")\nand isnull(grail.monitoring_source)\nand grail.bucket.name!=\"dt_system_metrics\"\nand grail.metric.key!=\"...\"\nand (\"*\"==\"*\" or dt.cost.costcenter==\"*\")\nand (\"*\"==\"*\" or dt.cost.product==\"*\")\n| fieldsAdd dp = arraySum(data_points) * if(grail.metric.type == \"histogram\" and not startswith(grail.metric.key, \"dt.service.\"), 10, else:1)\n| fieldsAdd metric_key = grail.metric.key, source = coalesce(grail.metric.source, \"Unattributed\")\n| sort dp desc\n| summarize data_points = sum(dp), source = takeFirst(source), by:{metric_key}\n| fieldsAdd parts = splitString(metric_key, \".\")\n| fieldsAdd prefix = if(arraySize(parts) > 1, concat(parts[0], \".\", parts[1]), else:metric_key)\n| fieldsRemove parts\n| fieldsAdd k = 1\n| join [\n    timeseries an = max(`custom.metrics_usage.analysis`), by:{kind}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd last = arrayLast(arrayRemoveNulls(an))\n    | summarize total_metrics = sum(if(kind == \"total_metrics\", last, else:0)), analyzed_metrics = sum(if(kind == \"analyzed_metrics\", last, else:0))\n    | fieldsAdd k = 1\n  ], kind:leftOuter, on:{k}, fields:{total_metrics, analyzed_metrics}\n| join [\n    timeseries am = max(`custom.metrics_usage.analyzed`), by:{metric_key}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd analyzed = 1\n    | fields metric_key, analyzed\n  ], kind:leftOuter, on:{metric_key}, fields:{analyzed}\n| filter coalesce(analyzed_metrics, 0) >= coalesce(total_metrics, 0) or coalesce(analyzed, 0) == 1\n| fieldsRemove analyzed, total_metrics, analyzed_metrics\n| fieldsAdd k = 1\n| join [\n    timeseries from:now()-30d, interval:1d\n    , data_points = sum(dt.sfm.metrics.ingest.datapoints, rate:24h)\n    , by:{grail.metric.key, grail.metric.type, grail.metric.source}\n    , filter:(startswith(grail.metric.key, \"dt.service.\")\n      or startswith(grail.metric.key, \"dt.cloud.aws\")\n      or startswith(grail.metric.key, \"dt.cloud.azure\")\n      or startswith(grail.metric.key, \"dt.osservice.\")\n      or NOT startswith(grail.metric.key, \"dt.\"))\n    and not in(grail.metric.key,\n      \"dt.cloud.aws.az.running\",\n      \"dt.cloud.azure.region.vms.initializing\",\n      \"dt.cloud.azure.region.vms.running\",\n      \"dt.cloud.azure.region.vms.stopped\",\n      \"dt.cloud.azure.vm_scale_set.vms.initializing\",\n      \"dt.cloud.azure.vm_scale_set.vms.running\",\n      \"dt.cloud.azure.vm_scale_set.vms.stopped\")\n    and isnull(grail.monitoring_source)\n    and grail.bucket.name!=\"dt_system_metrics\"\n    and grail.metric.key!=\"...\"\n    and (\"*\"==\"*\" or dt.cost.costcenter==\"*\")\n    and (\"*\"==\"*\" or dt.cost.product==\"*\")\n    | fieldsAdd dp = arraySum(data_points) * if(grail.metric.type == \"histogram\" and not startswith(grail.metric.key, \"dt.service.\"), 10, else:1)\n    | fieldsAdd metric_key = grail.metric.key, source = coalesce(grail.metric.source, \"Unattributed\")\n    | sort dp desc\n    | summarize total = sum(dp)\n    | fieldsAdd k = 1\n  ], kind:leftOuter, on:{k}, fields:{total}\n| join [\n    timeseries a = max(`custom.metrics_usage.artifacts`), by:{metric_key, artifact_type}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd last = arrayLast(arrayRemoveNulls(a))\n    | summarize\n        dashboards = sum(if(artifact_type == \"dashboard\", last, else:0)),\n        notebooks = sum(if(artifact_type == \"notebook\", last, else:0)),\n        workflows = sum(if(artifact_type == \"workflow\", last, else:0)),\n        slos = sum(if(artifact_type == \"slo\", last, else:0)),\n        detectors = sum(if(artifact_type == \"anomaly-detector\", last, else:0)),\n        unified_analysis = sum(if(artifact_type == \"unified-analysis\", last, else:0)),\n      by:{metric_key}\n  ], kind:leftOuter, on:{metric_key}, fields:{dashboards, notebooks, workflows, slos, detectors, unified_analysis}\n| join [\n    timeseries s = max(`custom.metrics_usage.artifact_scope`), by:{metric_key, artifact_type, scope}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd last = arrayLast(arrayRemoveNulls(s))\n    | summarize\n        art_all = sum(if(scope == \"all-series\", last, else:0)),\n        art_specific = sum(if(scope == \"specific-dimensions\", last, else:0)),\n      by:{metric_key}\n  ], kind:leftOuter, on:{metric_key}, fields:{art_all, art_specific}\n| join [\n    timeseries s = max(`custom.metrics_usage.series`), by:{metric_key, kind}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd last = arrayLast(arrayRemoveNulls(s))\n    | summarize\n        series_now = sum(if(kind == \"now\", last, else:0)),\n        series_after = sum(if(kind == \"after\", last, else:0)),\n        series_none = sum(if(kind == \"none\", last, else:0)),\n        series_capped = sum(if(kind == \"capped\", last, else:0)),\n      by:{metric_key}\n  ], kind:leftOuter, on:{metric_key}, fields:{series_now, series_after, series_none, series_capped}\n| join [\n    timeseries r = max(`custom.metrics_usage.query_runs`), by:{metric_key, window_days}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | filter window_days == toString(arrayFirst(array(\"30\")))\n    | fieldsAdd runs = toLong(arrayLast(arrayRemoveNulls(r)))\n    | fields metric_key, runs\n  ], kind:leftOuter, on:{metric_key}, fields:{runs}\n| join [\n    timeseries qd = max(`custom.metrics_usage.query_dimensions`), by:{metric_key, dimension}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | fieldsAdd first_window = toLong(arrayLast(arrayRemoveNulls(qd)))\n    | filter first_window <= toLong(arrayFirst(array(\"30\")))\n    | fieldsAdd dim = dimension, spec = 0.0\n    | fields metric_key, dim, spec\n    | fieldsAdd used_n = 1, card = 0\n    | append [\n        timeseries c = max(`custom.metrics_usage.unused_dimensions`), by:{metric_key, dimension}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n        | fieldsAdd card = toLong(arrayLast(arrayRemoveNulls(c)))\n        | fieldsAdd dim = dimension, used_n = 0, spec = 0.0\n        | fields metric_key, dim, spec, used_n, card\n      ]\n    | append [\n        timeseries ad = max(`custom.metrics_usage.artifact_dimensions`), by:{metric_key, dimension}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n        | fieldsAdd dim = dimension, used_n = 1, spec = 0.0, card = 0\n        | fields metric_key, dim, spec, used_n, card\n      ]\n    | summarize used_n = sum(used_n), spec = sum(spec), card = max(card), by:{metric_key, dim}\n    | fieldsAdd used_item = if(used_n > 0, dim), unused_item = if(used_n == 0, concat(dim, \" (\", toString(card), \")\")), unused_name = if(used_n == 0, dim), inv_item = if(card > 0, 1, else:0)\n    | summarize dims_used = arraySort(arrayRemoveNulls(collectArray(used_item))), dims_unused = arraySort(arrayRemoveNulls(collectArray(unused_item))), names_unused = arraySort(arrayRemoveNulls(collectArray(unused_name))), inv_dims = sum(inv_item), by:{metric_key}\n  ], kind:leftOuter, on:{metric_key}, fields:{dims_used, dims_unused, names_unused, inv_dims}\n| join [\n    timeseries rs = max(`custom.metrics_usage.query_runs_specific`), by:{metric_key, window_days}, from:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) - 1m, to:toTimestamp(if(coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0) > 600, coalesce(toLong(arrayFirst(array(__SNAPSHOT__))), 0), else:600) * 1000000000) + 2m, interval:1m\n    | filter window_days == toString(arrayFirst(array(\"30\")))\n    | fieldsAdd runs_specific = toLong(arrayLast(arrayRemoveNulls(rs)))\n    | fields metric_key, runs_specific\n  ], kind:leftOuter, on:{metric_key}, fields:{runs_specific}\n| fieldsAdd dashboards = coalesce(dashboards, 0), notebooks = coalesce(notebooks, 0), workflows = coalesce(workflows, 0), slos = coalesce(slos, 0), detectors = coalesce(detectors, 0), unified_analysis = coalesce(unified_analysis, 0), runs = coalesce(runs, 0)\n| fieldsAdd art_all = toLong(coalesce(art_all, 0)), art_specific = toLong(coalesce(art_specific, 0))\n| fieldsAdd runs_specific = coalesce(runs_specific, 0)\n| fieldsAdd runs_all = if(runs - runs_specific > 0, runs - runs_specific, else:0)\n| fieldsAdd use_all = runs_all + art_all, use_specific = runs_specific + art_specific\n| fieldsAdd result = if(unified_analysis > 0, \"Used\", else:if(dashboards + notebooks + workflows + slos + detectors > 0 or runs >= 1, if(use_specific > 0 and use_all == 0, \"Unused dimensions\", else:\"Used\"), else:\"Unused\"))\n| fieldsAdd saving_dp = if(result == \"Unused\", toDouble(data_points), else:if(result == \"Unused dimensions\" and coalesce(series_now, 0) > 0, toDouble(data_points) * (series_now - series_after) / series_now))\n| fieldsAdd price = toDouble(\"\")\n| filter isNotNull(result)\n| filter \"*\" == \"*\" or metric_key == \"*\"\n| sort data_points desc\n| fieldsAdd has_use = runs > 0 or art_all + art_specific > 0\n| fieldsAdd dims_text = if(result != \"Unused\" and has_use, if(isNotNull(dims_used) and arraySize(dims_used) > 0, replaceString(replaceString(concat(dims_used), \"[\", \"\"), \"]\", \"\"), else:\"None (all aggregated away)\"), else:\"\")\n| fieldsAdd dims_enc = if(has_use and isNotNull(dims_used) and arraySize(dims_used) > 0, replaceString(replaceString(replaceString(replaceString(dims_text, \" \", \"%20\"), \"(\", \"%28\"), \")\", \"%29\"), \",\", \"%2C\"), else:if(has_use, \"none%20%28all%20aggregated%20away%29\", else:\"unknown%20%28not%20used%20by%20any%20query%20or%20artifact%29\"))\n| fieldsAdd unused_text = if(result == \"Unused dimensions\", if(coalesce(series_now, 0) == 0, if(coalesce(series_capped, 0) > 0, \"Not estimated: too large (many series and dimensions)\", else:if(coalesce(series_none, 0) > 0, \"Not available (no series in the last hour)\", else:\"Not estimated in this run\")), else:if(arraySize(dims_unused) > 0, replaceString(replaceString(concat(dims_unused), \"[\", \"\"), \"]\", \"\"), else:\"None\")), else:\"\u2013\")\n| fieldsAdd saving_dp_text = if(isNotNull(saving_dp), if(result == \"Unused dimensions\" and saving_dp == 0, \"No saving expected\", else:if(saving_dp >= 1000000000, concat(toString(round(saving_dp / 1000000000, decimals:2)), \"B\"), else:if(saving_dp >= 1000000, concat(toString(round(saving_dp / 1000000, decimals:1)), \"M\"), else:if(saving_dp >= 1000, concat(toString(round(saving_dp / 1000, decimals:1)), \"K\"), else:toString(toLong(round(saving_dp))))))), else:if(result == \"Used\", \"\u2013\", else:if(coalesce(series_capped, 0) > 0, \"Not available: too large to estimate\", else:if(coalesce(series_none, 0) > 0, \"Not available: no series in the last hour\", else:\"Not available: not estimated\"))))\n| fieldsAdd saving_usd_text = if(isNull(price), \"\", else:if(isNull(saving_dp), \"\u2013\", else:toString(round(saving_dp / 100000000 * price, decimals:2))))\n| fieldsAdd unused_enc = if(result == \"Unused dimensions\" and coalesce(arraySize(dims_unused), 0) > 0, replaceString(replaceString(replaceString(replaceString(concat(names_unused), \"[\", \"\"), \"]\", \"\"), \" \", \"%20\"), \",\", \"%2C\"), else:\"\")\n| fieldsAdd `AI Optimization guidance` = if(result == \"Unused\", concat(\"[\ud83d\uddd1\ufe0f Drop metric](/ui/intent/dynatrace.davis.copilot/ask-question#%7B%22execute%22%3Atrue%2C%22prompt%22%3A%22Drop%20metric%20\", metric_key, \"%22%7D)\"), else:if(unused_enc != \"\", concat(\"[\u2702\ufe0f Drop unused dimensions](/ui/intent/dynatrace.davis.copilot/ask-question#%7B%22execute%22%3Atrue%2C%22prompt%22%3A%22Drop%20dimensions%20\", unused_enc, \"%20for%20metric%20\", metric_key, \"%22%7D)\"), else:concat(\"[\ud83d\udd0d Analyze cardinality](/ui/intent/dynatrace.davis.copilot/ask-question#%7B%22execute%22%3Atrue%2C%22prompt%22%3A%22Analyze%20cardinality%20for%20\", metric_key, \"%22%7D)\")))\n| fields metric_key, source, data_points, result, saving_dp, series_now, series_after, dims_unused";

        const RAW_LIMIT = 20000; // rows of the table query (one per analysed metric: at most 20,000 by the limit of select_metrics)
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const num = (v) => (v === null || v === undefined || v === "" ? null : Number(v));
        async function retry(fn, attempts = 3) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try { return await fn(); } catch (e) { last = e; await new Promise((r) => setTimeout(r, 500 * (n + 1))); }
          }
          throw last;
        }
        async function dql(query) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: RAW_LIMIT, maxResultBytes: 200000000, fetchTimeoutSeconds: 300, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          });
        }

        const fmtDp = (n) => (n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}K` : String(Math.round(n)));
        const pct = (x) => `${x.toFixed(1)}%`;
        const md = (s) => s.replace(/\|/g, "\\|");

        // ---- metric groups: what drives the saving inside a source
        const MAX_GROUPS = 3; // groups named per source
        const MIN_GROUP_PCT = 0.1; // a group below this share of all data points is not named
        const pct1 = (x, total) => Number(((x / total) * 100).toFixed(1));
        /** The metric group of a key: the first two parts of a key with dots (k8s.replicaset), the part before the first underscore for a key without dots (argocd_*). */
        function metricGroup(key) {
          const p = key.split(".");
          if (p.length > 1) return `${p[0]}.${p[1]}`;
          const i = key.indexOf("_");
          return i > 0 ? `${key.slice(0, i)}_*` : key;
        }
        /** A saving split over the two statuses, in % of all data points. The smaller part is the rest of the rounded whole, so the two parts add up to the figure in front of them. */
        function splitParts(metricsSaving, dimsSaving, total) {
          const whole = pct1(metricsSaving + dimsSaving, total);
          const a = pct1(metricsSaving, total);
          const b = pct1(dimsSaving, total);
          const rest = (x) => Math.max(0, Number((whole - x).toFixed(1)));
          return a >= b ? { metrics: a, dims: rest(a) } : { metrics: rest(b), dims: b };
        }
        /** com.dynatrace.* sources (extensions): their name already says what they are, so they are shown without groups. */
        const isExtension = (source) => source.startsWith("com.dynatrace");
        /** The biggest groups by saving of one source, each with its split. */
        function topGroups(rows, source, total) {
          const g = new Map();
          for (const r of rows) {
            if (r.source !== source || !((r.saving ?? 0) > 0)) continue;
            const k = metricGroup(r.key);
            const e = g.get(k) ?? { m: 0, d: 0 };
            if (r.result === "Unused") e.m += r.saving;
            else e.d += r.saving;
            g.set(k, e);
          }
          return [...g.entries()]
            .sort((a, b) => b[1].m + b[1].d - (a[1].m + a[1].d) || a[0].localeCompare(b[0]))
            .map(([group, e]) => ({ group, pct: pct1(e.m + e.d, total), parts: splitParts(e.m, e.d, total) }))
            .filter((x) => x.pct >= MIN_GROUP_PCT)
            .slice(0, MAX_GROUPS);
        }
        // ---- end of metric groups// ---- end of metric groups

        export default async function () {
          let price = null; // USD per 100,000,000 data points; pass {"price": 150} as workflow input to include USD
          try {
            const ex = await execution();
            const p = Number(ex?.params?.price);
            if (p > 0) price = p;
          } catch { /* no input */ }
          let tenantId = ""; // e.g. abc12345, from the environment URL
          try {
            const env = await import("@dynatrace-sdk/app-environment");
            tenantId = new URL(String(env.getEnvironmentUrl())).hostname.split(".")[0];
          } catch { /* the sentence is written without the tenant */ }
          let coverage = null; // set only when the snapshot task had no time to estimate every metric with unused dimensions
          try {
            const snap = await result("series_estimate");
            if (snap && snap.seriesCoverage && Number(snap.seriesNotEstimated) > 0) coverage = snap.seriesCoverage;
          } catch { /* a full analysis */ }
          let skippedTooLarge = null; // metrics that were too large to read for the estimate of the unused dimensions
          try {
            const snap = await result("series_estimate");
            if (snap && Number(snap.skippedTooLargeCount) > 0) skippedTooLarge = { count: Number(snap.skippedTooLargeCount), keys: arr(snap.skippedTooLarge).slice(0, 3).map((x) => str(x.key)) };
          } catch { /* none */ }
          let unparsedDocuments = 0; // dashboards and notebooks whose stored text could not be parsed: they were read as plain text
          let skippedDocuments = { count: 0, items: [] }; // notebooks that could not be read, also when read alone: skipped, the report says so
          try {
            const cls = await result("classify");
            unparsedDocuments = Number(cls && cls.unparsedDocuments && cls.unparsedDocuments.count) || 0;
            if (cls && cls.skippedDocuments) skippedDocuments = { count: Number(cls.skippedDocuments.count) || 0, items: arr(cls.skippedDocuments.items).slice(0, 10).map((d) => ({ id: str(d.id), name: str(d.name) })) };
          } catch { /* none */ }
          // the metrics that were analysed: the largest by data points (select_metrics); more of them on the tenant than the limit is what the report says
          let analysis = { cut: false, limit: 0, totalMetrics: 0, analyzedMetrics: 0, totalDp: 0, analyzedDp: 0, sharePct: 100 };
          try {
            const sel = await result("select_metrics");
            if (sel && Number(sel.totalMetrics) > 0) analysis = { cut: Boolean(sel.cut), limit: Number(sel.limit) || 0, totalMetrics: Number(sel.totalMetrics), analyzedMetrics: Number(sel.analyzedMetrics), totalDp: Number(sel.totalDp) || 0, analyzedDp: Number(sel.analyzedDp) || 0, sharePct: Number(sel.sharePct) };
          } catch { /* not selected: every metric */ }
          const usdNum = (dp) => (price === null ? null : (dp / 1e8) * price);
          const usdTxt = (dp) => (price === null ? "" : `$${usdNum(dp).toFixed(2)}`);

          // the dashboard reads the newest snapshot through the hidden variable $Snapshot; the report reads the snapshot of this very run (its start time)
          const runSec = Math.round(Number((await result("plan")).startedAtMs) / 1000);
          if (!(runSec > 0)) throw new Error("the plan did not hand over the start time of the run");
          const recs = await dql(RAW_QUERY.replace(/__SNAPSHOT__/g, String(runSec)));
          // the table has one row per analysed metric: a result that reaches the limit of the query may be cut off, and totals from a part of the metrics would be wrong
          if (recs.length >= RAW_LIMIT) throw new Error(`the metrics query reached its limit of ${RAW_LIMIT} rows and may be cut off, so the totals of the report would be wrong. Send this message to the workflow owner.`);
          const rows = recs.map((r) => ({
            key: str(r.metric_key),
            source: str(r.source) || "Unattributed",
            dp: num(r.data_points) ?? 0,
            result: str(r.result),
            saving: num(r.saving_dp),
            now: num(r.series_now),
            after: num(r.series_after),
          }));
          if (!rows.length) throw new Error("the metrics query returned no rows");
          // the percentages are always relative to ALL data points of the tenant: when the tenant has more metrics than were analysed, the rows hold only the analysed ones
          const rowsDp = rows.reduce((s, r) => s + r.dp, 0);
          const total = analysis.cut && analysis.totalDp > 0 ? analysis.totalDp : rowsDp;

          const group = (name) => {
            const g = rows.filter((r) => r.result === name);
            return { name, metrics: g.length, dp: g.reduce((s, r) => s + r.dp, 0), saving: g.reduce((s, r) => s + (r.saving ?? 0), 0) };
          };
          const used = group("Used");
          const dims = group("Unused dimensions");
          const drop = group("Unused");
          const savingAll = dims.saving + drop.saving;

          const bySource = new Map();
          for (const r of rows) {
            const s = bySource.get(r.source) ?? { source: r.source, saving: 0, m: 0, d: 0 };
            s.saving += r.saving ?? 0;
            if (r.result === "Unused") s.m += r.saving ?? 0;
            else s.d += r.saving ?? 0;
            bySource.set(r.source, s);
          }
          const topSources = [...bySource.values()].filter((s) => s.saving > 0).sort((a, b) => b.saving - a.saving).slice(0, 3);

          const dropRows = rows.filter((r) => r.result === "Unused").sort((a, b) => b.dp - a.dp);
          const topDrop = dropRows.slice(0, TOP_DROP);
          const topDropDp = topDrop.reduce((s, r) => s + r.dp, 0);
          const dimRows = rows.filter((r) => r.result === "Unused dimensions");
          const withSaving = dimRows.filter((r) => (r.saving ?? 0) > 0).sort((a, b) => (b.saving ?? 0) - (a.saving ?? 0));
          const zeroSaving = dimRows.filter((r) => r.saving !== null && r.saving <= 0).length;
          const topDims = withSaving.slice(0, TOP_DIMS);

          const usdCell = (dp) => (price === null ? "" : ` (${usdTxt(dp)}/mo)`);
          // partial analysis only: one more column (metrics analyzed) and "at least" on the savings that are not complete
          const part = coverage !== null;
          const atLeast = part || analysis.cut ? "at least " : "";
          const summaryTable = [
            `| | What it means | Metrics |${part ? " Metrics analyzed |" : ""} Data points | You can save |`,
            `|---|---|---:|${part ? "---:|" : ""}---:|---:|`,
            `| 🟢 **Used** | Used by unified analysis, dashboard, notebook, workflow, SLO, alert or query. Keep. | ${used.metrics} |${part ? ` ${used.metrics} |` : ""} ${fmtDp(used.dp)} | – |`,
            `| 🟠 **Unused dimensions** | Used, but only with some of their dimensions. The others are never queried. | ${dims.metrics} |${part ? ` **${coverage.analysed}** |` : ""} ${fmtDp(dims.dp)} | **${atLeast}~${pct((dims.saving / total) * 100)}** (estimate)${usdCell(dims.saving)} |`,
            `| 🔴 **Unused** | Not used anywhere: no unified analysis, dashboard, notebook, workflow, SLO or alert, and no query in the last ${WINDOW_DAYS} days. | ${drop.metrics} |${part ? ` ${drop.metrics} |` : ""} ${fmtDp(drop.dp)} | **${pct((drop.saving / total) * 100)}**${usdCell(drop.saving)} |`,
            `| **Total** | | **${rows.length}** |${part ? "  |" : ""} **${fmtDp(rowsDp)}** | **${atLeast}${pct((savingAll / total) * 100)}**${usdCell(savingAll)} |`,
          ].join("\n");
          const dropTable = [
            "| # | Metric | Source | Data points |",
            "|--:|---|---|---:|",
            ...topDrop.map((r, i) => `| ${i + 1} | ${md(r.key)} | ${md(r.source)} | ${fmtDp(r.dp)} |`),
          ].join("\n");
          const dimTable = topDims.length
            ? [
                "| Metric | Series now → after | You save |",
                "|---|---:|---:|",
                ...topDims.map((r) => `| ${md(r.key)} | ${r.now} → ${r.after} | ${fmtDp(r.saving)} (${Math.round((r.saving / r.dp) * 100)}%) |`),
              ].join("\n")
            : "";

          const facts = {
            windowDays: WINDOW_DAYS,
            tenantId,
            totalMetrics: analysis.cut ? analysis.totalMetrics : rows.length,
            analysedMetrics: rows.length,
            analysedShareOfDataPointsPct: analysis.cut ? Number(analysis.sharePct.toFixed(2)) : 100,
            totalDataPoints: Math.round(total),
            potentialSavingsPct: Number(((savingAll / total) * 100).toFixed(1)),
            unusedMetrics: { count: drop.metrics, savingsPct: Number(((drop.saving / total) * 100).toFixed(1)), top10SavingsPct: Number(((topDropDp / total) * 100).toFixed(1)) },
            unusedDimensions: { metrics: dims.metrics, estimatedSavingsPct: Number(((dims.saving / total) * 100).toFixed(1)), metricsWithEstimatedSaving: withSaving.length, metricsWithZeroSavingBecauseCorrelated: zeroSaving },
            usedMetrics: used.metrics,
            biggestSources: topSources.map((s) => ({ source: s.source, savingsPctOfAllDataPoints: Number(((s.saving / total) * 100).toFixed(1)) })),
            monthlySavingsUSD: price === null ? null : Number(usdNum(savingAll).toFixed(2)),
          };
          return {
            factsJson: JSON.stringify(facts),
            summaryTable,
            dropTable,
            dimTable,
            nums: {
              tenantId,
              partial: part,
              coverage,
              unparsedDocuments,
              skippedDocuments,
              skippedTooLarge,
              analysis,
              total: Math.round(total),
              savingAll: Math.round(savingAll),
              savingAllPct: Number(((savingAll / total) * 100).toFixed(1)),
              dropPct: Number(((drop.saving / total) * 100).toFixed(1)),
              dimPct: Number(((dims.saving / total) * 100).toFixed(1)),
              top10Pct: Number(((topDropDp / total) * 100).toFixed(1)),
              dropCount: drop.metrics,
              dimMetrics: dims.metrics,
              withSaving: withSaving.length,
              zeroSaving,
              usedMetrics: used.metrics,
              monthlyUSD: price === null ? null : Number(usdNum(savingAll).toFixed(2)),
              sources: topSources.map((s) => ({ source: s.source, pct: pct1(s.saving, total), parts: isExtension(s.source) ? splitParts(s.m, s.d, total) : undefined, groups: isExtension(s.source) ? [] : topGroups(rows, s.source, total) })),
              totalFmt: fmtDp(total),
              savingFmt: fmtDp(savingAll),
            },
          };
        }

  ai_report:
    name: ai_report
    position:
      x: 1
      y: 9
    description: Dynatrace Intelligence writes the narrative and the guidance from the facts
    action: dynatrace.davis.workflow.actions:prompt-generative-ai
    predecessors:
      - report_data
    retry:
      count: 2
      delay: 30
    input:
      autoTrim: true
      config: disabled
      instruction: ""
      prompt: |-
        Provide a markdown report for:
        ## SUMMARY
        Write exactly the following text, replacing the placeholders with values from the supplied data. Keep the blank lines and the two bullet points. The list of the sources is added by the workflow: do not write it. Only fix grammar if needed; do not add or remove any information, and do not add any other sentence. If tenantId is empty, leave out "on tenant ...". Use markdown bold for every percentage.

        "You can reduce metrics ingest cost on tenant {tenantId} by {potentialSavingsPct}%.

        - Quick win ({unusedMetrics.savingsPct}%): Consider dropping {unusedMetrics.count} unused metrics.
        - Further savings ({unusedDimensions.estimatedSavingsPct}%): Consider removing unused dimensions from {unusedDimensions.metrics} metrics."
        ## WHY CAREFUL
        Exactly three one-sentence bullet points (at most 25 words each) explaining why dropping unused dimensions needs care: (1) dropping a dimension merges series so averages and counts can change; (2) many unused dimensions always accompany a used one, so dropping them saves nothing, and metricsWithZeroSavingBecauseCorrelated of unusedDimensions.metrics metrics have an estimated saving of zero; (3) usage outside Dynatrace is invisible to us and the saving is estimated from the last hour.
        Note: use only the numbers in the supplied data and write nothing besides these two sections.
      supplementary: |-
        {{ result("report_data")["factsJson"] }}
  compose_report:
    name: compose_report
    position:
      x: 0
      y: 10
    description: Combine the narrative with the exact tables into the email body
    action: dynatrace.automations:run-javascript
    conditions:
      states:
        report_data: OK
        ai_report: ANY
        create_dashboard: ANY
    predecessors:
      - report_data
      - ai_report
      - create_dashboard
    input:
      script: |
        // Builds the email: headline first, short summary, one table, then the two actions. The AI writes only the summary and the
        // "why careful" bullets; every number and table is computed. If the AI step did not run, fixed template text is used instead.
        import { result } from "@dynatrace-sdk/automation-utils";

        const str = (v) => (typeof v === "string" ? v : "");

        // ---- summary
        /** A readable source name for the list: OpenTelemetry, SNMP Generic Juniper; any other source keeps its name. */
        function readableSource(name) {
          if (name === "opentelemetry") return "OpenTelemetry";
          const ext = "com.dynatrace.extension.";
          if (!name.startsWith(ext)) return name;
          return name.slice(ext.length).split("-").map((w) => (w === "snmp" ? "SNMP" : w.charAt(0).toUpperCase() + w.slice(1))).join(" ");
        }

        /** One decimal, and no decimal at all when it would be ".0": 14.2 stays, 14.0 becomes 14. */
        const one = (x) => {
          const s = x.toFixed(1);
          return s.endsWith(".0") ? s.slice(0, -2) : s;
        };

        /** The status words of a saving: both parts with their share, the bigger first; one part alone is only named; a part below 0.1% is left out. */
        function statusText(p) {
          const parts = [["unused metrics", p.metrics], ["unused dimensions", p.dims]].filter(([, v]) => v >= 0.1).sort((a, b) => b[1] - a[1]);
          if (parts.length > 1) return parts.map(([name, v]) => `**${one(v)}%** ${name}`).join(", ");
          return parts.length ? parts[0][0] : "";
        }

        /** One bullet per source. Extensions (com.dynatrace.*) carry their status words; every other source names its biggest metric groups, each with its status words. */
        function sourceList(n) {
          return n.sources
            .map((s) => {
              const head = `- ${readableSource(s.source)} (**${one(s.pct)}%**)`;
              if (s.parts) {
                const t = statusText(s.parts);
                return t ? `${head}: ${t}` : head;
              }
              const groups = s.groups || [];
              if (!groups.length) return head;
              const lines = groups.map((g) => {
                const t = statusText(g.parts);
                return `  - ${g.group.replace(/\*/g, "\\*")} (**${one(g.pct)}%**)${t ? `: ${t}` : ""}`; // the asterisk is escaped so that markdown shows it
              });
              return [`${head}, mainly:`, ...lines].join("\n");
            })
            .join("\n");
        }

        /** The headline and the two bullets: the part of the summary the AI writes. */
        function summaryHead(n) {
          const where = n.tenantId ? ` on tenant ${n.tenantId}` : "";
          return `You can reduce metrics ingest cost${where} by **${n.savingAllPct}%**.

        - **Quick win (${n.dropPct}%):** Consider dropping ${n.dropCount} unused metrics.
        - **Further savings (${n.dimPct}%):** Consider removing unused dimensions from ${n.dimMetrics} metrics.`;
        }

        /** The section of the sources is computed, never written by the AI: it stands below the table of the three categories. */
        function sourcesSection(n) {
          const list = sourceList(n);
          return list ? `Most of the savings come from these sources:\n\n${list}` : "";
        }

        /** Whatever the AI may have written about the sources is cut off; the computed section below the table replaces it. */
        const cutSources = (text) => {
          const i = text.search(/Most of the savings come from/i);
          return (i >= 0 ? text.slice(0, i) : text).trimEnd();
        };

        /** The standard wording of the summary, used when the AI text is missing or does not carry the computed numbers. */
        function summaryTemplate(n) {
          return summaryHead(n);
        }

        /** The AI summary is used only if it carries every computed number (and the tenant). */
        function summaryIsValid(text, n) {
          const expected = [n.savingAllPct, n.dropCount, n.dropPct, n.dimMetrics, n.dimPct].map(String);
          if (n.tenantId) expected.push(n.tenantId);
          return text.includes("Quick win") && text.includes("Further savings") && expected.every((x) => text.includes(x));
        }
        // ---- end of summary

        function templateText(n) {
          return {
            SUMMARY: summaryTemplate(n),
            "WHY CAREFUL": [
              "- Dropping a dimension merges series, so averages and counts can change, even in queries that aggregate over everything.",
              `- **About half of the candidates save nothing** (${n.zeroSaving} of ${n.dimMetrics}): their unused dimensions always travel with a used one, such as a name next to an ID.`,
              "- Usage outside Dynatrace is invisible to us, and the saving is estimated from the last hour.",
            ].join("\n"),
          };
        }

        export default async function () {
          const data = await result("report_data");
          const n = data.nums;
          let text = "";
          let aiNote = "";
          try {
            const ai = await result("ai_report");
            text = str(ai && ai.text);
          } catch (e) {
            aiNote = String(e && e.message ? e.message : e);
          }
          const parts = { SUMMARY: "", "WHY CAREFUL": "" };
          const marks = [...text.matchAll(/^#{1,3}\s*(SUMMARY|WHY CAREFUL)\s*$/gim)];
          marks.forEach((m, i) => {
            parts[m[1].toUpperCase()] = text.slice(m.index + m[0].length, i + 1 < marks.length ? marks[i + 1].index : undefined).trim();
          });
          let aiUsed = Boolean(parts.SUMMARY && parts["WHY CAREFUL"]);
          if (!aiUsed) Object.assign(parts, templateText(n));
          let summaryFromTemplate = !aiUsed;
          if (aiUsed && !summaryIsValid(parts.SUMMARY, n)) {
            parts.SUMMARY = summaryTemplate(n);
            summaryFromTemplate = true;
          } else if (aiUsed) {
            parts.SUMMARY = cutSources(parts.SUMMARY);
          }
          const sources = sourcesSection(n);

          // Partial analysis (very large tenants only): the dimension saving covers the largest metrics that fit in the time, so the
          // savings that depend on it read "at least".
          const partial = Boolean(n.partial && n.coverage);
          // the tenant has more metrics than the run analyses: only the largest ones (by data points) were, and the email says how many and how much of the data points they hold
          const an = n.analysis && n.analysis.cut ? n.analysis : null;
          const pctText = (x) => (Number.isFinite(x) ? x : 100).toFixed(2);
          const analysisNote = an
            ? `**Only the ${an.analyzedMetrics.toLocaleString("en-US")} largest metrics were analysed** (this tenant has ${an.totalMetrics.toLocaleString("en-US")}). Together they account for **${pctText(an.sharePct)}%** of all metric data points. The other ${(an.totalMetrics - an.analyzedMetrics).toLocaleString("en-US")} smaller metrics were not analysed, so the real saving can be higher.`
            : "";
          const lowerBound = partial || Boolean(an);
          const coverage = partial && n.coverage.analysed === 0
            ? `The dimension analysis could not be completed in this run, so the saving from unused dimensions is not included and the real saving can be higher.`
            : partial
            ? `This tenant is too large to analyse every metric in one run. ${n.dimMetrics} metrics have unused dimensions. The saving was estimated for the largest ${n.coverage.analysed} of them, which hold ${n.coverage.pct}% of the data points of these metrics. The other ${Math.max(n.dimMetrics - n.coverage.analysed, 0)} are not included, so the real saving can be higher.`
            : "";
          // dashboards and notebooks whose stored text could not be parsed (empty, cut off or damaged) were read as plain text: every metric they name counts as used
          // notebooks that could not be read, also when read alone: the run went on without them (italic note below). Their names are cleaned of the characters that mark italics.
          const sk = n.skippedDocuments && Number(n.skippedDocuments.count) > 0 ? n.skippedDocuments : null;
          const plain = (s) => String(s || "").replace(/[*_`\\\[\]]/g, " ").replace(/\s+/g, " ").trim();
          const skippedNote = sk
            ? `${sk.count} notebook${sk.count === 1 ? " was" : "s were"} skipped because ${sk.count === 1 ? "it" : "they"} could not be read (the task that reads ${sk.count === 1 ? "it" : "them"} failed or ran out of memory): ${sk.items.map((d) => `"${plain(d.name) || "unnamed"}" (${d.id})`).join(", ")}${sk.count > sk.items.length ? ", ..." : ""}. Metrics that only ${sk.count === 1 ? "this notebook uses" : "these notebooks use"} can appear as unused in this report: check ${sk.count === 1 ? "it" : "them"} before you drop a metric.`
            : "";
          const unparsedNote = Number(n.unparsedDocuments) > 0
            ? `${n.unparsedDocuments} dashboard${n.unparsedDocuments === 1 ? "" : "s"} or notebook${n.unparsedDocuments === 1 ? "" : "s"} could not be parsed (their stored content is empty, cut off or damaged). ${n.unparsedDocuments === 1 ? "It was" : "They were"} read as plain text instead, so every metric ${n.unparsedDocuments === 1 ? "it names" : "they name"} counts as used. The log of the step read_artifacts lists ${n.unparsedDocuments === 1 ? "it" : "them"} by name.`
            : "";
          // metrics with so many series and dimensions that reading them would not fit into the memory of a task: not estimated, and said so
          const tooLarge = n.skippedTooLarge && n.skippedTooLarge.count > 0
            ? `${n.skippedTooLarge.count} metric${n.skippedTooLarge.count === 1 ? " has" : "s have"} too many series and dimensions to be estimated in one run (${n.skippedTooLarge.keys.join(", ")}${n.skippedTooLarge.count > n.skippedTooLarge.keys.length ? ", ..." : ""}). The saving from their unused dimensions is not included, so the real saving can be higher.`
            : "";
          if (lowerBound) {
            parts.SUMMARY = parts.SUMMARY.replace(`by **${n.savingAllPct}%**`, `by **at least ${n.savingAllPct}%**`).replace(/(Further savings \()(\*\*)?(\d+(?:\.\d+)?%)/, "$1at least $2$3");
          }

          let dashboard = "";
          try {
            const d = await result("create_dashboard");
            let base = "";
            try {
              const env = await import("@dynatrace-sdk/app-environment");
              base = String(env.getEnvironmentUrl()).replace(/\/$/, "");
            } catch { /* fall back to the relative path */ }
            dashboard = d && d.path ? `${base}${d.path}` : "";
          } catch { /* the link is optional */ }

          const headlinePct = Math.round(n.savingAllPct);
          const money = n.monthlyUSD === null ? "" : ` *(About $${n.monthlyUSD.toFixed(2)} per month at your contracted price.)*`;
          const atLeast = lowerBound ? "at least " : "";
          const body = `# You can reduce metrics ingest cost by ${atLeast}${headlinePct}%

        ${parts.SUMMARY}${analysisNote ? `\n\n${analysisNote}` : ""}${money ? `\n\n${money.trim()}` : ""}

        Your metrics fall into three categories, based on how they are used:

        ${data.summaryTable}
        ${sources ? `\n${sources}\n` : ""}${dashboard ? `\n**[Open the dashboard →](${dashboard})** for the full list, filters and one-click Assist actions.\n` : ""}
        ## 1. Consider dropping unused metrics. Start here (${n.dropPct}%)
        1. Check with the source owners that nothing outside Dynatrace reads them.
        2. To act on one, ask Dynatrace Assist: **"Drop metric \`<key>\`"** (there is a button per metric in the dashboard).
        3. Consider these 10 first: dropping them alone would save about ${n.top10Pct}% of all data points:

        ${data.dropTable}

        ## 2. Then consider removing unused dimensions. Go carefully (about ${n.dimPct}%)
        ⚠️ **Why careful:**
        ${parts["WHY CAREFUL"]}

        **How:** take one metric at a time. Ask Assist **"Analyze cardinality for \`<key>\`"**, then consider dropping only the dimensions that are confirmed unused.${data.dimTable ? " Start with the largest:\n\n" + data.dimTable : ""}

        _Estimates from the last 30 days.${aiUsed ? "" : ` The summary text comes from a template because the AI step did not run${aiNote ? ` (${aiNote})` : ""}.`}_${coverage ? `\n\n*${coverage}*` : ""}${skippedNote ? `\n\n*${skippedNote}*` : ""}${unparsedNote ? `\n\n*${unparsedNote}*` : ""}${tooLarge ? `\n\n*${tooLarge}*` : ""}
        `;
          return { aiUsed, summaryFromTemplate, subject: `You can reduce metrics ingest cost by ${atLeast}${headlinePct}%`, markdown: body, dashboard };
        }

  read_permissions_error:
    name: read_permissions_error
    position:
      x: -1
      y: 7
    description: Reads the error text of the failed permission check, so that the email can carry it
    action: dynatrace.automations:run-javascript
    conditions:
      states:
        check_permissions: ERROR
    predecessors:
      - check_permissions
    input:
      script: |
        // Reads the error text of a failed step, so that the failure email can carry it (an email cannot read the error of a task itself).
        // It never fails: if the text cannot be read, the email points to the log of the step.
        import { execution } from "@dynatrace-sdk/automation-utils";
        import { executionsClient } from "@dynatrace-sdk/client-automation";

        const clean = (raw) =>
          String(raw || "")
            .replace(/^(Uncaught( \(in promise\))? )?Error: /, "")
            .split("\n")
            .filter((line) => !/^\s+at\s.+(\)|:\d+:\d+)\s*$/.test(line)) // the stack of the script: not for people
            .join("\n")
            .replace(/\n+An error of type \w+ occurred in an imported library:[\s\S]*$/, "") // the same message once more
            .trim();

        export default async function () {
          const STAGE = "check_permissions";
          let text = "";
          try {
            const run = await execution();
            const tasks = await executionsClient.getTaskExecutions({ executionId: run.id });
            text = clean(tasks && tasks[STAGE] && tasks[STAGE].stateInfo);
          } catch {
            /* the error of the step is in the log of that step */
          }
          return { text: text || `The step ${STAGE} failed. Open the log of that step in the Workflows app to see the error.` };
        }
  notify_failure_check_permissions:
    name: notify_failure_check_permissions
    position:
      x: -1
      y: 8
    description: Tell the recipient that the run was stopped because permissions are missing (the error text of the check is in the email)
    action: dynatrace.email:send-email
    predecessors:
      - read_permissions_error
    input:
      to:
        - '{{ input()["emails"]["to"] }}'
      cc: []
      bcc: []
      subject: 'The metrics optimization report was not produced: permissions are missing'
      content: |-
        The metrics optimization workflow stopped before analysing anything, because the user it runs as lacks one or more of the permissions it needs.

        {{ result("read_permissions_error")["text"] }}

        Grant the permissions and run the workflow again. The same text is in the error of the task check_permissions in this execution: {{ execution().id }}
  fail_check_permissions:
    name: fail_check_permissions
    position:
      x: -1
      y: 9
    description: Ends the run in error after the failure email of check_permissions (without it the execution would read Success)
    action: dynatrace.automations:run-javascript
    conditions:
      states:
        notify_failure_check_permissions: ANY
    predecessors:
      - notify_failure_check_permissions
    input:
      script: |
        // Closes a run that failed in a step the recipients were told about by email: the email handles the error, so without this task the execution would
        // end as "Success" although nothing was analysed. This task fails on purpose, with the error text of the failed step, so that the execution reads Error
        // and the message of the run says what went wrong. It runs even if the email could not be sent.
        import { execution } from "@dynatrace-sdk/automation-utils";
        import { executionsClient } from "@dynatrace-sdk/client-automation";

        const clean = (raw) =>
          String(raw || "")
            .replace(/^(Uncaught( \(in promise\))? )?Error: /, "")
            .split("\n")
            .filter((line) => !/^\s+at\s.+(\)|:\d+:\d+)\s*$/.test(line)) // the stack of the script: not for people
            .join("\n")
            .replace(/\n+An error of type \w+ occurred in an imported library:[\s\S]*$/, "") // the same message once more
            .trim();

        export default async function () {
          const STAGE = "check_permissions";
          const PLAIN = true;
          let reason = "";
          try {
            const run = await execution();
            const tasks = await executionsClient.getTaskExecutions({ executionId: run.id });
            reason = clean(tasks && tasks[STAGE] && tasks[STAGE].stateInfo);
          } catch {
            /* the error of the step is in the log of that step */
          }
          // the permission check: the message is the error text itself, as it was shown before the failure email existed
          if (PLAIN && reason) throw new Error(reason);
