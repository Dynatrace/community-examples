metadata:
  trackingId: optimize-metrics-ingest-cost
title: Optimize metrics ingest cost
description: Finds billable metrics and metric dimensions that no dashboard, notebook, workflow, SLO, anomaly detector, app view or executed query uses, and estimates the saving from dropping them. Creates the dashboard Metrics optimization candidates and emails an AI-written report.
type: STANDARD
isPrivate: true
isDeployed: true
schemaVersion: 4
triggerType: Manual
hourlyExecutionLimit: 10
input:
  emails:
    to:
      - your.email@example.com
  maxMetrics: 10000
  historyDays: 30
guide: |-
  # Setup
  1. Go to the [Workflow input](?options=) and scroll down to `Workflow input and result`.
  2. Change `emails.to` to the addresses that should get the report, as an array of strings, for example:
     ```
     "to": [ "me@email.com", "you@email.com"]
     ```
     The same addresses also get the message that says why a run produced no report.
     The input `maxMetrics` (default and recommended maximum 10,000, so don't set a higher value; it accepts 100 to 20,000, and a value outside that range is replaced by the nearest limit) is the number of metrics the run analyses: the largest ones by data points. A tenant with more billable metrics than that is analysed on its largest ones; the report and the dashboard then say so and give the share of all metric data points that the analysed metrics hold. The metrics that are left out are the smallest ones and are never recommended for dropping.
     The input `historyDays` (30 by default, or 60 or 90) is the number of days of executed queries that count as use of a metric. A metric that no query used in that time is reported as unused by queries, so a longer window is more careful but a longer and larger run: on the largest customer tenant the older days were about ten times as large as the recent ones. The dashboard offers only the windows that were counted. Any other value is replaced by 30, with a line in the log of the step plan.
  3. Allow the permissions the workflow needs. In the Workflows app, open Settings, then Authorization settings, and enable the permissions below. The workflow can only use what the user who runs it has, so that user needs them too.
     - Read every user's dashboards, notebooks and workflows: `document:documents:read`, `document:documents:admin`, `automation:workflows:read`, `automation:workflows:admin`
     - Read SLOs and anomaly detectors: `slo:slos:read`, `environment-api:slo:read` (classic SLOs), `settings:objects:read`
     - Read the installed extensions (to see which metrics an app shows): `environment-api:extensions:read`
     - Run the queries: `storage:metrics:read`, `storage:system:read`, `storage:buckets:read`
     - Write the usage metrics and the dashboard: `storage:metrics:write` (or `openpipeline:metrics:ingest`), `document:documents:write`
     - Send the report and the failure messages: `email:emails:send`
     - Write the AI summary: `davis-copilot:conversations:execute`
     - Run the workflow: `app-engine:functions:run`, `automation:workflows:run`

     What a missing permission does: the first task checks every permission above except `email:emails:send` and `davis-copilot:conversations:execute`, which cannot be tested without sending an email or running the AI step. If one is missing, the run fails with an error that lists the missing permissions, and an email with the same text is sent (the error is also in the Workflows app, on the failed `check_permissions` task); nothing is analysed. Without `email:emails:send` no email can be sent at all, so look at the run in the Workflows app. Without the AI permission the report is still sent, with a template summary instead of the AI text. For any other missing permission, the step that needs it fails and the run stops.
  4. Test with a manual run by clicking the `Run` button. A run takes about 5 minutes on a tenant with 1,200 metrics (a larger tenant takes longer) and costs about $0.33 to $0.43; the Davis AI summary is about $0.30 of it. The workflow reads every artifact. A slice that cannot be read is read again in smaller pieces, and a notebook that cannot be read, also when read alone, is skipped and named in an italic note of the report: a metric that only that notebook uses can then look unused, so check the notebook before you drop a metric.
  5. If everything works as expected, open the dashboard that the email links to.

  # Use the results
  The first run creates the dashboard "Metrics optimization candidates". Later runs keep it and bring it up to date. Use the filters (Metric status, Metric source, Metric prefix (a text field: the metrics whose prefix starts with what you type), Cost center, Cost product, Metric key, Executed queries window) to find the metrics worth acting on. Data points are from the last 30 days, and the timestamp tile shows the run whose data you see. The last column of the table has links that ask Davis AI to drop an unused metric or unused dimensions, or to analyse cardinality. The column Unified analysis counts the apps that show the metric (the screens and topology of the installed extensions, and the essential metrics of the Clouds app). A metric with 1 or more is always Used, because the apps use dimensions that cannot be seen. Review before you apply any change to your tenant. Every run writes the custom metrics `custom.metrics_usage.*` (about 13,000 lines on a tenant with 1,200 metrics).

  # Run it regularly (optional)
  The workflow has a manual trigger on purpose. If you want a schedule, change the [Trigger](?trigger=) to a monthly schedule at an off-peak time of your choosing.
tasks:
  check_permissions:
    name: check_permissions
    position:
      x: 0
      y: 1
    description: Check every permission the workflow needs (IAM and Authorization settings), including admin access to every user's artifacts; the run stops here if any is missing
    action: dynatrace.automations:run-javascript
    input:
      script: |
        // Permission check: the first task of the workflow. Every permission the workflow needs is tried once with the smallest possible call, all at the
        // same time, and the run stops here if any of them is missing: a run that cannot finish would only spend minutes and money first.
        // The calls are made with the token the workflow itself uses, so they test what is granted in IAM AND enabled in the Workflows app (Authorization settings).
        //  - Reads: one small read per permission (a page of one).
        //  - Admin reads: the workflow has to read every user's artifacts, private ones included. The service rejects an admin request from an identity
        //    without the permission (HTTP 403), so one small admin request per kind is the check. Without admin access the workflow would only see what
        //    its user owns or what is shared with them, and would report metrics as unused that are used on other users' private dashboards and notebooks.
        //  - Writes: tested without writing anything. A metric line that is not valid is answered 400 when the permission is there (403 when it is not), and
        //    so is a document without a name. If a document is created anyway, it is deleted again.
        //  - Not tested: email:emails:send and davis-copilot:conversations:execute. Neither can be tested from a script without sending an email or running the AI step.
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { actionExecution } from "@dynatrace-sdk/automation-utils";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";

        const NOT_CHECKED = ["email:emails:send", "davis-copilot:conversations:execute"];
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";

        const message = (e) => String(e && e.message ? e.message : e);
        const statusOf = (e) => Number(e?.response?.status ?? e?.status ?? e?.statusCode);
        const refused = (e) => {
          const status = statusOf(e);
          return status === 401 || status === 403 || /\b40[13]\b|forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(message(e));
        };
        /** The platform names the missing scopes in its message: "OAuth token is missing required scope. Use one of: [scope, scope]". */
        const named = (e) => {
          const m = /use one of:\s*\[([^\]]+)\]/i.exec(message(e));
          return m ? m[1].split(",").map((x) => x.trim()).filter(Boolean) : [];
        };
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        /**
         * One check. `call` returns (granted) or throws. `accept(e)` turns an error into a pass (a write test is answered 400 when the permission is there).
         * A refusal is not retried; anything else (a throttled or failing service) is tried 3 times, then the permission is reported as not checkable.
         */
        async function check(name, permissions, call, { accept, after } = {}) {
          let last;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              return { name, permissions, after, state: "granted", value: await call() };
            } catch (e) {
              if (accept && accept(e)) return { name, permissions, after, state: "granted" };
              if (refused(e)) return { name, permissions, after, state: "missing", scopes: named(e), detail: message(e) };
              last = e;
              await sleep(1000 * (attempt + 1));
            }
          }
          return { name, permissions, after, state: "unchecked", detail: message(last) };
        }

        /** A DQL query of one record at most. */
        const dqlOne = (query) => async () => {
          const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: 1, fetchTimeoutSeconds: 30, enablePreview: false } });
          let state = start.state;
          while (state !== "SUCCEEDED") {
            if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
            if (!start.requestToken) throw new Error("query returned no request token");
            const poll = await queryExecutionClient.queryPoll({ requestToken: start.requestToken, requestTimeoutMilliseconds: 20000 });
            state = poll.state;
          }
          return true;
        };

        /** The classic SLO API: not available on this environment (404) = no classic SLOs to read, which is no failure. */
        const classicCall = async () => {
          try {
            const r = await classicSloClient.getSlo({ pageSize: 1, evaluate: "false", enabledSlos: "all", showGlobalSlos: true });
            return { available: true, total: Number(r.totalCount) || 0 };
          } catch (e) {
            if (statusOf(e) === 404 || /not available for this environment/i.test(message(e))) return { available: false };
            throw e;
          }
        };

        /** A document without a name is refused with 400 when the permission is there. If it is created anyway, it is deleted again. */
        const documentWriteCall = async () => {
          const created = await documentsClient.createDocument({ body: { name: "", type: "dashboard", content: new Blob(["{}"], { type: "application/json" }) } });
          try {
            const meta = await documentsClient.getDocumentMetadata({ id: created.id });
            await documentsClient.deleteDocument({ id: created.id, optimisticLockingVersion: meta.version });
          } catch { /* the check passed; a leftover of an empty document is harmless */ }
          return true;
        };

        export default async function () {
          const is400 = (e) => statusOf(e) === 400;
          const results = await Promise.all([
            check("dashboards (own and shared)", ["document:documents:read"], () => documentsClient.listDocuments({ filter: "type == 'dashboard'", pageSize: 1 })),
            check("dashboards (admin list)", ["document:documents:admin"], () => documentsClient.listDocuments({ filter: "type == 'dashboard'", pageSize: 1, adminAccess: true }), { after: "dashboards (own and shared)" }),
            check("notebooks (admin list)", ["document:documents:admin"], () => documentsClient.listDocuments({ filter: "type == 'notebook'", pageSize: 1, adminAccess: true }), { after: "dashboards (own and shared)" }),
            check("workflows (own and shared)", ["automation:workflows:read"], () => workflowsClient.getWorkflows({ limit: 1 })),
            check("workflows (admin list)", ["automation:workflows:admin"], () => workflowsClient.getWorkflows({ limit: 1, adminAccess: true }), { after: "workflows (own and shared)" }),
            check("results of earlier steps", ["automation:workflows:read"], () => actionExecution()),
            check("platform SLOs", ["slo:slos:read"], () => serviceLevelObjectivesClient.getSlos({ pageSize: 1 })),
            check("classic SLOs", ["environment-api:slo:read"], classicCall),
            check("anomaly detectors and settings", ["settings:objects:read"], () => settingsObjectsClient.getSettingsObjects({ schemaIds: DETECTOR_SCHEMA, fields: "objectId", pageSize: 1 })),
            check("installed extensions (app views)", ["environment-api:extensions:read"], () => extensionsClient.listExtensions({ pageSize: 1 })),
            check("metric queries", ["storage:metrics:read", "storage:buckets:read"], dqlOne("metrics from: now()-1h | limit 1")),
            check("query history", ["storage:system:read", "storage:buckets:read"], dqlOne("fetch dt.system.events, from: now()-5m | limit 1")),
            check("writing the usage metrics", ["storage:metrics:write (or openpipeline:metrics:ingest)"], () => metricsClient.ingest({ body: "!" }), { accept: is400 }),
            check("writing the dashboard", ["document:documents:write"], documentWriteCall, { accept: is400 }),
          ]);

          const byName = new Map(results.map((r) => [r.name, r]));
          const missing = results.filter((r) => r.state === "missing");
          const unchecked = results.filter((r) => r.state === "unchecked");
          if (missing.length || unchecked.length) {
            // an admin check that follows a missing read permission is not blamed on its own: it needs the read permission too
            const blamed = missing.filter((r) => !(r.after && byName.get(r.after)?.state === "missing"));
            const permissions = [...new Set(blamed.flatMap((r) => (r.scopes && r.scopes.length ? r.scopes : r.permissions)))];
            const parts = [];
            if (permissions.length) {
              parts.push(
                `Permissions are missing: ${permissions.join(", ")}. The workflow's user needs each of them in its IAM policy, and each must be enabled in the Workflows app under Settings, Authorization settings (a permission that is only enabled there is not granted by it).` +
                  ` Refused: ${missing.map((r) => `${r.name} (${r.detail})`).join("; ")}.` +
                  ` Without admin access the workflow would only see the dashboards, notebooks and workflows its user owns or that are shared with them, and would report metrics as unused that are used on other users' private ones.`,
              );
            }
            if (unchecked.length) parts.push(`Could not be checked: ${unchecked.map((r) => `${r.name} (${r.detail})`).join("; ")}. A service did not answer; run the workflow again.`);
            throw new Error(`${parts.join(" ")} Nothing was analysed.`);
          }

          const v = (name) => byName.get(name)?.value;
          const classic = v("classic SLOs");
          return {
            permissions: "all checked permissions are granted",
            checked: results.length,
            notChecked: NOT_CHECKED,
            adminAccess: "granted",
            dashboards: v("dashboards (admin list)")?.totalCount,
            notebooks: v("notebooks (admin list)")?.totalCount,
            workflows: v("workflows (admin list)")?.count,
            classicSlos: classic?.available ? classic.total : "not available on this environment",
            extensions: v("installed extensions (app views)")?.totalCount,
          };
        }

  plan:
    name: plan
    position:
      x: 0
      y: 2
    description: Count the dashboards, notebooks and workflows (admin list), decide how many slices read them, and cut the query history of the last 30, 60 or 90 days (the input historyDays, 30 by default) into slices of time
    action: dynatrace.automations:run-javascript
    predecessors:
      - check_permissions
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, execution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 50000; // a metric with more series in the last hour is skipped: its sample would not give a valid ratio
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        /** Every artifact belongs to exactly one slice, whatever the order of the list. */
        function sliceOf(id, n) {
          let h = 0x811c9dc5;
          for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619) >>> 0;
          return h % n;
        }
        /** The classic SLO API (metric expression SLOs). It does not exist on every environment: a 404 "not available" means there are none to read. */
        const errorText = (e) => String(e && e.message ? e.message : e);
        /** The same parameters in every classic SLO call, so the count and the read agree: no evaluation (it limits the page to 25), enabled and disabled SLOs, global SLOs included. */
        const CLASSIC_SLO_PARAMS = { evaluate: "false", enabledSlos: "all", showGlobalSlos: true };
        const classicUnavailable = (e) => Number(e?.response?.status ?? e?.status ?? e?.statusCode) === 404 || /not available for this environment/i.test(errorText(e));
        async function classicSloCall(args) {
          let last;
          for (let attempt = 0; attempt < 4; attempt++) {
            try {
              return await classicSloClient.getSlo(args);
            } catch (e) {
              if (classicUnavailable(e)) return null; // no classic SLOs on this environment
              last = e;
              if (Number(e?.response?.status ?? e?.status ?? e?.statusCode) === 403 || /missing required scope|insufficient permission/i.test(errorText(e))) {
                throw new Error(`the classic SLO API refused the request (${errorText(e)}): the workflow's user needs the permission environment-api:slo:read. Without it the metric expressions of classic SLOs cannot be read, and metrics used only there would be reported as unused. Nothing was analysed.`);
              }
              await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
            }
          }
          throw last;
        }
        /** How many classic SLOs there are (0 if the API is not available on this environment). */
        async function classicSloTotal() {
          const r = await classicSloCall({ pageSize: 1, ...CLASSIC_SLO_PARAMS });
          return r ? Number(r.totalCount) || 0 : 0;
        }
        /** A list that is a little shorter than its total can be churn (artifacts deleted while paging); more than that is a gap. */
        function checkList(what, got, total) {
          if (typeof total === "number" && got < total - Math.max(5, Math.floor(total / 100))) throw new Error(`incomplete ${what} list: read ${got} of ${total}`);
        }

        // ---------------------------------------------------------------- listings of the plan
        // Every list is checked: the number of unique ids has to equal the total the API reports, and the total must not have changed while the
        // list was read (an item created or deleted meanwhile can move its neighbours between pages). If it changed, the list is read again.
        //
        // A failure of the plan has to say what happened, in the error and in the failure email, so that the reason can be read off a screenshot:
        //  - every platform call names itself (which call, the HTTP status, how many tries, how long, the platform's own words),
        //  - every list records the facts of each try (rows read, different ids, the platform's total before and after),
        //  - the time of every part, what has been counted so far (a table against the limit of one run), and what to do,
        //  - progress lines in the log of the step, which is all that is left when the platform ends the step itself (memory, time),
        //  - anything that is not a known cause is labeled as unexpected, with the raw message.
        const PHASES = []; // how long each part of the plan took
        const FOUND = { dashboards: null, notebooks: null, workflows: null, slos: null, classicSlos: null, detectors: null, extensions: null }; // what has been counted so far
        let LISTING = null; // what is being listed right now and how far it got, for the message when the listing takes too long

        const fmtNum = (n) => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        const secondsSince = (t) => Math.round((Date.now() - t) / 100) / 10;
        const clip = (s, n = 300) => String(s).replace(/\s+/g, " ").trim().slice(0, n);
        const httpStatus = (e) => Number(e?.response?.status ?? e?.status ?? e?.statusCode) || 0;
        const isRefused = (e) => httpStatus(e) === 401 || httpStatus(e) === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(errorText(e));

        const planGuard = () => {
          if (Date.now() - STARTED > PLAN_STOP_MS) {
            const where = LISTING ? ` the ${LISTING.what}: ${fmtNum(LISTING.read())} of ${fmtNum(LISTING.total)} listed in ${Math.round((Date.now() - STARTED) / 1000)} s` : "";
            throw Object.assign(new Error(`Listing the artifacts took longer than the plan may take (about ${Math.round(PLAN_STOP_MS / 1000)} s):${where || " this tenant has more of them than one run can list"}.`), { concrete: true, advice: "Run the workflow again. If it fails again, this tenant has more artifacts than one run can list: send this message to the workflow owner." });
          }
        };

        /** One part of the plan, timed and logged: the log is what remains if the platform ends the step. */
        async function timed(name, fn) {
          const t = Date.now();
          console.log(`plan: ${name} ...`);
          try {
            const r = await fn();
            PHASES.push({ name, seconds: secondsSince(t), ok: true });
            console.log(`plan: ${name} done in ${secondsSince(t)} s`);
            return r;
          } catch (e) {
            PHASES.push({ name, seconds: secondsSince(t), ok: false });
            console.log(`plan: ${name} FAILED after ${secondsSince(t)} s: ${clip(errorText(e))}`);
            throw e;
          }
        }

        /** One platform call, retried by retry(), that names itself in its error: which call, the HTTP status, how many tries, how long, and the platform's own words. */
        async function traced(label, fn) {
          let tries = 0;
          const t = Date.now();
          try {
            return await retry(() => {
              tries++;
              return fn();
            });
          } catch (e) {
            if (e && e.concrete) throw e;
            const status = httpStatus(e);
            const refused = isRefused(e);
            const how = refused
              ? `${label} was refused${status ? ` (HTTP ${status})` : ""}`
              : `${label} failed: ${status ? `the platform answered HTTP ${status}` : "the call failed"} ${tries === 1 ? "on the first try" : `${tries} times in a row`} (${secondsSince(t)} s)`;
            throw Object.assign(new Error(`${how}. Platform message: "${clip(errorText(e))}".`), {
              concrete: true,
              advice: refused ? "Give the workflow's user the permission named in the platform message (guide, step 3), then run the workflow again." : undefined,
            });
          }
        }

        /**
         * What was found against the limit of one run: a markdown table that the error of the step and the failure email both carry, so that the artifact kind that
         * is too big can be read off it. The limits are those of MAX_SLICES slices (a slice reads all kinds at the same time, so the kind that needs the most slices sets the number).
         * A kind that has not been counted (the count failed, or was not reached) says so.
         */
        function sizing(f) {
          const both = f.dashboards === null || f.workflows === null ? null : f.dashboards + f.workflows;
          const rows = [
            ["Notebooks", "notebooks", f.notebooks, MAX_SLICES * NOTEBOOKS_PER_SLICE, ""],
            ["Dashboards and workflows together", "dashboards and workflows", both, MAX_SLICES * SLICE_SIZE, ` (${f.dashboards === null ? "?" : fmtNum(f.dashboards)} dashboards + ${f.workflows === null ? "?" : fmtNum(f.workflows)} workflows)`],
            ["Platform SLOs", "platform SLOs", f.slos, MAX_SLICES * SLO_PAGES_PER_SLICE * SLO_PAGE_SIZE, ""],
            ["Classic SLOs", "classic SLOs", f.classicSlos, MAX_CLASSIC_SLOS, ""],
            ["Anomaly detectors", "anomaly detectors", f.detectors, MAX_SLICES * DETECTORS_PER_SLICE, ""],
            ["Installed extensions", "installed extensions", f.extensions, MAX_EXTENSIONS, ""],
          ];
          const lines = ["| Artifacts | Found | Limit of one run | |", "|---|---:|---:|---|"];
          const over = [];
          for (const [name, noun, found, limit, detail] of rows) {
            if (found === null) {
              lines.push(`| ${name}${detail} | not counted | ${fmtNum(limit)} | ? |`);
              continue;
            }
            const isOver = found > limit;
            if (isOver) over.push(noun);
            lines.push(`| ${name}${detail} | ${fmtNum(found)} | ${fmtNum(limit)} | ${isOver ? `**over by ${fmtNum(found - limit)}**` : "ok"} |`);
          }
          return { table: lines.join("\n"), over };
        }
        const NOTHING_ANALYSED = "Nothing was analysed, because a partial read would report metrics that are in use as unused.";
        const DEFAULT_ADVICE = "Run the workflow again. If it fails again, send this message to the workflow owner.";

        /** The final error of the plan: the cause, the facts of the tries, the times, what was counted against the limits, and what to do. */
        function describeFailure(e) {
          if (e && e.final) return e; // a tenant that is too big: the message is complete
          const head = e && e.concrete ? e.message : `Unexpected error in the step plan (not one of the known causes): ${clip(errorText(e), 500)}`;
          const timings = PHASES.length ? `Timings: ${PHASES.map((p) => `${p.name} ${p.seconds} s${p.ok ? "" : " (failed)"}`).join("; ")}.` : "";
          return new Error([head, e && e.facts, timings, sizing(FOUND).table, `${NOTHING_ANALYSED}\nWhat to do: ${(e && e.advice) || DEFAULT_ADVICE}`].filter(Boolean).join("\n\n"));
        }

        /**
         * Every workflow id (admin access). The API returns 100 per page and about 2 pages a second, so the pages are read 4 at a time.
         * The pages are read sorted by id. The default order moves with every edit of a workflow, and offset paging through a moving order returned some ids
         * twice and skipped others (seen on a development tenant with 172 workflows, and on a tenant where the list never added up), so the list did not match its
         * total however often it was read. The id never changes, so the order stays put. If the platform does not accept the sort, the default order is used.
         * Real churn (a workflow created or deleted while the pages are read) moves the total; a difference of a few ids is then not a gap.
         *
         * A list can still miss its total with a stable total (seen on a customer tenant: 4,752 rows read, 4,751 different, the same in every try). Two causes look alike:
         *  - the pages overlap at a boundary: one id is read twice and another is skipped. The boundary moves with the page size, so every try reads with another
         *    page size (100, 99, 97) and the ids of all tries are united: when they reach the total, nothing is missing;
         *  - the platform lists one id twice (the total counts the repeated row): every try reads exactly the total in rows, and the tries, whose boundaries differ, find
         *    the same ids. The repeated row is then data, not a paging effect, and the list is complete.
         * Anything else (ids that no page size returns, a total that keeps moving) still fails, and the message names the repeated ids and where they were read.
         */
        const WORKFLOW_PAGE_SIZES = [100, 99, 97];
        async function listAllWorkflowIds() {
          let sort = "id";
          const getPage = (offset, limit) => traced(`Listing the workflows (automation API, admin access, offset ${offset})`, () => workflowsClient.getWorkflows({ limit, offset, adminAccess: true, ...(sort ? { sort } : {}) }));
          const tolerance = (n) => Math.max(5, Math.floor(n / 100));
          const tries = [];
          const united = new Set();
          const sets = [];
          for (let attempt = 0; attempt < WORKFLOW_PAGE_SIZES.length; attempt++) {
            const size = WORKFLOW_PAGE_SIZES[attempt];
            let first;
            try {
              first = await getPage(0, size);
            } catch (e) {
              if (!sort || !/sort/i.test(errorText(e))) throw e;
              sort = null; // not accepted by this platform version
              first = await getPage(0, size);
            }
            const total = Number(first.count) || 0;
            const pos = new Map(); // id -> position of its first read
            const repeated = []; // [id, first position, position of the repeat]
            const take = (page, offset) => page.results.forEach((w, i) => { if (pos.has(w.id)) repeated.push([w.id, pos.get(w.id), offset + i]); else pos.set(w.id, offset + i); });
            take(first, 0);
            let rows = first.results.length;
            let pages = 1;
            LISTING = { what: "workflows", total, read: () => pos.size };
            const offsets = [];
            for (let o = size; o < total; o += size) offsets.push(o);
            await pmap(offsets, 4, async (offset) => {
              planGuard();
              const page = await getPage(offset, size);
              rows += page.results.length;
              pages++;
              take(page, offset);
              if (pages % 10 === 0) console.log(`plan: workflows ${fmtNum(pos.size)} of ${fmtNum(total)} listed (${secondsSince(STARTED)} s)`);
            });
            const after = Number((await traced("Counting the workflows again (automation API, admin access)", () => workflowsClient.getWorkflows({ limit: 1, adminAccess: true }))).count);
            const ids = new Set(pos.keys());
            for (const id of ids) united.add(id);
            sets.push(ids);
            tries.push({ rows, different: ids.size, total, after, pages, size, repeated: repeated.sort((x, y) => x[2] - y[2]).slice(0, 5) });
            if (ids.size === total && after === total) return [...ids];
            if (after !== total && Math.abs(ids.size - total) <= tolerance(total) && Math.abs(ids.size - after) <= tolerance(total)) return [...ids]; // created or deleted meanwhile
            // the pages of the tries overlapped at different places: together they have every id
            if (after === total && united.size === total) {
              console.log(`plan: the list of workflows is complete after ${attempt + 1} tries with different page sizes (${tries.map((t) => `${fmtNum(t.different)} of ${fmtNum(t.total)}`).join(", ")}; together ${fmtNum(united.size)})`);
              return [...united];
            }
            // the platform lists an id twice: every try read exactly the total in rows and found the same ids, though the pages were cut in other places
            if (attempt >= 1 && after === total && tries.every((t) => t.total === total && t.rows === total && t.different < total) && sets.every((x) => x.size === united.size)) {
              const t = tries[0];
              console.log(`plan: the platform lists ${fmtNum(total - united.size)} workflow id(s) twice (${t.repeated.map((r) => `${r[0]} at rows ${r[1] + 1} and ${r[2] + 1}`).join("; ")}); the ${fmtNum(united.size)} different ids were found with page sizes ${tries.map((x) => x.size).join(", ")}, so the list is complete`);
              return [...united];
            }
          }
          throw Object.assign(new Error("The list of workflows did not add up to its total after 3 tries."), {
            concrete: true,
            facts: [
              ...tries.map((t, i) => `Try ${i + 1}: ${fmtNum(t.rows)} rows read in ${t.pages} pages, ${fmtNum(t.different)} different${t.rows > t.different ? ` (${fmtNum(t.rows - t.different)} repeated)` : ""}, platform total ${fmtNum(t.total)} before and ${fmtNum(t.after)} after, page size ${t.size}${t.repeated.length ? `; repeated: ${t.repeated.map((r) => `${r[0]} at rows ${r[1] + 1} and ${r[2] + 1}`).join("; ")}` : ""}`),
              `All tries together: ${fmtNum(united.size)} different ids, the platform total is ${fmtNum(tries.length ? tries[tries.length - 1].total : 0)}.`,
              `(page sizes ${WORKFLOW_PAGE_SIZES.join(", ")}, ${sort ? "sorted by id" : "default order: the platform did not accept the sort"})`,
            ].join("\n"),
          });
        }

        /** The creation times of all anomaly detectors, sorted, to cut them into ranges of about the same size. */
        async function listDetectorCreated(total) {
          const out = [];
          let nextPageKey;
          let page = 0;
          LISTING = { what: "anomaly detectors", total, read: () => out.length };
          do {
            planGuard();
            const res = await traced(`Listing the anomaly detectors (settings API, page ${page + 1})`, () => settingsObjectsClient.getSettingsObjects(nextPageKey ? { nextPageKey } : { schemaIds: DETECTOR_SCHEMA, fields: "objectId,created", pageSize: 500, sort: "created" }));
            for (const o of arr(res.items)) out.push(Number(o.created));
            nextPageKey = res.nextPageKey;
            page++;
            if (page % 10 === 0) console.log(`plan: anomaly detectors ${fmtNum(out.length)} of ${fmtNum(total)} listed (${secondsSince(STARTED)} s)`);
          } while (nextPageKey);
          return out;
        }
        // a field can only be used in a filter if it is also requested
        const detectorCount = async (filter) => Number((await traced("Counting the anomaly detectors (settings API)", () => settingsObjectsClient.getSettingsObjects({ schemaIds: DETECTOR_SCHEMA, fields: "objectId,created", pageSize: 1, ...(filter ? { filter } : {}) }))).totalCount) || 0;

        /** n half-open ranges of creation time, {from, to} (null = open), that together hold every anomaly detector exactly once. */
        async function splitDetectors(total, n) {
          const tries = [];
          for (let attempt = 0; attempt < 3; attempt++) {
            const created = await listDetectorCreated(total);
            if (created.length !== total) {
              tries.push(`Try ${attempt + 1}: ${fmtNum(created.length)} creation times read, the platform counted ${fmtNum(total)}`);
              total = await detectorCount();
              continue;
            }
            const cuts = [];
            for (let k = 1; k < n; k++) {
              const v = created[Math.floor((k * created.length) / n)];
              if (!cuts.length || v > cuts[cuts.length - 1]) cuts.push(v);
            }
            const ranges = [];
            let prev = null;
            for (const c of cuts) {
              ranges.push({ from: prev, to: c });
              prev = c;
            }
            ranges.push({ from: prev, to: null });
            // the ranges have to add up to the total
            const counts = await Promise.all(ranges.map((r) => detectorCount([r.from !== null ? `created >= ${r.from}` : "", r.to !== null ? `created < ${r.to}` : ""].filter(Boolean).join(" and "))));
            const sum = counts.reduce((a, b) => a + b, 0);
            const again = await detectorCount();
            if (sum === total && again === total) return ranges;
            tries.push(`Try ${attempt + 1}: ${ranges.length} ranges added up to ${fmtNum(sum)}, the platform counted ${fmtNum(total)} before and ${fmtNum(again)} after`);
            total = again;
          }
          throw Object.assign(new Error("The anomaly detectors kept changing while they were split into ranges (3 tries)."), { concrete: true, facts: tries.join("\n") });
        }

        /**
         * The executed-query history is counted in slices of time, run side by side: a scan of 90 days is too much for one task on a tenant with a large history
         * (a task is stopped by the platform at 120 s). The number of slices follows the size of the history: the events of the last two days, as a daily rate, times
         * 90, divided by what one slice reads (HISTORY_EVENTS_PER_SLICE), and the different query texts of the last two days, as a daily rate, times 90, divided by
         * what one slice may hand over (HISTORY_TEXTS_PER_SLICE): the larger of the two numbers of slices. A small history is one slice, as before. If the size cannot be found out, the plan uses
         * DEFAULT_HISTORY_SLICES: more slices than needed cost little, too few can time out.
         * The slices are ranges of absolute time [from, to) that follow each other without a gap or an overlap, and the 30 and 60 day limits are absolute times too,
         * so that every slice counts the runs of the three windows exactly as one scan of the whole history would.
         */
        /** The input historyDays: 30 (default), 60 or 90 days of executed queries are counted. A longer window is a longer, larger run (on the largest customer tenant the older days were about 10 times as large as the recent ones). */
        async function readHistoryDays() {
          let days = HISTORY_DAYS_DEFAULT;
          let note = "";
          try {
            const ex = await execution();
            const raw = { ...(ex && ex.params), ...(ex && ex.input) }.historyDays; // the platform puts the input into execution().input; params is empty there (final52)
            if (raw !== undefined && raw !== null && raw !== "") {
              const p = Math.floor(Number(raw));
              if (p === 30 || p === 60 || p === 90) days = p;
              else note = `the input historyDays (${JSON.stringify(raw)}) is not 30, 60 or 90: ${HISTORY_DAYS_DEFAULT} is used`;
            }
          } catch (e) {
            note = `the input of the run could not be read (${clip(errorText(e), 150)}): the default ${HISTORY_DAYS_DEFAULT} days are used`;
          }
          if (note) console.log(`plan: ${note}`);
          return { days, note };
        }

        async function planHistory(startedAtMs, historyDays) {
          let perDay = null;
          let distinctPerDay = null;
          let note = "";
          try {
            const rows = await dql(`fetch dt.system.events, from: -2d\n| filter event.kind == "QUERY_EXECUTION_EVENT"\n| summarize n = count(), d = countDistinct(query_string)`, 10, 30, 2);
            const n = Number(rows[0] && rows[0].n);
            const d = Number(rows[0] && rows[0].d);
            if (Number.isFinite(n)) {
              perDay = n / 2;
              // what a slice hands over follows the number of DIFFERENT query texts (one text is counted once, however often it ran): a tenant that runs few texts
              // very often (15 million events a day, about 14,000 different texts) and one that runs many texts rarely (half a million events, 28,000 texts) differ
              if (Number.isFinite(d)) distinctPerDay = d / 2;
            } else note = "the count of the last two days was not a number";
          } catch (e) {
            note = clip(errorText(e), 200);
          }
          const estimate = perDay === null ? null : perDay * historyDays;
          const byTexts = distinctPerDay === null ? 1 : Math.ceil((distinctPerDay * historyDays) / HISTORY_TEXTS_PER_SLICE);
          const count = estimate === null ? DEFAULT_HISTORY_SLICES : Math.min(MAX_HISTORY_SLICES, Math.max(1, Math.ceil(estimate / HISTORY_EVENTS_PER_SLICE), byTexts));
          const day = 86400000;
          const start = startedAtMs - historyDays * day;
          const slices = Array.from({ length: count }, (_, i) => ({ slice: i, from: Math.round(start + (i * historyDays * day) / count), to: i === count - 1 ? startedAtMs : Math.round(start + ((i + 1) * historyDays * day) / count) }));
          console.log(`plan: query history ${perDay === null ? `size unknown (${note}): ${count} slices` : `about ${fmtNum(perDay)} events a day${distinctPerDay === null ? "" : ` of ${fmtNum(distinctPerDay)} different query texts`}, ${fmtNum(estimate)} in ${historyDays} days: ${count} slice${count === 1 ? "" : "s"} of about ${(historyDays / count).toFixed(1)} days`}`);
          return {
            historySliceIds: slices.map((x) => x.slice),
            historySlices: slices,
            historyCuts: { t30: startedAtMs - 30 * day, t60: startedAtMs - 60 * day },
            historyDays,
            historyWindows: [30, 60, 90].filter((w) => w <= historyDays), // the windows that are counted: the merge writes only these and the dashboard offers only these
            historyBytesPerSlice: HISTORY_SLICE_BYTES,
            historyTotalBytes: HISTORY_TOTAL_BYTES,
            historyEventsPerDay: perDay === null ? null : Math.round(perDay),
            historyTextsPerDay: distinctPerDay === null ? null : Math.round(distinctPerDay),
          };
        }

        async function planMain() {
          const startedAtMs = Date.now(); // every metric line of this run is stamped with this time, so one run is one snapshot
          // the counts first (one cheap call each): a tenant that is too big is refused before the long listing, with the whole table
          await timed("counting", async () => {
            const jobs = [
              ["dashboards", () => traced("Counting the dashboards (documents API, admin access)", () => documentsClient.listDocuments({ filter: "type == 'dashboard'", pageSize: 1, adminAccess: true })), (r) => Number(r.totalCount) || 0],
              ["notebooks", () => traced("Counting the notebooks (documents API, admin access)", () => documentsClient.listDocuments({ filter: "type == 'notebook'", pageSize: 1, adminAccess: true })), (r) => Number(r.totalCount) || 0],
              ["slos", () => traced("Counting the platform SLOs (SLO API)", () => serviceLevelObjectivesClient.getSlos({ pageSize: 1 })), (r) => Number(r.totalCount) || 0],
              ["detectors", () => traced("Counting the anomaly detectors (settings API)", () => settingsObjectsClient.getSettingsObjects({ schemaIds: DETECTOR_SCHEMA, fields: "objectId", pageSize: 1 })), (r) => Number(r.totalCount) || 0],
              ["workflows", () => traced("Counting the workflows (automation API, admin access)", () => workflowsClient.getWorkflows({ limit: 1, adminAccess: true })), (r) => Number(r.count) || 0],
              ["extensions", () => traced("Counting the installed extensions (extensions API)", () => extensionsClient.listExtensions({ pageSize: 1 })), (r) => Number(r.totalCount) || 0],
              [
                "classicSlos",
                async () => {
                  try {
                    return await classicSloTotal();
                  } catch (e) {
                    throw Object.assign(new Error(`Counting the classic SLOs (classic SLO API) failed: ${errorText(e)}`), { concrete: true });
                  }
                },
                (r) => r,
              ],
            ];
            const results = await Promise.allSettled(jobs.map(([, run]) => run()));
            const failures = [];
            results.forEach((r, i) => {
              const [key, , pick] = jobs[i];
              if (r.status === "fulfilled") FOUND[key] = pick(r.value);
              else failures.push(r.reason);
            });
            if (failures.length) {
              const lines = failures.map((f) => (f && f.concrete ? f.message : `Unexpected error: ${clip(errorText(f), 500)}`));
              throw Object.assign(new Error(lines.length === 1 ? lines[0] : `Counting failed in ${lines.length} calls:\n- ${lines.join("\n- ")}`), { concrete: true, advice: failures.map((f) => f && f.advice).find(Boolean) });
            }
          });
          const sloPages = Math.ceil(FOUND.slos / SLO_PAGE_SIZE);
          // a slice reads all kinds at the same time, so the kind that needs the most slices sets the number
          const slicesNeeded = () => Math.max(1, Math.ceil(FOUND.notebooks / NOTEBOOKS_PER_SLICE), Math.ceil((FOUND.dashboards + FOUND.workflows) / SLICE_SIZE), Math.ceil(sloPages / SLO_PAGES_PER_SLICE), Math.ceil(FOUND.detectors / DETECTORS_PER_SLICE));
          const assertFits = () => {
            const { table, over } = sizing(FOUND);
            if (!over.length) return;
            const slices = slicesNeeded();
            throw Object.assign(new Error(`This tenant is larger than one run supports: too many ${over.join(" and ")}.\n\n${table}\n\n${slices > MAX_SLICES ? `The run would need ${slices} slices; one run supports ${MAX_SLICES}. ` : ""}${NOTHING_ANALYSED}\nWhat to do: this tenant needs a larger version of the workflow. Send this message to the workflow owner.`), { final: true });
          };
          assertFits();
          const workflowIds = await timed("listing the workflows", () => listAllWorkflowIds());
          FOUND.workflows = workflowIds.length;
          assertFits();
          const { dashboards, notebooks, workflows, slos, classicSlos, detectors } = FOUND;
          const artifacts = dashboards + notebooks + workflows + slos + classicSlos + detectors;
          const sliceCount = slicesNeeded();
          // detectors are read in ranges of creation time, one range per slice; a small number is read by slice 0 alone
          const detectorRanges = detectors > DETECTORS_PER_SLICE ? await timed("splitting the anomaly detectors", () => splitDetectors(detectors, sliceCount)) : [];
          // the installed extensions are read in slices of EXTENSIONS_PER_SLICE, at least one (a slice with nothing to read still reports that it is complete)
          const extensionSlices = Array.from({ length: Math.max(1, Math.ceil(FOUND.extensions / EXTENSIONS_PER_SLICE)) }, (_, i) => i);
          // the classic SLOs are read by a slice of their own, after the slices that share the documents, the SLO pages and the detectors
          const classicSlice = classicSlos > 0 ? sliceCount : null;
          const slices = Array.from({ length: sliceCount + (classicSlice === null ? 0 : 1) }, (_, i) => i);
          const history = await timed("sizing the query history", async () => planHistory(startedAtMs, (await readHistoryDays()).days));
          return { startedAtMs, dashboards, notebooks, workflows, workflowIds, slos, classicSlos, sloPages, detectors, detectorRanges, artifacts, sliceCount, classicSlice, slices, extensions: FOUND.extensions, extensionLimit: MAX_EXTENSIONS, extensionSlices, ...history, timings: PHASES };
        }

        export default async function () {
          try {
            return await planMain();
          } catch (e) {
            throw describeFailure(e);
          }
        }

  select_metrics:
    name: select_metrics
    position:
      x: 1
      y: 2
    description: Pick the metrics to analyse, the largest by data points (10,000 by default; the input maxMetrics), and count how much of the total they hold; every later step uses this one list
    action: dynatrace.automations:run-javascript
    predecessors:
      - check_permissions
    input:
      script: |
        import { documentsClient } from "@dynatrace-sdk/client-document";
        import { workflowsClient } from "@dynatrace-sdk/client-automation";
        import { serviceLevelObjectivesClient } from "@dynatrace-sdk/client-service-level-objectives";
        import { metricsClient, settingsObjectsClient, extensions_2_0Client as extensionsClient, serviceLevelObjectivesClient as classicSloClient } from "@dynatrace-sdk/client-classic-environment-v2";
        import { queryExecutionClient } from "@dynatrace-sdk/client-query";
        import { actionExecution, execution, result } from "@dynatrace-sdk/automation-utils";

        const METRIC = "custom.metrics_usage.artifacts";
        const SCOPE_METRIC = "custom.metrics_usage.artifact_scope";
        const DIM_METRIC = "custom.metrics_usage.artifact_dimensions";
        const SERIES_METRIC = "custom.metrics_usage.series";
        const UNUSED_METRIC = "custom.metrics_usage.unused_dimensions";
        const WINDOW_DAYS = 30; // executed-query window used to decide which dimensions are used (the dashboard default)
        const SERIES_CAP = 50000; // a metric with more series in the last hour is skipped: its sample would not give a valid ratio
        const SERIES_CONCURRENCY = 8;
        const SERIES_BATCH = 10;
        const SLICE_SIZE = 500; // dashboards and workflows per slice (final51; 1,500 before): about 0.03 s each. A slice of the largest customer tenant read about 560 dashboards, 400 notebooks, 520 workflows, 4,000 SLOs and 1,172 detectors in 70-87 s of the 100 s it may take, and some slices ran out of memory: smaller slices leave room
        const NOTEBOOKS_PER_SLICE = 100; // notebooks per slice (final51; 400 before): two at a time, about 0.1 s each (a slice reads dashboards and notebooks at the same time); a notebook with cached results can be tens of MB
        const CLASSIC_SLO_PAGE = 5000; // classic SLOs are paged by cursor only (up to 10,000 a page); slice 0 reads them all
        const MAX_CLASSIC_SLOS = 40000; // slice 0 reads them one page after the other: this many is a few dozen seconds
        const SLO_PAGE_SIZE = 500; // the largest page the SLO API returns
        const SLO_PAGES_PER_SLICE = 3; // 1,500 platform SLOs per slice (final51; 5,000 before; a page is one call of about 500 KB)
        const DETECTORS_PER_SLICE = 1500; // anomaly detectors per slice (final51; 5,000 before)
        const PLAN_STOP_MS = 90000; // the plan has to finish its listings within this
        const DETECTOR_SCHEMA = "builtin:davis.anomaly-detectors";
        const MAX_EXTENSIONS = 300; // installed extensions one run reads: the plan refuses a tenant with more (the largest customer tenant seen has 234)
        const EXTENSIONS_PER_SLICE = 100; // installed extensions per slice of the extension reading: about 100 packages in 20 to 40 s, three at a time
        const MAX_SLICES = 120; // slices of the artifact reading (final51; 40 before). The packed counts of a slice are about 30-60 KB: 120 slices are about 7 MB, and the combined results of a loop passed at 36 MB (a loop of 200 iterations ran on the development tenant)
        const HISTORY_DAYS = 90; // the longest executed-query history that is counted (the input historyDays chooses 30, 60 or 90 days; the dashboard offers the windows that were counted)
        const HISTORY_DAYS_DEFAULT = 30; // used when the input historyDays is missing or not 30, 60 or 90
        const HISTORY_EVENTS_PER_SLICE = 15000000; // executed-query events one slice of the history reads: about 1 day of a tenant with 15 million a day. The database hands over the words of the distinct queries (measured on that tenant: 2 days = 27,818 distinct queries = 53 MB, 17 s), the matching is done in the task: a slice of this size is about 27 MB, a task holds it in memory (256 MB)
        const HISTORY_TEXTS_PER_SLICE = 8000; // different executed-query texts one slice may read: the database hands over the words of each (about 1.9 KB each on the largest tenant, so about 15 MB; a task of 256 MB holds about 20 MB of words, see TOKENS_MAX_BYTES)
        const MAX_HISTORY_SLICES = 200; // the packed counts of a slice are about 60 KB, so the results of all slices stay far below the 30 MB the next step may receive
        const DEFAULT_HISTORY_SLICES = 90; // used when the plan cannot estimate how large the history is (a day each: the largest tenant seen has about 15 million events a day)
        const HISTORY_SLICE_BYTES = 2000000; // what one history slice may hand over, packed. The result of one iteration of a loop is refused above about 6.5 MB (6,000 KB passed, 7,000 KB failed on 2026-11-23). The largest customer tenant: slices of its recent days are 60-110 KB, slices of 25 Oct to 4 Nov 1.2-1.3 MB (many large queries that each name many metrics and dimensions)
        const HISTORY_TOTAL_BYTES = 34000000; // what all history slices together may hand over: the combined results of a loop passed at 36 MB (not tried beyond). The merge step checks the sum; a share per slice (total divided by the number of slices) was too strict, because the size of the slices differs a lot // metric keys read with one query
        const STARTED = Date.now();
        const HISTORY_TIMEOUT_S = 90; // the 30-day query-history analysis must finish within this
        // A JavaScript action is stopped by the platform at 120 s (the task timeout setting does not raise it), so the task stops itself earlier.
        const ARTIFACT_STOP_MS = 100000; // no artifact is read after this (a slice is sized to take far less)
        const SERIES_STOP_MS = 100000; // no metric is queried for the series estimate after this
        const BILLABLE_FILTER = `(startswith(grail.metric.key, "dt.service.")
          or startswith(grail.metric.key, "dt.cloud.aws")
          or startswith(grail.metric.key, "dt.cloud.azure")
          or startswith(grail.metric.key, "dt.osservice.")
          or NOT startswith(grail.metric.key, "dt."))
        and not in(grail.metric.key,
          "dt.cloud.aws.az.running",
          "dt.cloud.azure.region.vms.initializing",
          "dt.cloud.azure.region.vms.running",
          "dt.cloud.azure.region.vms.stopped",
          "dt.cloud.azure.vm_scale_set.vms.initializing",
          "dt.cloud.azure.vm_scale_set.vms.running",
          "dt.cloud.azure.vm_scale_set.vms.stopped")
        and isnull(grail.monitoring_source)
        and grail.bucket.name!="dt_system_metrics"
        and grail.metric.key!="..."`;
        const CONCURRENCY = 4; // concurrent downloads in a slice: many very large documents in memory at once ran a slice out of memory at 16
        const OWN = "moprs_series";
        const MAX_TOKEN_LENGTH = 200; // dimension values are limited in length
        const MAX_LINES = 200000; // safety cap: refuse to ingest an unexpectedly large snapshot (10,000 analysed metrics: about 6 lines each, one more each as a marker, and a few numbers)

        // ---------------------------------------------------------------- helpers
        const obj = (v) => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
        const arr = (v) => (Array.isArray(v) ? v : []);
        const str = (v) => (typeof v === "string" ? v : "");
        const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const KEYCH = "[A-Za-z0-9_.\\-]";
        /** Whole-token matcher: `a.b` must not match inside `a.b.c`. */
        const tok = (s) => new RegExp(`(?<!${KEYCH})${escapeRegex(s)}(?!${KEYCH})`);

        /** A refused request (HTTP 401/403, or a message that says so) is a permission problem: it is not retried. */
        const permanent = (e) => {
          const status = Number(e?.response?.status ?? e?.status ?? e?.statusCode);
          return status === 401 || status === 403 || /forbidden|insufficient permission|not authori[sz]ed|permission denied|missing required scope/i.test(String(e && e.message ? e.message : e));
        };

        async function retry(fn, attempts = 5) {
          let last;
          for (let n = 0; n < attempts; n++) {
            try {
              return await fn();
            } catch (e) {
              last = e;
              if (permanent(e)) throw e;
              await new Promise((r) => setTimeout(r, 500 * (n + 1)));
            }
          }
          throw last;
        }

        async function dql(query, max = 20000, fetchTimeout = 300, attempts = 5) {
          return retry(async () => {
            const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: fetchTimeout, enablePreview: false } });
            let state = start.state;
            let result = start.result;
            const token = start.requestToken;
            while (state !== "SUCCEEDED") {
              if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`query ${state}`);
              if (!token) throw new Error("query returned no request token");
              const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: 30000 });
              state = poll.state;
              result = poll.result;
            }
            return arr(result?.records).filter((r) => r !== null);
          }, attempts);
        }

        /** The 30-day query-history analysis: a timeout is not retried (it would only be killed by the platform), a quick failure is retried once. */
        async function dqlHistory(query, max = 20000) {
          let last;
          for (let n = 0; n < 2; n++) {
            try {
              return await dql(query, max, HISTORY_TIMEOUT_S, 1);
            } catch (e) {
              last = e;
              if (Date.now() - STARTED > 30000) break;
            }
          }
          throw new Error(`the 30-day query-history analysis did not finish within ${HISTORY_TIMEOUT_S} s (${String(last && last.message ? last.message : last)}): too many executed queries for one run`);
        }

        /** A list that has to be complete: a result that reaches its limit may be cut off, which would leave items out silently, so it stops the run instead. */
        async function dqlAll(query, max, what) {
          const recs = await dql(query, max);
          if (recs.length >= max) throw new Error(`${what}: the result reached its limit of ${max} rows and may be cut off, so nothing was analysed. Send this message to the workflow owner.`);
          return recs;
        }

        async function pmap(items, limit, fn) {
          const out = new Array(items.length);
          let next = 0;
          const worker = async () => {
            while (next < items.length) {
              const i = next++;
              out[i] = await fn(items[i], i);
            }
          };
          await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
          return out;
        }

        /** Queries that analyse ingest cost or shape instead of consuming a metric's data; they count as no usage of any token. */
        function isAnalysisQuery(q) {
          return (
            q.includes("dt.sfm.metrics.ingest.datapoints") ||
            q.includes(OWN) ||
            q.includes("timeseries val=count(") ||
            (q.includes("QUERY_EXECUTION_EVENT") && q.includes("query_string")) ||
            /countDistinct\(\s*array\(/.test(q) ||
            /\|\s*limit\s+0\s*$/.test(q)
          );
        }
        /** `metrics | filter metric.key == "<key>"` (optionally `| limit N`) is dimension discovery for that one key only. */
        const DISCOVERY = /^\s*metrics\s*\|\s*filter\s+metric\.key\s*==\s*"([^"]+)"\s*(\|\s*limit\s+\d+\s*)?$/;


        // ---------------------------------------------------------------- select_metrics
        // Which metrics does the run analyse? A tenant can have far more billable metrics than one run can analyse (one customer tenant has 135,617: reading the
        // whole list of keys was cut at 20,000 without any message, and the metrics behind the cut would have been reported as unused although they are in use).
        // The run analyses the largest metrics by data points, the number of the metrics that carry the cost: on that tenant the largest 10,000 hold 99.25% of the data
        // points, the largest 15,000 99.83%, the largest 20,000 99.92%. The metrics below the cut are not analysed, so they can never be recommended for dropping.
        // This is the one place where the list is made; every later step reads it from the result of this one, so that all of them see the same metrics.
        //   maxMetrics (workflow input, default 10,000): how many of the largest metrics are analysed; limited to 100 - 20,000 (the caps of the later steps are sized for that).
        // The data points are those of the report: the last 30 days, a histogram counts ten times (but not the dt.service metrics). The order is by data points, then by key,
        // so that a tie at the cut is always decided the same way.
        const ANALYZED_DEFAULT = 10000;
        const ANALYZED_MIN = 100;
        const ANALYZED_MAX = 20000;
        const SELECT_DEADLINE_MS = 105000; // a query that has not finished by then is cancelled: the platform ends a task at 120 s without saying why

        const RANKED = `timeseries from:now()-30d, interval:1d
        , data_points = sum(dt.sfm.metrics.ingest.datapoints, rate:24h)
        , by:{grail.metric.key, grail.metric.type}
        , filter:${BILLABLE_FILTER}
        | fieldsAdd dp = arraySum(data_points) * if(grail.metric.type == "histogram" and not startswith(grail.metric.key, "dt.service."), 10, else:1)
        | summarize total = sum(dp), by:{grail.metric.key}`;

        /** One query, given up at the deadline of the task with a message of its own (a query still running is cancelled). */
        async function queryUntil(query, max, what) {
          const start = await queryExecutionClient.queryExecute({ body: { query, maxResultRecords: max, maxResultBytes: 200000000, fetchTimeoutSeconds: 60, enablePreview: false } });
          let state = start.state;
          let res = start.result;
          const token = start.requestToken;
          while (state !== "SUCCEEDED") {
            if (state === "FAILED" || state === "CANCELLED" || state === "RESULT_GONE") throw new Error(`the query for ${what} ${state}`);
            if (!token) throw new Error(`the query for ${what} returned no request token`);
            const left = SELECT_DEADLINE_MS - (Date.now() - STARTED);
            if (left <= 1000) {
              try {
                await queryExecutionClient.queryCancel({ requestToken: token });
              } catch {
                /* the task ends soon anyway */
              }
              throw new Error(`the query for ${what} had not finished after ${Math.round((Date.now() - STARTED) / 1000)} s and was cancelled: this tenant has more metrics than the ranking can be made of in one task`);
            }
            const poll = await queryExecutionClient.queryPoll({ requestToken: token, requestTimeoutMilliseconds: Math.min(30000, left) });
            state = poll.state;
            res = poll.result;
          }
          return arr(res?.records).filter((r) => r !== null);
        }

        export default async function () {
          const t0 = Date.now();
          let limit = ANALYZED_DEFAULT;
          let note = "";
          try {
            const ex = await execution();
            // the input of the run: the platform puts it into execution().input (with the defaults of the workflow); the field params, which the versions up to final52 read,
            // is empty there (an input of 1,000 metrics was ignored on the largest customer tenant, 2026-11-24)
            const raw = { ...(ex && ex.params), ...(ex && ex.input) }.maxMetrics;
            if (raw !== undefined && raw !== null && raw !== "") {
              const p = Math.floor(Number(raw));
              if (!Number.isFinite(p) || p <= 0) note = `the input maxMetrics (${JSON.stringify(raw)}) is not a number: ${ANALYZED_DEFAULT} is used`;
              else {
                limit = Math.min(ANALYZED_MAX, Math.max(ANALYZED_MIN, p));
                if (limit !== p) note = `the input maxMetrics (${p}) is outside ${ANALYZED_MIN} to ${ANALYZED_MAX}: ${limit} is used`;
              }
            }
          } catch (e) {
            note = `the input of the run could not be read (${String(e && e.message ? e.message : e).slice(0, 150)}): the default ${ANALYZED_DEFAULT} is used`;
          }
          if (note) console.log(`select_metrics: ${note}`);
          let summary;
          let top;
          try {
            [summary, top] = await Promise.all([
              queryUntil(`${RANKED}\n| summarize metrics = count(), all_dp = sum(total)`, 10, "the number of billable metrics"),
              queryUntil(`${RANKED}\n| sort total desc, grail.metric.key asc\n| limit ${limit}\n| fields grail.metric.key, total`, limit + 10, `the ${limit} largest metrics`),
            ]);
          } catch (e) {
            throw new Error(`Selecting the metrics to analyse failed: ${String(e && e.message ? e.message : e)}. Nothing was analysed. Run the workflow again; if it fails again, send this message to the workflow owner.`);
          }
          const totalMetrics = Number(summary[0]?.metrics) || 0;
          const totalDp = Number(summary[0]?.all_dp) || 0;
          if (!totalMetrics) throw new Error("Selecting the metrics to analyse found no billable metrics: nothing was analysed.");
          const expected = Math.min(limit, totalMetrics);
          const keys = top.map((r) => str(r["grail.metric.key"])).filter(Boolean);
          const dps = top.map((r) => Number(r.total) || 0);
          // the list has to be exactly the number asked for: a result that is shorter (or longer) than it should be would leave metrics out without a message
          if (keys.length !== expected || new Set(keys).size !== keys.length) {
            throw new Error(`Selecting the metrics to analyse returned ${keys.length} metrics (${new Set(keys).size} different), expected ${expected} of ${totalMetrics}. Nothing was analysed, because a list that is not complete would report used metrics as unused.`);
          }
          const analyzedDp = dps.reduce((a, b) => a + b, 0);
          const cut = totalMetrics > limit;
          const sharePct = totalDp > 0 ? (analyzedDp / totalDp) * 100 : 100;
          console.log(`select_metrics: ${totalMetrics} billable metrics; ${cut ? `the ${keys.length} largest are analysed (${sharePct.toFixed(2)}% of the data points; the smallest of them has ${Math.round(dps[dps.length - 1])})` : "all are analysed"}; limit ${limit}; ${Math.round((Date.now() - t0) / 100) / 10} s`);
          return {
            limit,
            note,
            cut,
            totalMetrics,
            analyzedMetrics: keys.length,
            totalDp,
            analyzedDp,
            sharePct,
            cutoffDp: dps.length ? dps[dps.length - 1] : 0,
            keys,
            dps,
            seconds: Math.round((Date.now() - t0) / 100) / 10,
          };
        }

