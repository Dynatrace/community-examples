metadata:
  version: '1'
  dependencies:
    apps:
    - id: dynatrace.automations
      version: ^1.3396.2
    - id: dynatrace.davis.workflow.actions
      version: ^1.10.1-dev.20260904T082413+888dabe0
    - id: dynatrace.email
      version: ^1.10.12-dev.20260902T065635+24171887
  inputs: []
workflow:
  title: Agentic Weekly Operations Report
  description: 'Weekly. Agentic AI reads the week against the prior week, decides
    what actually changed, and reports only what matters: shifts in volume and downtime,
    patterns that appeared or stopped, and the entities behind them.'
  schemaVersion: 4
  trigger:
    schedule:
      isActive: true
      trigger:
        cron: 0 8 * * 1
        type: cron
      filterParameters: {}
      timezone: Europe/Vienna
      inputs: {}
  result: null
  type: STANDARD
  input: {}
  hourlyExecutionLimit: 1000
  guide: null
  tasks:
    mail_report:
      name: mail_report
      input:
        cc: []
        to: []
        bcc: []
        content: '{{ result(''compose_report'').text or result(''compose_report'')
          }}


          ---


          Generated by the Agentic Weekly Operations Report workflow on https://umsaywsjuo.dev.apps.dynatracelabs.com.

          Execution: https://umsaywsjuo.dev.apps.dynatracelabs.com/ui/apps/dynatrace.automations/executions/{{
          execution().id }}'
        subject: Agentic Weekly Operations Report
      action: dynatrace.email:send-email
      position:
        x: 0
        y: 3
      conditions:
        states:
          compose_report: OK
      description: Mail the report
      predecessors:
      - compose_report
    top_entities:
      name: top_entities
      input:
        query: "fetch dt.davis.problems, from: -14d\n| filter not dt.davis.is_duplicate\
          \ and not maintenance.is_under_maintenance\n| dedup display_id\n| fieldsAdd\
          \ dur = toDuration(toLong(resolved_problem_duration))\n| fieldsAdd period\
          \ = if(event.start >= now() - 7d, \"this_week\", else: \"prior_week\")\n\
          | expand smartscape.affected_entities\n| fieldsAdd entity_name = smartscape.affected_entities[name],\
          \ entity_type = smartscape.affected_entities[type]\n| filter isNotNull(entity_name)\n\
          | summarize this_week = countIf(period == \"this_week\"),\n            prior_week\
          \ = countIf(period == \"prior_week\"),\n            downtime = sum(if(period\
          \ == \"this_week\", dur, else: toDuration(0))),\n            categories\
          \ = collectDistinct(event.category, maxLength: 3),\n            by: {entity_name,\
          \ entity_type}\n| fieldsAdd delta = this_week - prior_week, downtime_hours\
          \ = round(downtime / 1h, decimals: 1)\n| fieldsRemove downtime\n| filter\
          \ this_week > 0\n| sort downtime_hours desc\n| limit 12"
      action: dynatrace.automations:execute-dql-query
      position:
        x: 2
        y: 1
      description: Entities carrying the most downtime this week, with their prior
        week comparison
      predecessors: []
    volume_shift:
      name: volume_shift
      input:
        query: "fetch dt.davis.problems, from: -14d\n| filter not dt.davis.is_duplicate\
          \ and not maintenance.is_under_maintenance\n| dedup display_id\n| fieldsAdd\
          \ dur = toDuration(toLong(resolved_problem_duration))\n| fieldsAdd period\
          \ = if(event.start >= now() - 7d, \"this_week\", else: \"prior_week\")\n\
          | summarize problems = countIf(true), downtime = sum(dur), by: {period,\
          \ event.category}\n| summarize this_week = sum(if(period == \"this_week\"\
          , problems, else: 0)),\n            prior_week = sum(if(period == \"prior_week\"\
          , problems, else: 0)),\n            this_week_downtime = sum(if(period ==\
          \ \"this_week\", downtime, else: toDuration(0))),\n            prior_week_downtime\
          \ = sum(if(period == \"prior_week\", downtime, else: toDuration(0))),\n\
          \            by: {event.category}\n| fieldsAdd change_pct = if(prior_week\
          \ > 0, round((this_week - prior_week) * 100.0 / prior_week, decimals: 1),\
          \ else: null),\n            this_week_downtime_hours = round(this_week_downtime\
          \ / 1h, decimals: 1),\n            prior_week_downtime_hours = round(prior_week_downtime\
          \ / 1h, decimals: 1)\n| fieldsRemove this_week_downtime, prior_week_downtime\n\
          | sort this_week desc"
      action: dynatrace.automations:execute-dql-query
      position:
        x: 0
        y: 1
      description: Problem volume and downtime by category, this week against the
        prior week
      predecessors: []
    compose_report:
      name: compose_report
      input:
        prompt: 'You are writing this week''s operations report for the platform owner
          of the Dynatrace environment https://umsaywsjuo.dev.apps.dynatracelabs.com.
          Your job is not to recite metrics. It is to work out what changed, decide
          what is worth their attention, and say so.


          DATASET A, problem volume and downtime by category, this week against the
          prior week. change_pct is the percentage change in problem count:

          {{ result(''volume_shift'').records }}


          DATASET B, problem signatures classified against a three week baseline.
          shift is new_this_week (absent from the baseline), stopped_this_week (present
          in the baseline, gone now), or ongoing (high volume in both). baseline_weekly_avg
          is the baseline count divided by three, so compare it against this_week:

          {{ result(''pattern_shifts'').records }}


          DATASET C, the entities carrying the most downtime this week, with their
          prior week problem counts. delta is this week minus prior week:

          {{ result(''top_entities'').records }}


          Use exactly these section headings, in this order, each as a level 3 markdown
          heading:


          ### The week

          One paragraph. What changed, in plain language, with the numbers that justify
          it. If nothing materially changed, say that plainly in two sentences.


          ### What moved

          The three to five most significant changes, largest first, as a markdown
          table with columns: Change, This week, Prior week, Read. The Read column
          is your one line interpretation. Below the table, at most three sentences
          on the single most important row. A category whose count and downtime move
          in opposite directions means the mix of problems changed, so say which.


          ### New and stopped

          A markdown table with columns: Signature, Entity type, This week, Baseline
          weekly avg, Status. Status is New or Stopped. Then one line per new signature
          on why it matters. Treat new signatures as the highest value item in this
          report even when their counts are small. For stopped signatures, say whether
          it reads as a fix, a decommission, or monitoring that went silent, and how
          to tell the difference.


          ### Where the time went

          A markdown table of the top five entities by downtime, with columns: Entity,
          Type, Downtime (h), This week, Prior week, Direction. Direction is one word:
          worse, better, or flat.


          ### What to do first

          A numbered list of exactly three items, one sentence each, each naming the
          reason and the first check to run.


          Adapt to the data. Skip a section only if it is genuinely empty, and if
          you skip one say why in a single line. Do not pad a quiet week into a busy
          sounding report.


          Rules: ground every claim in the datasets and quote the numbers you rely
          on. Never invent an entity, a number or a cause that is not in the data.
          Where a number is suspicious, for example a huge count with a tiny median
          duration, say what would explain it rather than asserting one explanation.'
        instruction: 'You are a senior site reliability engineer briefing a platform
          owner who has ten minutes. Write GitHub flavoured markdown for an email,
          in English, under 700 words.


          OUTPUT CONTRACT, follow exactly:

          1. Do not print a document title, a date line, or an environment name. The
          email subject already carries them. Start with the conclusion.

          2. First line: one bold sentence, the single most important conclusion,
          under 25 words.

          3. Second element: a markdown table headed with the columns Metric, This
          week, Prior week, Change. Three to five rows, the numbers a reader would
          want first.

          4. Then exactly one blockquote line, starting with >, holding the one thing
          to act on.

          5. Section headings are level 3 (###) with the exact wording given in the
          task. No numbering prefixes such as 1. or 2. in headings.

          6. Every group of numbers goes in a markdown table with a header row, never
          in a running sentence.

          7. Paragraphs are three sentences maximum. Never bold a whole sentence to
          fake a heading.

          8. Never use em dashes or en dashes anywhere, including inside tables and
          headings. Use commas, colons, semicolons or parentheses.

          9. Durations in hours or minutes, never nanoseconds, rounded to one decimal.
          Percentages to whole numbers.

          10. No filler, no restating the question, no closing pleasantries, no sign
          off.


          Refer to the product as Dynatrace Intelligence, never as Davis.'
        outputFormat: ''
        supplementary: ''
        conversationId: ''
      action: dynatrace.davis.workflow.actions:prompt-agentic-ai
      timeout: 1800
      position:
        x: 0
        y: 2
      conditions:
        states:
          top_entities: OK
          volume_shift: OK
          pattern_shifts: OK
      description: Agentic AI decides what changed and writes the report
      predecessors:
      - volume_shift
      - pattern_shifts
      - top_entities
    pattern_shifts:
      name: pattern_shifts
      input:
        query: "fetch dt.davis.problems, from: -28d\n| filter not dt.davis.is_duplicate\
          \ and not maintenance.is_under_maintenance\n| dedup display_id\n| fieldsAdd\
          \ e = smartscape.affected_entities[0]\n| fieldsAdd entity_type = e[type],\
          \ entity_name = e[name]\n| fieldsAdd period = if(event.start >= now() -\
          \ 7d, \"this_week\", else: \"baseline\")\n| summarize this_week = countIf(period\
          \ == \"this_week\"),\n            baseline = countIf(period == \"baseline\"\
          ),\n            examples = collectDistinct(entity_name, maxLength: 3),\n\
          \            by: {event.name, entity_type, event.category}\n| fieldsAdd\
          \ baseline_weekly_avg = round(baseline / 3.0, decimals: 1)\n| fieldsAdd\
          \ shift = if(baseline == 0 and this_week >= 3, \"new_this_week\",\n    \
          \                else: if(this_week == 0 and baseline >= 10, \"stopped_this_week\"\
          ,\n                    else: \"ongoing\"))\n| filter shift != \"ongoing\"\
          \ or this_week >= 50\n| sort this_week desc\n| limit 25"
      action: dynatrace.automations:execute-dql-query
      position:
        x: 1
        y: 1
      description: Problem signatures that appeared this week, stopped this week,
        or stayed high, against a three week baseline
      predecessors: []
